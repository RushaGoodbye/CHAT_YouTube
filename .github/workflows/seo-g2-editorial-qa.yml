name: SEO G2 editorial QA
on:
  pull_request:
    paths:
      - "src/rg_youtube_control/seo_editorial_acceptance.py"
      - "src/rg_youtube_control/seo_evidence_records.py"
      - "src/rg_youtube_control/seo_source_cue_expansion.py"
      - "tests/test_seo_source_cue_expansion.py"
      - "tests/test_seo_lm_token_limit.py"
      - "src/rg_youtube_control/lm_studio_backend.py"
      - "src/rg_youtube_control/seo_evidence_recovery.py"
      - "tests/test_seo_editorial_acceptance.py"
      - "src/rg_youtube_control/seo_editorial_triage.py"
      - "tests/test_seo_editorial_triage.py"
      - "src/rg_youtube_control/seo_editorial_revision.py"
      - "tests/test_seo_editorial_revision.py"
      - "tests/test_seo_editorial_decision_import.py"
      - "tests/test_seo_editorial_decisions.py"
      - "tests/test_seo_g2_readiness_gate.py"
      - "tests/test_seo_long_block_windows.py"
      - "tests/test_seo_long_block_handoff.py"
      - "tests/test_seo_g3_batch_drafts.py"
      - "src/rg_youtube_control/seo_g3_batch_drafts.py"
      - "src/rg_youtube_control/seo_long_block_handoff.py"
      - "src/rg_youtube_control/seo_long_block_windows.py"
      - "src/rg_youtube_control/seo_g2_readiness_gate.py"
      - "src/rg_youtube_control/seo_editorial_decision_import.py"
      - "src/rg_youtube_control/seo_editorial_decisions.py"
      - "tests/test_seo_vague_revision.py"
      - "src/rg_youtube_control/seo_spoken_numbers.py"
      - "tests/test_seo_spoken_numbers.py"
      - "tests/test_seo_evidence_records.py"
      - "tests/test_seo_evidence_recovery.py"
      - "tests/test_seo_complete_quote_recovery.py"
      - "src/rg_youtube_control/seo_g2_cohort.py"
      - "tests/test_seo_g2_cohort.py"
      - "src/rg_youtube_control/seo_g2_quality_report.py"
      - "tests/test_seo_g2_quality_report.py"
      - "src/rg_youtube_control/seo_g2_numeric_risk.py"
      - "tests/test_seo_g2_numeric_risk.py"
  workflow_dispatch:
jobs:
  editorial-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test evidence and editorial review, never publish
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest -q tests/test_seo_editorial_acceptance.py tests/test_seo_editorial_triage.py tests/test_seo_editorial_revision.py tests/test_seo_evidence_records.py tests/test_seo_evidence_recovery.py tests/test_seo_spoken_numbers.py tests/test_seo_g2_cohort.py tests/test_seo_g2_quality_report.py tests/test_seo_g2_numeric_risk.py tests/test_seo_vague_revision.py tests/test_seo_complete_quote_recovery.py tests/test_seo_editorial_decisions.py tests/test_seo_editorial_decision_import.py tests/test_seo_g2_readiness_gate.py tests/test_seo_long_block_windows.py tests/test_seo_long_block_handoff.py tests/test_seo_g3_batch_drafts.py tests/test_seo_source_cue_expansion.py tests/test_seo_lm_token_limit.py
