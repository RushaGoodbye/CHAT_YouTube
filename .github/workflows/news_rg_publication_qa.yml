name: NEWS RG public publication offline QA
on:
  push:
    paths:
      - 'rg_remote_control/nas/monitoring/news_rg_approved_publication_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_approved_publication_cutover_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_durable_private_sender_v1.py'
      - '.github/workflows/news_rg_publication_qa.yml'
      - 'rg_remote_control/nas/monitoring/news_rg_no_card_root_cause_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_editorial_grounding_guard_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_guarded_auto_handoff_installer_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_verify_8052_and_next_tick_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_dsm_autonomy_readonly_audit_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_card_8054_unattended_audit_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_latest_private_publication_audit_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_stability_healthcheck_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_gatus_readonly_preflight_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_gatus_integration_inventory_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_gatus_health_push_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_gatus_inplace_cutover_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_manual_link_readonly_audit_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_manual_routing_live_preflight_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_manual_link_intake_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_manual_link_single_owner_install_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_manual_video_ua_upgrade_v2.py'
      - 'rg_remote_control/nas/monitoring/news_rg_video_watermark_handoff_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_manual_original_video_upgrade_v3.py'
      - 'rg_remote_control/nas/monitoring/news_rg_original_video_delivery_status_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_wrong_photo_supersession_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_wrong_photo_gate_upgrade_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_multi_card_guarded_upgrade_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_durable_private_dispatch_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_durable_private_sender_v1.py'
      - 'rg_remote_control/nas/monitoring/news_rg_editorial_callbacks_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and controlled rollback interface
        run: |
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_approved_publication_v1.py
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_approved_publication_cutover_v1.py
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_durable_private_sender_v1.py
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_no_card_root_cause_v1.py
          python rg_remote_control/nas/monitoring/news_rg_no_card_root_cause_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_editorial_grounding_guard_v1.py
          python rg_remote_control/nas/monitoring/news_rg_editorial_grounding_guard_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_guarded_auto_handoff_installer_v1.py
          python rg_remote_control/nas/monitoring/news_rg_guarded_auto_handoff_installer_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_verify_8052_and_next_tick_v1.py
          python rg_remote_control/nas/monitoring/news_rg_verify_8052_and_next_tick_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_dsm_autonomy_readonly_audit_v1.py
          python rg_remote_control/nas/monitoring/news_rg_dsm_autonomy_readonly_audit_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_card_8054_unattended_audit_v1.py
          python rg_remote_control/nas/monitoring/news_rg_card_8054_unattended_audit_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_latest_private_publication_audit_v1.py
          python rg_remote_control/nas/monitoring/news_rg_latest_private_publication_audit_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_stability_healthcheck_v1.py
          python rg_remote_control/nas/monitoring/news_rg_stability_healthcheck_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_gatus_readonly_preflight_v1.py
          python rg_remote_control/nas/monitoring/news_rg_gatus_readonly_preflight_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_gatus_integration_inventory_v1.py
          python rg_remote_control/nas/monitoring/news_rg_gatus_integration_inventory_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_gatus_health_push_v1.py
          python rg_remote_control/nas/monitoring/news_rg_gatus_health_push_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_gatus_inplace_cutover_v1.py
          python rg_remote_control/nas/monitoring/news_rg_gatus_inplace_cutover_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_manual_link_readonly_audit_v1.py
          python rg_remote_control/nas/monitoring/news_rg_manual_link_readonly_audit_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_manual_routing_live_preflight_v1.py
          python rg_remote_control/nas/monitoring/news_rg_manual_routing_live_preflight_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_manual_link_intake_v1.py
          python rg_remote_control/nas/monitoring/news_rg_manual_link_intake_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_manual_link_single_owner_install_v1.py
          python rg_remote_control/nas/monitoring/news_rg_manual_link_single_owner_install_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_manual_video_ua_upgrade_v2.py
          python rg_remote_control/nas/monitoring/news_rg_manual_video_ua_upgrade_v2.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_video_watermark_handoff_v1.py
          python rg_remote_control/nas/monitoring/news_rg_video_watermark_handoff_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_manual_original_video_upgrade_v3.py
          python rg_remote_control/nas/monitoring/news_rg_manual_original_video_upgrade_v3.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_original_video_delivery_status_v1.py
          python rg_remote_control/nas/monitoring/news_rg_original_video_delivery_status_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_wrong_photo_supersession_v1.py
          python rg_remote_control/nas/monitoring/news_rg_wrong_photo_supersession_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_wrong_photo_gate_upgrade_v1.py
          python rg_remote_control/nas/monitoring/news_rg_wrong_photo_gate_upgrade_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_multi_card_guarded_upgrade_v1.py
          python rg_remote_control/nas/monitoring/news_rg_multi_card_guarded_upgrade_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_durable_private_dispatch_v1.py
          python rg_remote_control/nas/monitoring/news_rg_durable_private_dispatch_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_durable_private_dispatch_v1.py
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_editorial_callbacks_v1.py
          python rg_remote_control/nas/monitoring/news_rg_editorial_callbacks_v1.py
          python -m py_compile rg_remote_control/nas/monitoring/news_rg_durable_private_sender_v1.py
          python rg_remote_control/nas/monitoring/news_rg_approved_publication_v1.py selftest
          python rg_remote_control/nas/monitoring/news_rg_approved_publication_cutover_v1.py selftest
      - name: Simulate private sender patch without network or NAS
        run: |
          python - <<'PY'
          import pathlib, importlib.util, ast
          root=pathlib.Path('rg_remote_control/nas/monitoring')
          name=root/'news_rg_approved_publication_cutover_v1.py'
          spec=importlib.util.spec_from_file_location('cutover',name)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          original=(root/'news_rg_durable_private_sender_v1.py').read_text()
          # The old photo-only public cutover MUST reject a new
          # video-aware private sender, not turn video approval into photo post.
          assert 'def pack_original_video' in original
          assert 'sendVideo' in original
          try:
              mod.patch_sender(original)
          except RuntimeError as e:
              assert str(e)=='PRIVATE_SENDER_SOURCE_UNEXPECTED'
          else:
              raise AssertionError('UNSAFE_OLD_PHOTO_CUTOVER_ACCEPTED_VIDEO_SENDER')
          print('NEWS_RG_OBSOLETE_PHOTO_CUTOVER_BLOCKED_PASS')
          PY

      - name: Offline original video private send contract (mocked photo support)
        run: |
          python - <<'PY'
          import types,sys,importlib.util,pathlib
          stub=types.ModuleType('news_rg_multipart')
          def build(payload,filename,mime,caption,chat,boundary):
            return b'photo'+('\r\n--'+boundary+'--\r\n').encode()
          stub.build=build
          sys.modules['news_rg_multipart']=stub
          sys.path.insert(0,str(pathlib.Path('rg_remote_control/nas/monitoring').resolve()))
          path=pathlib.Path('rg_remote_control/nas/monitoring/news_rg_durable_private_sender_v1.py')
          spec=importlib.util.spec_from_file_location('private_video_sender_ci',path)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.selftest()
          assert m.video_source_allowed('https://cdn4.telesco.pe/file/original.mp4')
          assert not m.video_source_allowed('https://www.evil.example/a.mp4')
          assert m.pack_original_video(b'\0\0\0\0ftyp', 'Тест', 123, 'a'*24)[0].find(b'name="video"')>0
          print('NEWS_RG_PRIVATE_VIDEO_SEND_CI_PASS')
          PY

      - name: Offline source patch contract for existing AI bridge
        run: |
          python - <<'PY'
          import importlib.util,pathlib,ast
          root=pathlib.Path('rg_remote_control/nas/monitoring')
          spec=importlib.util.spec_from_file_location('installer',root/'news_rg_guarded_auto_handoff_installer_v1.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          bridge=(root/'news_rg_private_bridge_v1.py').read_text()
          patched,already=m.modify_bridge(bridge)
          assert not already
          ast.parse(patched)
          assert m.EDIT_MARK in patched
          assert m.modify_bridge(patched)==(patched,True)
          assert patched.count(m.EDIT_MARK)==1
          print('NEWS_RG_GUARDED_BRIDGE_PATCH_PASS')
          PY
