name: RG YouTube Autonomous Repair (sandbox review)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Allow AI to repair allowlisted SEO source files in an isolated checkout"
        type: boolean
        default: false
      drill:
        description: "Run an isolated Ollama recovery regression drill (never writes to checkout)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rg-youtube-autofix-sandbox
  cancel-in-progress: false

jobs:
  repair:
    # Only trusted repository branches. Never execute PR-provided code here.
    if: github.repository == 'RushaGoodbye/CHAT_YouTube'
    runs-on: [self-hosted, rg, alexpc, windows]
    timeout-minutes: 20
    steps:
      - name: Checkout trusted candidate
        uses: actions/checkout@v4
        with:
          ref: audit/youtube-control-0710-comprehensive-qa
          persist-credentials: false
      - name: Check local model and Python
        shell: pwsh
        run: |
          python --version
          $probe = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -TimeoutSec 5
          $models = @($probe.models | ForEach-Object { $_.name })
          if (-not ($models | Where-Object { $_ -eq 'qwen3:8b' -or $_ -like 'qwen3:8b-*' })) {
            throw "Required local model qwen3:8b not found. Available: $($models -join ', ')"
          }
          Write-Host 'Ollama qwen3:8b verified on AlexPC'
          python -m venv .venv
          $py = Join-Path $PWD ".venv\Scripts\python.exe"
          & $py -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
          $env:PYTHONPATH = (Join-Path $PWD "src")
          & $py -m pytest -q tests --tb=short
          if ($LASTEXITCODE -ge 2) { throw "Baseline test collection or infrastructure error" }
          Write-Host "Baseline pytest exit code: $LASTEXITCODE (1 means repairable test failures)"
      - name: Isolated Ollama repair regression drill
        if: inputs.drill == true
        shell: pwsh
        run: |
          $py = Join-Path $PWD ".venv\Scripts\python.exe"
          & $py -u scripts/rg_youtube_ollama_repair_drill.py
          if ($LASTEXITCODE -ne 0) { throw "Ollama regression drill failed" }
      - name: Autonomous SEO repair (workspace only)
        id: repair
        shell: pwsh
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          $mode = if ('${{ inputs.apply }}' -eq 'true') { '--apply' } else { '' }
          if ($mode) {
            Set-Content -Path ".rg_youtube_autofix_sandbox" -Value "isolated github runner checkout"
            $env:RG_REPAIR_ALLOWED_ROOT = (Get-Location).Path
            try {
              & ".\.venv\Scripts\python.exe" scripts/rg_youtube_seo_repair_agent.py --apply
              if ($LASTEXITCODE -ne 0) { throw "Sandbox repair failed validation" }
            } finally {
              Remove-Item ".rg_youtube_autofix_sandbox" -ErrorAction SilentlyContinue
              Remove-Item Env:RG_REPAIR_ALLOWED_ROOT -ErrorAction SilentlyContinue
            }
          } else {
            & ".\.venv\Scripts\python.exe" scripts/rg_youtube_seo_repair_agent.py
            if ($LASTEXITCODE -ne 0) { throw "Read-only repair diagnosis found failures" }
          }
      - name: Check modified file allowlist
        id: changes
        shell: pwsh
        run: |
          $allowed = @('src/rg_youtube_control/seo_quality_gate.py', 'src/rg_youtube_control/rejected_seo.py')
          $changed = @(git diff --name-only)
          foreach ($path in $changed) {
            if ($path -notin $allowed) { throw "Unexpected changed file: $path" }
          }
          if ('${{ steps.repair.outcome }}' -ne 'success') {
            if ($changed.Count -gt 0) { throw 'Failed repair left a patch behind' }
            throw 'Repair step failed: no validated patch; see repair report'
          } elseif ($changed.Count -eq 0) {
            "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            "changed=true" >> $env:GITHUB_OUTPUT
          }
      - name: Upload proposed patch for review
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          git diff --binary -- src/rg_youtube_control/seo_quality_gate.py src/rg_youtube_control/rejected_seo.py | Out-File -Encoding utf8 rg_youtube_proposed_repair.patch
      - name: Upload proposed patch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg-youtube-proposed-repair
          path: rg_youtube_proposed_repair.patch
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload isolated drill reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg-youtube-ollama-drill-report
          path: |
            rg_youtube_ollama_drill_result.json
            rg_youtube_ollama_drill_live.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg-youtube-autofix-report
          path: rg_seo_repair_report.json
          if-no-files-found: ignore
          retention-days: 14
