name: RG YouTube Autonomous Repair (sandbox)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Allow AI to repair allowlisted SEO source files in an isolated checkout"
        type: boolean
        default: false
  schedule:
    - cron: "37 5 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rg-youtube-autofix-sandbox
  cancel-in-progress: false

jobs:
  repair:
    # Only trusted repository branches. Never execute PR-provided code here.
    if: github.repository == 'RushaGoodbye/CHAT_YouTube'
    runs-on: [self-hosted, rg, alexpc, windows]
    timeout-minutes: 20
    steps:
      - name: Checkout trusted candidate
        uses: actions/checkout@v4
        with:
          ref: audit/youtube-control-0710-comprehensive-qa
          persist-credentials: false
      - name: Check local model and Python
        shell: pwsh
        run: |
          python --version
          $probe = Invoke-WebRequest -Uri 'http://127.0.0.1:11434/api/tags' -TimeoutSec 5
          if ($probe.StatusCode -ne 200) { throw 'Local Ollama unavailable' }
          python -m pip install pytest
      - name: Autonomous SEO repair (workspace only)
        id: repair
        shell: pwsh
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          $mode = if ('${{ github.event_name }}' -eq 'schedule' -or '${{ inputs.apply }}' -eq 'true') { '--apply' } else { '' }
          if ($mode) {
            python scripts/rg_youtube_seo_repair_agent.py --apply
          } else {
            python scripts/rg_youtube_seo_repair_agent.py
          }
      - name: Check modified file allowlist
        id: changes
        shell: pwsh
        run: |
          $allowed = @('src/rg_youtube_control/seo_quality_gate.py', 'src/rg_youtube_control/rejected_seo.py')
          $changed = @(git diff --name-only)
          foreach ($path in $changed) {
            if ($path -notin $allowed) { throw "Unexpected changed file: $path" }
          }
          if ('${{ steps.repair.outcome }}' -ne 'success') {
            if ($changed.Count -gt 0) { throw 'Failed repair left a patch behind' }
            "changed=false" >> $env:GITHUB_OUTPUT
          } elseif ($changed.Count -eq 0) {
            "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            "changed=true" >> $env:GITHUB_OUTPUT
          }
      - name: Open an isolated repair PR
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = "autofix/youtube-seo-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c $branch
          git add -- src/rg_youtube_control/seo_quality_gate.py src/rg_youtube_control/rejected_seo.py
          git commit -m "fix(youtube): AI-assisted SEO test repair"
          git -c http.extraheader="AUTHORIZATION: basic $([Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('x-access-token:' + $env:GH_TOKEN)))" push origin HEAD
          gh pr create --base audit/youtube-control-0710-comprehensive-qa --head $branch --draft --title "Autofix: SEO test repair" --body "Automated repair proposal only. Requires code review and full Windows QA before merging. No live changes."
      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg-youtube-autofix-report
          path: rg_seo_repair_report.json
          if-no-files-found: ignore
          retention-days: 14
