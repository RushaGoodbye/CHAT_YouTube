name: RG FFmpeg filter threading throughput A/B
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-filter-thread-tune-ab.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_filter_thread_tuning_v1.py
          if($LASTEXITCODE -ne 0){throw 'FILTER_THREADS_TUNING_FAILED'}
