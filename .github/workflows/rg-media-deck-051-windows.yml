name: RG Media Deck 0.5.1 Windows ZIP Update
on:
  workflow_dispatch:
  push:
    branches: [rg-media-deck-0-5-1]
    paths:
      - 'rg_media_deck/**'
      - '.github/workflows/rg-media-deck-051-windows.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: rg_media_deck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rg_media_deck/requirements.txt
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.16.0 Pillow==11.3.0
      - name: Generate multi-resolution Windows app icon
        shell: pwsh
        run: |
          python build_icon.py
          if (!(Test-Path assets/RG_Media_Deck.ico)) { throw 'App icon missing' }
      - name: Validate Windows rollback supervisor PowerShell syntax
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from update_rollback import WATCHDOG_SCRIPT; Path('rollback_syntax.ps1').write_text(WATCHDOG_SCRIPT, encoding='utf-8')"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'rollback_syntax.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "Rollback PowerShell syntax invalid: $errors" }
      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Stress 120 REAL video/audio/photo switches (2-minute hard timeout)
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'real_switch_stdout.txt'
          $err = Join-Path $PWD 'real_switch_stderr.txt'
          $py = (Get-Command python).Source
          $stress = Start-Process -FilePath $py -ArgumentList 'tests/stress_real_videos.py' -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            Wait-Process -Id $stress.Id -Timeout 120 -ErrorAction Stop
          } catch {
            Stop-Process -Id $stress.Id -Force -ErrorAction SilentlyContinue
            Get-Content $out -ErrorAction SilentlyContinue
            Get-Content $err -ErrorAction SilentlyContinue
            throw 'REAL video switching hung beyond 120s — refusing release'
          }
          $stress.Refresh()
          Get-Content $out -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue
          if ($stress.ExitCode -ne 0) { throw "REAL video stress failed: $($stress.ExitCode)" }
      - name: Build frozen Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name RG_Media_Deck --icon assets/RG_Media_Deck.ico --add-data 'assets/RG_Media_Deck.ico;assets' --collect-all PySide6.QtMultimedia --collect-all PySide6.QtMultimediaWidgets --collect-all imageio_ffmpeg --collect-all watchdog --collect-all PySide6.QtWebEngineCore --collect-all PySide6.QtWebEngineWidgets app.py
          if (!(Test-Path dist/RG_Media_Deck/RG_Media_Deck.exe)) { throw 'Missing EXE' }
      - name: GUI smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/RG_Media_Deck/RG_Media_Deck.exe' -ArgumentList '--selftest' -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Selftest failed: $($process.ExitCode)" }
      - name: Validate bundled QtWebEngine (offline, no user login)
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'webengine_stdout.txt'
          $err = Join-Path $PWD 'webengine_stderr.txt'
          $exe = (Resolve-Path 'dist/RG_Media_Deck/RG_Media_Deck.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--webengine-selftest' -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "QtWebEngine frozen EXE test failed: $($process.ExitCode)" }
          if (!(Select-String -Path $out -SimpleMatch 'RG_WEBENGINE_FROZEN_SELFTEST_PASS' -Quiet)) { throw 'QtWebEngine success marker absent' }
      - name: Validate ZIP updater PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path 'zip_update/Apply_RG_Media_Deck_Update.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "Invalid ZIP updater PowerShell syntax: $errors" }
      - name: Package complete ZIP update (NO installer)
        shell: pwsh
        run: |
          python build_zip_update.py
          $zip = 'dist_release/RG_Media_Deck_Update.zip'
          if (!(Test-Path $zip)) { throw 'ZIP update missing' }
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + '  RG_Media_Deck_Update.zip' |
            Set-Content 'dist_release/RG_Media_Deck_Update.zip.sha256' -Encoding Ascii
          Expand-Archive $zip -DestinationPath 'dist_zip_verify' -Force
          if (!(Test-Path 'dist_zip_verify/RG_Media_Deck/RG_Media_Deck.exe')) { throw 'EXE not packaged' }
          if (!(Test-Path 'dist_zip_verify/RG_Media_Deck/_internal/assets/RG_Media_Deck.ico')) { throw 'Qt/PyInstaller icon resource missing' }
          $check = Start-Process -FilePath 'dist_zip_verify/RG_Media_Deck/RG_Media_Deck.exe' -ArgumentList '--selftest' -PassThru -Wait -NoNewWindow
          if ($check.ExitCode -ne 0) { throw "Packed EXE failed GUI selftest: $($check.ExitCode)" }
      - name: Test ZIP patch application and previous version backup
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'RGMediaDeck_PatchTest'
          Copy-Item 'dist/RG_Media_Deck' -Destination $target -Recurse
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'dist_zip_verify/Apply_RG_Media_Deck_Update.ps1' -InstallDir $target -NonInteractive -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw 'ZIP patch apply test failed' }
          if (!(Test-Path (Join-Path $target 'RG_Media_Deck.exe'))) { throw 'Patched EXE missing' }
          $backups = @(Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'RG Media Deck.backup.*')
          if ($backups.Count -lt 1) { throw 'Previous version backup missing' }
      - name: Upload ZIP update artifact
        uses: actions/upload-artifact@v4
        with:
          name: RG_Media_Deck_0.5.1_ZIP_Update
          path: |
            rg_media_deck/dist_release/RG_Media_Deck_Update.zip
            rg_media_deck/dist_release/RG_Media_Deck_Update.zip.sha256
          if-no-files-found: error
      - name: Publish ZIP-only update release
        if: github.ref == 'refs/heads/rg-media-deck-0-5-1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'rg-media-deck-v0.5.1'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag exists; refusing overwrite" }
          gh release create $tag dist_release/RG_Media_Deck_Update.zip dist_release/RG_Media_Deck_Update.zip.sha256 --target $env:GITHUB_SHA --title 'RG Media Deck 0.5.1 ZIP Update' --notes 'ZIP only, no installer. Four-tab research workspace with left/right player, separate persistent Telegram Web and ChatGPT accounts, unified Latin/Cyrillic local file and folder search, prepared web queries. External services may require manual login/send; no fabricated results. Background Chromium frozen while in other tabs. Extract ZIP and run ОНОВИТИ_RG_Media_Deck.cmd to update from 0.4.10 or later. In-app ZIP updater enabled for future versions.'
