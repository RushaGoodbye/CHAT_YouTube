name: RG popup scanner source inspect v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-popup-source-inspect-v2.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - shell: pwsh
        run: |
          $root='F:\RG_AUTO_EDIT\RG Auto Edit App'
          $maps=@(
            @('rg_fullstream_auto_v2.py',428,515),
            @('rg_fullstream_auto_v2.py',581,633),
            @('rg_fullstream_detectors_v2.py',1,110),
            @('rg_fullstream_popup_light_v89.py',1,115),
            @('rg_fullstream_popup_checkpoint_v89.py',1,135),
            @('rg_fullstream_worker_v3.py',40,160)
          )
          foreach($m in $maps){
            $file=[string]$m[0];$a=[int]$m[1];$b=[int]$m[2]
            $s=@(Get-Content (Join-Path $root $file) -Encoding UTF8)
            for($i=$a;$i -le [Math]::Min($b,$s.Count);$i++){
              Write-Output ('RGSRC|'+$file+'|'+$i+'|'+$s[$i-1])
            }
          }
          Write-Output 'RGSRC|READ_ONLY|PASS'
