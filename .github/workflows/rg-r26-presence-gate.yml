name: R26 Object Presence and Blur Safety Gate
on:
  push:
    branches:
      - rg-auto-edit/r26-object-presence-gate
    paths:
      - rg_remote_control/open_source_v1/r26_presence_gate_8866.py
      - rg_remote_control/open_source_v1/tests/test_r26_presence_gate_8866.py
      - .github/workflows/rg-r26-presence-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r26-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile R26 and its tests
        run: |
          python -m py_compile rg_remote_control/open_source_v1/r26_presence_gate_8866.py
          python -m py_compile rg_remote_control/open_source_v1/tests/test_r26_presence_gate_8866.py
      - name: Run frame-level safety regressions
        run: |
          python -m unittest discover -s rg_remote_control/open_source_v1/tests -p "test_r26_presence_gate_8866.py" -v
      - name: Confirm this workflow does not publish or change Studio
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("rg_remote_control/open_source_v1/r26_presence_gate_8866.py").read_text(encoding="utf-8")
          assert '"release_ready": False' in s
          assert '"production_modified": False' in s
          assert "subprocess" not in s
          print("SHADOW_ONLY_NO_PRODUCTION_MUTATION: PASS")
          PY
