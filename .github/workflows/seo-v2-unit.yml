name: SEO v2 universal unit tests (no publishing)

on:
  push:
    branches:
      - fix/seo-ukrainian-title-preservation-20261030
    paths:
      - 'src/rg_youtube_control/seo_v2_*.py'
      - 'tests/test_seo_v2_universal.py'
      - '.github/workflows/seo-v2-unit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile new modules
        run: python -m compileall -q src/rg_youtube_control/seo_v2_*.py
      - name: Test arbitrary-SRT evidence and metadata gating
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_seo_v2_universal.py
