name: RG YouTube Control

on:
  push:
    branches:
      - main
    paths:
      - "rg_remote_control/youtube_task.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate YouTube contour
        shell: powershell
        run: |
          $task = Get-Content "rg_remote_control/youtube_task.json" -Raw | ConvertFrom-Json
          if ($task.target -ne "alexpc") { throw "Task target must be alexpc" }
          if ($task.contour -ne "youtube") { throw "Task contour must be youtube" }
          if ($env:COMPUTERNAME.ToUpperInvariant() -ne "ALEXPC") { throw "YouTube task must run on ALEXPC" }
          if ($task.action -notin @("health","ensure_github_runner_persistence","stage_mcp_to_docker_root","probe_docker_root_mcp_deploy","youtube_mcp_call","youtube_mcp_batch","youtube_program_local_status","youtube_local_repair_preview","youtube_local_repair_apply","youtube_local_quota_plan_status","youtube_local_runtime_status","youtube_local_validate_local_seo_rules","youtube_local_recent_errors","youtube_local_cleanup_redundant_nas_agent","youtube_local_install_boot_ready","youtube_local_daily_autopilot","youtube_local_repair_ollama","youtube_local_live_archive_audit","youtube_local_apply_live_archive_safe_batch","youtube_local_stop_legacy_gui","youtube_local_sync_source_only","youtube_local_sync_and_launch_source","youtube_local_launch_diagnostic","youtube_local_sync_recent_live_for_today","youtube_local_find_today_upcoming_live_broadcasts","youtube_local_optimize_scheduled_stream","youtube_local_verify_stream901_partial_update","youtube_local_finalize_stream901","youtube_local_ensure_gui_startup","youtube_local_brand_shortcuts","youtube_local_prepare_source_runtime","youtube_local_enable_archive_priority","youtube_local_apply_ready_scheduled_batch","youtube_local_inspect_scheduled_mismatches","youtube_local_set_vidiq_budget_state","youtube_local_promote_reviewed_draft","enable_youtube_mcp_bridge","probe_youtube_mcp_bridge","probe_youtube_tick_runtime")) {
            throw "Action is not allowed in YouTube contour"
          }
      - name: Run YouTube contour task
        shell: powershell
        run: |
          $task = Get-Content "rg_remote_control/youtube_task.json" -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force "rg_remote_control/results" | Out-Null
          $resultPath = "rg_remote_control/results/youtube_task_result.json"
          if ($task.action -in @("youtube_local_repair_preview","youtube_local_repair_apply","youtube_local_quota_plan_status","youtube_local_runtime_status","youtube_local_validate_local_seo_rules","youtube_local_recent_errors","youtube_local_cleanup_redundant_nas_agent","youtube_local_install_boot_ready","youtube_local_install_nas_first","youtube_local_daily_autopilot","youtube_local_repair_ollama","youtube_local_live_archive_audit","youtube_local_apply_live_archive_safe_batch","youtube_local_stop_legacy_gui","youtube_local_sync_source_only","youtube_local_sync_and_launch_source","youtube_local_launch_diagnostic","youtube_local_sync_recent_live_for_today","youtube_local_find_today_upcoming_live_broadcasts","youtube_local_optimize_scheduled_stream","youtube_local_verify_stream901_partial_update","youtube_local_finalize_stream901","youtube_local_ensure_gui_startup","youtube_local_brand_shortcuts","youtube_local_prepare_source_runtime","youtube_local_enable_archive_priority","youtube_local_apply_ready_scheduled_batch","youtube_local_inspect_scheduled_mismatches","youtube_local_set_vidiq_budget_state","youtube_local_promote_reviewed_draft")) {
            python rg_remote_control/youtube_local_tool.py rg_remote_control/youtube_task.json | Tee-Object -FilePath $resultPath
          } else {
            python rg_remote_control/task_runner.py rg_remote_control/youtube_task.json | Tee-Object -FilePath $resultPath
          }

      - name: Upload latest task result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-task-result-${{ github.run_id }}
          path: rg_remote_control/results/youtube_task_result.json
          if-no-files-found: ignore
          retention-days: 7
