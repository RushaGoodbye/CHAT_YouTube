name: RG YouTube Control

on:
  push:
    branches:
      - main
    paths:
      - "rg_remote_control/youtube_task.json"
      - ".github/workflows/rg-youtube-control.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rg-youtube-control
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, rg, alexpc, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Validate YouTube contour
        shell: powershell
        run: |
          $task = Get-Content "rg_remote_control/youtube_task.json" -Raw | ConvertFrom-Json
          if ($task.target -ne "alexpc") { throw "Task target must be alexpc" }
          if ($task.contour -ne "youtube") { throw "Task contour must be youtube" }
          if ($task.action -notin @("health","ensure_github_runner_persistence","stage_mcp_to_docker_root","probe_docker_root_mcp_deploy","youtube_mcp_call","youtube_mcp_batch","youtube_program_local_status","youtube_local_repair_preview","youtube_local_repair_apply","youtube_local_quota_plan_status","youtube_local_runtime_status","youtube_local_stop_legacy_gui","youtube_local_sync_and_launch_source","youtube_local_launch_diagnostic","youtube_local_sync_recent_live_for_today","youtube_local_find_today_upcoming_live_broadcasts","youtube_local_optimize_scheduled_stream","youtube_local_verify_stream901_partial_update","youtube_local_finalize_stream901","youtube_local_ensure_gui_startup","youtube_local_prepare_source_runtime","youtube_local_enable_archive_priority","youtube_local_apply_ready_scheduled_batch","youtube_local_inspect_scheduled_mismatches","youtube_local_set_vidiq_budget_state","enable_youtube_mcp_bridge","probe_youtube_mcp_bridge","probe_youtube_tick_runtime")) {
            throw "Action is not allowed in YouTube contour"
          }
      - name: Run YouTube contour task
        shell: powershell
        run: |
          $task = Get-Content "rg_remote_control/youtube_task.json" -Raw | ConvertFrom-Json
          if ($task.action -in @("youtube_local_repair_preview","youtube_local_repair_apply","youtube_local_quota_plan_status","youtube_local_runtime_status","youtube_local_stop_legacy_gui","youtube_local_sync_and_launch_source","youtube_local_launch_diagnostic","youtube_local_sync_recent_live_for_today","youtube_local_find_today_upcoming_live_broadcasts","youtube_local_optimize_scheduled_stream","youtube_local_verify_stream901_partial_update","youtube_local_finalize_stream901","youtube_local_ensure_gui_startup","youtube_local_prepare_source_runtime","youtube_local_enable_archive_priority","youtube_local_apply_ready_scheduled_batch","youtube_local_inspect_scheduled_mismatches","youtube_local_set_vidiq_budget_state")) {
            python rg_remote_control/youtube_local_tool.py rg_remote_control/youtube_task.json
          } else {
            python rg_remote_control/task_runner.py rg_remote_control/youtube_task.json
          }
