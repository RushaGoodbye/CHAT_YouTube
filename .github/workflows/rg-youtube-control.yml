name: RG YouTube Control

on:
  push:
    branches:
      - main
    paths:
      - "rg_remote_control/youtube_task.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate YouTube contour
        shell: powershell
        run: |
          $task = Get-Content "rg_remote_control/youtube_task.json" -Raw | ConvertFrom-Json
          if ($task.target -ne "alexpc") { throw "Task target must be alexpc" }
          if ($task.contour -ne "youtube") { throw "Task contour must be youtube" }
          if ($env:COMPUTERNAME.ToUpperInvariant() -ne "ALEXPC") { throw "YouTube task must run on ALEXPC" }
          if ($task.action -notin @("health","ensure_github_runner_persistence","stage_mcp_to_docker_root","probe_docker_root_mcp_deploy","youtube_mcp_call","youtube_mcp_batch","youtube_program_local_status","youtube_local_repair_preview","youtube_local_repair_apply","youtube_local_quota_plan_status","youtube_local_runtime_status","youtube_gui_autorelaunch_probe","youtube_gui_autorelaunch_fix","youtube_archive_worklist_readonly","youtube_first_archive_batch_readonly","youtube_archive_pilot_0717_qa","youtube_archive_pilot_batch_0717","youtube_0718_runtime_audit_readonly","youtube_shoigu_failure_audit_readonly","youtube_shoigu_seo_0724_dryrun","youtube_stage_0717_review_drafts","youtube_archive_transcript_alignment_0717","youtube_archive_priority_readonly","youtube_archive_pilot_0717_readonly","youtube_update_install_audit","youtube_stage_verified_0715","youtube_stage_verified_0716","youtube_stage_verified_0717","youtube_stage_verified_0718","youtube_stage_verified_0721","youtube_stage_verified_0722","youtube_stage_verified_0723","youtube_installed_seo_readonly","youtube_seo_0712_preflight","youtube_full_seo_0712_qa","youtube_full_seo_0713_qa","youtube_full_seo_0714_qa","youtube_full_seo_0715_qa","youtube_ollama_chat_diagnose","youtube_ollama_and_console_probe","youtube_ollama_official_repair","youtube_ollama_download_state","youtube_keepalive_no_console_fix","youtube_agent_preflight","youtube_restore_alexpc_agent","youtube_restore_user_startup","youtube_agent_runtime_probe","youtube_single_gui_startup","youtube_local_repair_shortcuts","youtube_local_validate_source_compile","youtube_local_preview_local_seo","youtube_local_inspect_local_seo_source","youtube_local_validate_local_seo_rules","youtube_local_recent_errors","youtube_local_cleanup_redundant_nas_agent","youtube_local_install_boot_ready","youtube_local_daily_autopilot","youtube_local_repair_ollama","youtube_local_live_archive_audit","youtube_local_apply_live_archive_safe_batch","youtube_local_stop_legacy_gui","youtube_local_sync_source_only","youtube_local_sync_and_launch_source","youtube_local_launch_diagnostic","youtube_local_sync_recent_live_for_today","youtube_local_find_today_upcoming_live_broadcasts","youtube_local_optimize_scheduled_stream","youtube_local_verify_stream901_partial_update","youtube_local_finalize_stream901","youtube_local_ensure_gui_startup","youtube_local_brand_shortcuts","youtube_local_prepare_source_runtime","youtube_local_enable_archive_priority","youtube_local_apply_ready_scheduled_batch","youtube_local_inspect_scheduled_mismatches","youtube_local_set_vidiq_budget_state","youtube_local_promote_reviewed_draft","enable_youtube_mcp_bridge","probe_youtube_mcp_bridge","probe_youtube_tick_runtime")) {
            throw "Action is not allowed in YouTube contour"
          }
