        shell: powershell
        env:
          RG_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          $task = Get-Content "rg_remote_control/youtube_task.json" -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force "rg_remote_control/results" | Out-Null
          $resultPath = "rg_remote_control/results/youtube_task_result.json"
          if ($task.action -eq "youtube_gui_autorelaunch_fix") {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "rg_remote_control/youtube_disable_gui_autorelaunch.ps1" | Tee-Object -FilePath $resultPath
            if ($LASTEXITCODE -ne 0) { throw "AlexPC manual GUI launch repair failed" }
          } elseif ($task.action -eq "youtube_gui_autorelaunch_probe") {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "rg_remote_control/youtube_gui_autorelaunch_probe.ps1" | Tee-Object -FilePath $resultPath
            if ($LASTEXITCODE -ne 0) { throw "Read-only GUI relaunch probe failed" }
          } elseif ($task.action -eq "youtube_local_runtime_status") {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "rg_remote_control/youtube_runtime_diagnostic.ps1" | Tee-Object -FilePath $resultPath
          } elseif ($task.action -eq "youtube_update_install_audit") {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "rg_remote_control/youtube_update_install_audit.ps1" | Tee-Object -FilePath $resultPath
