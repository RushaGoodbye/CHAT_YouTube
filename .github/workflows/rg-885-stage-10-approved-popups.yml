name: RG 885 stage 10 human-confirmed notification masks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-885-stage-10-approved-popups.yml']
permissions: {contents: read}
jobs:
  stage:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_885_stage_10_confirmed_popups.py
          if($LASTEXITCODE -ne 0){throw 'STAGE_10_USER_POPUP_MASKS_FAILED'}
