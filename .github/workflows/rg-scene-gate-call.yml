name: RG scene gate call exact
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-scene-gate-call.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - shell: pwsh
        run: |
          $p='F:\RG_AUTO_EDIT\RG Auto Edit App\rg_clock_selector.py'
          $s=@(Get-Content $p -Encoding UTF8)
          for($i=3650;$i -le 3795;$i++){Write-Output ('RGV4GATE|'+$i+'|'+$s[$i-1])}
