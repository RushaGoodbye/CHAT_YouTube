name: RG no guest scene anchor exact source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-noface-scene-excerpts.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - shell: pwsh
        run: |
          $root='F:\RG_AUTO_EDIT\RG Auto Edit App'
          foreach($q in @(@('rg_multi_dialogue.py',535,615),@('rg_multi_dialogue.py',610,738),@('rg_clock_selector.py',3330,3455),@('rg_clock_selector.py',3560,3640))){
            $s=@(Get-Content (Join-Path $root $q[0]) -Encoding UTF8)
            for($k=$q[1];$k -le $q[2];$k++){Write-Output ('RGSCENE|'+$q[0]+'|'+$k+'|'+$s[$k-1])}
          }
