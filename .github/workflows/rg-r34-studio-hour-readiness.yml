name: R34 Auto Edit Studio Real Windows Readiness
on:
  push:
    branches: [rg-auto-edit/r34-studio-hour-readiness]
    paths: ['.github/workflows/rg-r34-studio-hour-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r34-read-only:
    runs-on: [self-hosted, windows]
    timeout-minutes: 7
    defaults:
      run:
        shell: powershell
    steps:
      - name: Inspect real Studio executable, runtime, updates and processes READ ONLY
        run: |
          $ErrorActionPreference="Stop"
          $root="F:\RG_AUTO_EDIT"
          $app=Join-Path $root "RG Auto Edit App"
          $data=Join-Path $root "RG Auto Edit Data"
          Write-Host "R34_ROOT_EXISTS=$([bool](Test-Path -LiteralPath $root))"
          Write-Host "R34_APP_EXISTS=$([bool](Test-Path -LiteralPath $app))"
          Write-Host "R34_DATA_EXISTS=$([bool](Test-Path -LiteralPath $data))"
          if (-not (Test-Path -LiteralPath $app)) { throw "Studio app folder missing" }
          $entries=Get-ChildItem -LiteralPath $app -Force -ErrorAction Stop
          $names=@($entries | Where-Object {$_.Name -match '(?i)studio|updat|version|main|run|exe|manifest|launcher|current'})
          foreach($file in ($names | Select-Object -First 35)){
            $kind=if($file.PSIsContainer){"DIR"}else{"FILE"}
            Write-Host "R34_APP_ENTRY=$($file.Name) TYPE=$kind SIZE=$($file.Length)"
          }
          $exes=@(Get-ChildItem -LiteralPath $app -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          foreach($exe in ($exes | Select-Object -First 15)){
            Write-Host "R34_EXE=$($exe.Name) PRODUCT_VERSION=$($exe.VersionInfo.ProductVersion) FILE_VERSION=$($exe.VersionInfo.FileVersion)"
          }
          $running=@(Get-CimInstance Win32_Process -ErrorAction Stop | Where-Object {$_.Name -match "(?i)rg.*(edit|studio)|studio.*(rg|auto)|pythonw?" -and $_.ExecutablePath -like 'F:\RG_AUTO_EDIT*'})
          foreach($p in $running | Select-Object -First 20){
            Write-Host "R34_PROCESS_NAME=$($p.Name) PID=$($p.ProcessId)"
          }
          Write-Host "R34_PROCESSES_MATCHED=$($running.Count)"
          $xml=Join-Path $app "RG_EDITED_886_6.xml"
          if (Test-Path -LiteralPath $xml) {
            $f=Get-Item -LiteralPath $xml
            Write-Host "R34_8866_XML_EXISTS=TRUE BYTES=$($f.Length) LASTWRITE=$($f.LastWriteTimeUtc.ToString('s'))"
          } else { Write-Host "R34_8866_XML_EXISTS=FALSE" }
          if (Test-Path -LiteralPath (Join-Path $app 'RG_EDITED_886_6_CIGARETTE_BLUR_DETECTIONS.json')) {
            Write-Host "R34_DETECTION_REPORT_EXISTS=TRUE"
          }
          Write-Host "R34_READ_ONLY_STUDIO_READINESS_COMPLETED"

      - name: Inspect installed version and launch contract without execution
        run: |
          $ErrorActionPreference="Stop"
          $app="F:\RG_AUTO_EDIT\RG Auto Edit App"
          $manifest=Join-Path $app "RG_AUTO_EDIT_RELEASE_MANIFEST.json"
          if (Test-Path -LiteralPath $manifest) {
            $m=Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
            foreach($field in ("version","app_version","studio_version","build","build_id","status","channel")){
              if ($m.PSObject.Properties.Name -contains $field) {
                Write-Host "R34_RELEASE_$($field.ToUpper())=$($m.$field)"
              }
            }
            Write-Host "R34_RELEASE_FIELDS=$((@($m.PSObject.Properties.Name) -join ','))"
          }
          $cmd=Join-Path $app "RG_AUTO_EDIT_STUDIO.cmd"
          Write-Host "R34_LAUNCH_CMD_EXISTS=$([bool](Test-Path -LiteralPath $cmd))"
          if (Test-Path $cmd) {
            $raw=Get-Content -LiteralPath $cmd -Raw
            Write-Host "R34_LAUNCH_USES_MAIN=$([bool]($raw -match 'rg_studio_main|rg_studio_ui'))"
            Write-Host "R34_LAUNCH_USES_PYTHONW=$([bool]($raw -match 'pythonw'))"
          }
          $runtimeTxt=Join-Path $app "RG_RUNTIME_PYTHONW.txt"
          if (Test-Path $runtimeTxt) {
            $exe=(Get-Content -LiteralPath $runtimeTxt -Raw).Trim().Trim('"')
            Write-Host "R34_PYTHONW_EXISTS=$([bool](Test-Path -LiteralPath $exe))"
          }
          $modules=@("rg_studio_main.py","rg_studio_ui.py","rg_studio_preflight.py","rg_studio_healthcheck.py")
          foreach($name in $modules) {
            $f=Join-Path $app $name
            if(-not (Test-Path -LiteralPath $f)) {throw "Missing required Studio module $name"}
            $text=[System.IO.File]::ReadAllText($f)
            $major = if ($text -match '(?m)^APP_VERSION\s*=\s*["'']([^"'']+)'){$Matches[1]}else{"not-declared"}
            Write-Host "R34_MODULE=$name BYTES=$((Get-Item -LiteralPath $f).Length) VERSION=$major"
          }
          Write-Host "R34_LAUNCH_CONTRACT_INSPECTED_READ_ONLY"

      - name: Discover GUI session and actual Studio build markers
        run: |
          $ErrorActionPreference="Stop"
          $app="F:\RG_AUTO_EDIT\RG Auto Edit App"
          $here=(Get-Process -Id $PID)
          Write-Host "R34_RUNNER_SESSION=$($here.SessionId)"
          $explorer=@(Get-Process -Name explorer -ErrorAction SilentlyContinue)
          Write-Host "R34_INTERACTIVE_EXPLORER_SESSIONS=$(($explorer | Select-Object -ExpandProperty SessionId -Unique) -join ',')"
          foreach($name in ("rg_studio_main.py","rg_studio_ui.py","rg_studio_healthcheck.py")){
            $p=Join-Path $app $name
            $lines=Get-Content -LiteralPath $p -Encoding UTF8
            Write-Host "R34_FILE=$name LINES=$($lines.Count)"
            $matches=@($lines | Where-Object {$_ -match '(?i)(0\.20\.20|0\.20\.|version\s*=|app_version\s*=|update.*zip|selftest|healthcheck)'})
            foreach($line in ($matches | Select-Object -First 20)) {
              Write-Host "R34_BUILD_MARKER=$($line.Trim().Substring(0,[Math]::Min($line.Trim().Length,160)))"
            }
          }
          Write-Host "R34_SESSION_AND_BUILD_INSPECTED_READ_ONLY"

      - name: Resolve real Studio startup target and update state safely
        run: |
          $ErrorActionPreference="Stop"
          $app="F:\RG_AUTO_EDIT\RG Auto Edit App"
          $cmd=Get-Content -LiteralPath (Join-Path $app "RG_AUTO_EDIT_STUDIO.cmd") -Raw
          $cmd=$cmd -replace '\r',''
          Write-Host "R34_STARTUP_CMD_TEXT_BEGIN"
          Write-Host $cmd
          Write-Host "R34_STARTUP_CMD_TEXT_END"
          $source=Get-Content (Join-Path $app "rg_studio_main.py") -Encoding UTF8
          foreach($l in $source) {
            if ($l -match '(?i)(ui|version|__main__|python|import|launcher|exec|run|studio)') {
              Write-Host "R34_MAIN_ENTRY=$($l.Trim().Substring(0,[Math]::Min($l.Trim().Length,150)))"
            }
          }
          $data="F:\RG_AUTO_EDIT\RG Auto Edit Data"
          $look=@(Get-ChildItem -LiteralPath $data -Directory -ErrorAction SilentlyContinue | Where-Object {$_.Name -match '(?i)(updat|release|patch|stable|install|version)'})
          foreach($dir in ($look | Select-Object -First 12)) {
            Write-Host "R34_DATA_RELEVANT_DIR=$($dir.Name)"
          }
          Write-Host "R34_STARTUP_RESOLUTION_READ_ONLY_PASS"

      - name: Confirm ACTUAL installed Studio app and updater
        run: |
          $ErrorActionPreference="Stop"
          $installed=Join-Path $env:LOCALAPPDATA "Programs\RG Auto Edit"
          $runtime=Join-Path $env:LOCALAPPDATA "Programs\RG Auto Edit Runtime\venv\Scripts\pythonw.exe"
          Write-Host "R34_REAL_INSTALLED_DIR_PRESENT=$([bool](Test-Path -LiteralPath $installed))"
          Write-Host "R34_REAL_INSTALLED_PYTHONW_PRESENT=$([bool](Test-Path -LiteralPath $runtime))"
          if(-not (Test-Path -LiteralPath $installed)) {throw "Real installed Studio absent"}
          foreach($name in ("rg_studio_main.py","rg_studio_ui.py","rg_update_supervisor.py","rg_studio_healthcheck.py","RG_AUTO_EDIT_RELEASE_MANIFEST.json")){
            $f=Join-Path $installed $name
            Write-Host "R34_INSTALLED_$name=$([bool](Test-Path -LiteralPath $f))"
            if(Test-Path -LiteralPath $f) {
              $fi=Get-Item -LiteralPath $f
              Write-Host "R34_REAL_FILE_INFO=$name BYTES=$($fi.Length) LASTWRITE_UTC=$($fi.LastWriteTimeUtc.ToString('s'))"
              if($name -eq "rg_studio_ui.py"){
                $lines=Get-Content -LiteralPath $f -Encoding UTF8
                $ver=@($lines | Where-Object {$_ -match '(?m)^\s*STUDIO_VERSION\s*='})
                foreach($v in ($ver | Select-Object -First 3)){ Write-Host "R34_REAL_UI_VERSION=$($v.Trim())" }
                Write-Host "R34_REAL_HAS_UPDATE_PAGE=$([bool]($lines -match 'pick_update_zip'))"
              }
              if($name -eq "RG_AUTO_EDIT_RELEASE_MANIFEST.json"){
                $m=Get-Content -LiteralPath $f -Raw|ConvertFrom-Json
                if($m.PSObject.Properties.Name -contains "version"){Write-Host "R34_REAL_MANIFEST_VERSION=$($m.version)"}
              }
            }
          }
          foreach($d in @(Get-ChildItem -LiteralPath $installed -Directory -ErrorAction SilentlyContinue | Where-Object {$_.Name -match 'update|version|release' } | Select-Object -First 10)){Write-Host "R34_REAL_DIR=$($d.Name)"}
          Write-Host "R34_REAL_INSTALLED_STUDIO_PROBE_PASS"

      - name: Check actual Studio windows, processes and recent updater transactions
        run: |
          $ErrorActionPreference="Stop"
          $processes=@(Get-CimInstance Win32_Process | Where-Object {
            $_.Name -match 'pythonw?|RG.*\.exe' -and
            ($_.ExecutablePath -like '*RG Auto Edit*' -or $_.CommandLine -like '*rg_studio_main.py*')
          })
          Write-Host "R34_REAL_STUDIO_PROCESSES=$($processes.Count)"
          foreach($p in ($processes|Select-Object -First 15)){
            Write-Host "R34_REAL_PROCESS=$($p.Name) PID=$($p.ProcessId) SESSION=$($p.SessionId)"
          }
          foreach($p in @(Get-Process | Where-Object {$_.MainWindowTitle -like '*RG Auto Edit*'} | Select-Object -First 10)){
            Write-Host "R34_STUDIO_WINDOW_PID=$($p.Id) TITLE=$($p.MainWindowTitle)"
          }
          $folder="F:\RG_AUTO_EDIT\RG Auto Edit Data\update_transactions"
          if(Test-Path -LiteralPath $folder){
            foreach($f in @(Get-ChildItem -LiteralPath $folder -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 8)){
              Write-Host "R34_UPDATE_TRANSACTION=$($f.Name) LASTWRITE=$($f.LastWriteTimeUtc.ToString('s'))"
            }
          }
          $runtime=Join-Path $env:LOCALAPPDATA "Programs\RG Auto Edit Runtime\venv\Scripts\python.exe"
          if (Test-Path -LiteralPath $runtime) {
            & $runtime -c "import PySide6; import sys; print('R34_RUNTIME_QT_IMPORT=PASS');print('R34_RUNTIME_PYTHON='+sys.version.split()[0])"
            if($LASTEXITCODE -ne 0){throw "Installed runtime import failed"}
          } else {Write-Host "R34_RUNTIME_PYTHON_MISSING"}
          Write-Host "R34_ACTUAL_SESSION_RUNTIME_CHECK_PASS"

      - name: Launch installed Studio UI only when absent and verify it stays open
        run: |
          $ErrorActionPreference="Stop"
          $app=Join-Path $env:LOCALAPPDATA "Programs\RG Auto Edit"
          $pythonw=Join-Path $env:LOCALAPPDATA "Programs\RG Auto Edit Runtime\venv\Scripts\pythonw.exe"
          $main=Join-Path $app "rg_studio_main.py"
          if(-not (Test-Path -LiteralPath $pythonw) -or -not (Test-Path -LiteralPath $main)) {throw "Installed startup files missing"}
          $existing=@(Get-CimInstance Win32_Process|Where-Object {$_.Name -eq "pythonw.exe" -and $_.CommandLine -like "*rg_studio_main.py*"})
          if($existing.Count -gt 0) {
            Write-Host "R34_STUDIO_ALREADY_RUNNING=$($existing.Count)"
            exit 0
          }
          # The GitHub runner kills child processes retaining its tracking ID.
          $oldTracking=[Environment]::GetEnvironmentVariable("RUNNER_TRACKING_ID","Process")
          $oldInstalled=[Environment]::GetEnvironmentVariable("RG_INSTALLED_MODE","Process")
          try {
            [Environment]::SetEnvironmentVariable("RUNNER_TRACKING_ID",$null,"Process")
            [Environment]::SetEnvironmentVariable("RG_INSTALLED_MODE","1","Process")
            $launch=Start-Process -FilePath $pythonw -ArgumentList @("-X","utf8",('"' + $main + '"')) -WorkingDirectory $app -PassThru
            Write-Host "R34_GUI_LAUNCH_PID=$($launch.Id)"
          } finally {
            [Environment]::SetEnvironmentVariable("RUNNER_TRACKING_ID",$oldTracking,"Process")
            [Environment]::SetEnvironmentVariable("RG_INSTALLED_MODE",$oldInstalled,"Process")
          }
          Start-Sleep -Seconds 7
          $process=@(Get-CimInstance Win32_Process|Where-Object {$_.Name -eq "pythonw.exe" -and $_.CommandLine -like "*rg_studio_main.py*"})
          Write-Host "R34_GUI_RUNNING_AFTER_7S=$($process.Count)"
          $windows=@(Get-Process -ErrorAction SilentlyContinue|Where-Object {$_.MainWindowTitle -like "*RG Auto Edit*"})
          Write-Host "R34_GUI_VISIBLE_WINDOWS=$($windows.Count)"
          foreach($w in ($windows|Select-Object -First 3)){Write-Host "R34_GUI_TITLE=$($w.MainWindowTitle)"}
          if($process.Count -lt 1 -or $windows.Count -lt 1){throw "Studio GUI not visibly running after launch"}
          Write-Host "R34_STUDIO_GUI_LIVE_LAUNCH_PASS"
