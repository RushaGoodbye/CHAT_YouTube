name: RG 895 V711 patched intro validation (NO INSTALL)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg895-v711-intro-memory-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Run extended intro detector in memory without modifying Studio
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $py='F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe'
          & $py scripts\rg_895_v711_intro_patch_shadow.py
          if($LASTEXITCODE -ne 0){throw 'V711_SHADOW_INTRO_FAILED'}
