name: RG 886 popup contact sheets QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-886-contact-sheets-qa.yml']
permissions: {contents: read}
jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_886_rejected_popup_contact_sheets.py
          if($LASTEXITCODE -ne 0){throw 'RG_886_CONTACT_SHEETS_FAILED'}
