name: RG QA pause isolation v2 safe install
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-qa-pause-v2-safe-install.yml']
permissions: {contents: read}
concurrency:
  group: rg-qa-pause-isolation-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          $ErrorActionPreference='Stop'
          $p='F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe'
          & $p -X utf8 rg_repair_20261110/rg_qa_pause_isolation_v2.py --install
          if($LASTEXITCODE -ne 0){throw 'QA_PAUSE_INSTALL_FAILED'}
          & $p -m py_compile 'F:\RG_AUTO_EDIT\RG Auto Edit App\rg_fullstream_worker_v3.py' 'F:\RG_AUTO_EDIT\RG Auto Edit App\rg_fullstream_batch_v53.py'
          if($LASTEXITCODE -ne 0){throw 'QA_PAUSE_COMPILE_FAILED'}
          Write-Output 'RGQAPAUSE|COMPILE|PASS'
