name: RG 895 BARS alert presence timeline metrics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-895-bars-presence-metrics.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_895_bars_presence_metrics.py
          if($LASTEXITCODE -ne 0){throw 'BARS_895_PRESENCE_METRICS_ERROR'}
