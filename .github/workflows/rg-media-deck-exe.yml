name: RG Media Deck 0.1.3 Windows EXE

on:
  push:
    branches:
      - rg-media-deck-exe-011
    paths:
      - rg_media_deck/build/**
      - .github/workflows/rg-media-deck-exe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Restore application source
        shell: pwsh
        run: |
          @'
          import base64, io, pathlib, zipfile
          root = pathlib.Path('rg_media_deck/build')
          target = root / 'work'
          target.mkdir(parents=True, exist_ok=True)
          payload = (root / 'source_013.b64').read_text(encoding='utf-8').strip()
          archive = base64.b64decode(payload, validate=True)
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert sorted(z.namelist()) == ['app.py', 'library.py', 'requirements.txt', 'tests/test_updater.py', 'updater.py'], z.namelist()
              z.extractall(target)
          assert "VERSION = '0.1.3'" in (target / 'app.py').read_text(encoding='utf-8')
          print('Source restored and version checked')
          '@ | python -

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r rg_media_deck/build/work/requirements.txt "pyinstaller>=6.12,<7"
          python -c "from PySide6.QtMultimedia import QMediaPlayer; from PySide6.QtWidgets import QApplication; print('PySide6 Windows multimedia imports OK')"

      - name: Run updater safety tests
        shell: pwsh
        run: |
          Push-Location rg_media_deck/build/work
          python -m unittest discover -s tests -v
          python -m compileall -q .
          Pop-Location

      - name: Freeze standalone executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --windowed --onefile --noupx --name RG_Media_Deck --collect-all PySide6 --paths rg_media_deck/build/work rg_media_deck/build/work/app.py
          if (-not (Test-Path dist/RG_Media_Deck.exe)) { throw 'Missing EXE file' }

      - name: Windows bundled-Qt startup smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path dist/RG_Media_Deck.exe) -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI smoke test failed with exit code $($p.ExitCode)" }
          Write-Host 'EXE Windows startup smoke test passed (QtMultimedia + QtWidgets)'

      - name: Package with Russian test instructions
        shell: pwsh
        run: |
          @'
          RG MEDIA DECK 0.1.3 - WINDOWS EXE
          
          1. Распакуйте ZIP в любую папку (например D:\RG_Media_Deck).
          2. Дважды щелкните RG_Media_Deck.exe. Python не нужен.
          3. Укажите папки с фото и видео в приложении.
          4. В OBS захватывайте отдельное окно RG MEDIA DECK - OBS OUTPUT.
          5. Для звука настройте один источник, без дубля Desktop Audio.
          6. Проверьте видео A -> видео B: звук A должен полностью прекратиться.\n          7. ⚙ Налаштування -> Перевірити оновлення. Установка только после завершения стрима.
          
          Настройки автоматически берутся из предыдущей версии:
          %LOCALAPPDATA%\RGMediaDeck\settings.json
          
          Версия без цифровой подписи (при первом запуске возможен SmartScreen).
          Windows-сборка прошла автоматический тест запуска Qt.
          Реальное воспроизведение аудио/видео в OBS нужно проверить на ПК.
          '@ | Set-Content -Path "README_FIRST_RU.txt" -Encoding utf8
          $sha = (Get-FileHash -Path dist/RG_Media_Deck.exe -Algorithm SHA256).Hash
          "RG_Media_Deck.exe SHA256 $sha" | Set-Content -Path "SHA256.txt" -Encoding ascii
          "$sha  RG_Media_Deck.exe" | Set-Content -Path "RG_Media_Deck.exe.sha256" -Encoding ascii
          Copy-Item dist/RG_Media_Deck.exe -Destination RG_Media_Deck.exe
          Compress-Archive -Path RG_Media_Deck.exe,README_FIRST_RU.txt,SHA256.txt -DestinationPath RG_Media_Deck_0.1.3_EXE.zip -CompressionLevel Optimal -Force

      - uses: actions/upload-artifact@v4
        with:
          name: RG_Media_Deck_0.1.3_EXE_Windows
          path: RG_Media_Deck_0.1.3_EXE.zip
          retention-days: 14
          if-no-files-found: error

      - name: Publish app-specific GitHub prerelease for the built-in updater
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'rg-media-deck-v0.1.3'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag RG_Media_Deck.exe RG_Media_Deck.exe.sha256 RG_Media_Deck_0.1.3_EXE.zip --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag RG_Media_Deck.exe RG_Media_Deck.exe.sha256 RG_Media_Deck_0.1.3_EXE.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'RG Media Deck 0.1.3 (EXE, updater)' --notes 'Windows EXE beta. Search, preview, OBS output, audio switch fix, Settings > Updates with SHA256 verification and rollback. First validate on a non-live stream.' --prerelease
          }
