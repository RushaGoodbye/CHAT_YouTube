name: RG YouTube Public Updates

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/rg_youtube_control/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "packaging/**"
      - "run_app.py"
      - ".github/workflows/windows-update-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rg-youtube-public-updates
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH="src"
          python -m pytest -q tests

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "RG YouTube Control" `
            --paths src run_app.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\installer.iss

      - name: Prepare public update site
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          $file = Get-ChildItem installer\*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()

          $site = "public-update-site\updates"
          New-Item -ItemType Directory -Force $site | Out-Null
          Copy-Item $file.FullName (Join-Path $site $file.Name) -Force

          $checksumName = "$($file.Name).sha256"
          "$hash  $($file.Name)" | Set-Content -Encoding ascii (Join-Path $site $checksumName)

          $base = "https://rushagoodbye.github.io/CHAT_YouTube/updates"
          $manifest = [ordered]@{
            version = $version
            installer_name = $file.Name
            installer_url = "$base/$($file.Name)"
            checksum_url = "$base/$checksumName"
            notes = "Public update $version"
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $site "latest.json")

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-update-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy update site
        id: deployment
        uses: actions/deploy-pages@v4
