name: RG YouTube SEO + LIVE Evidence Proof - ONE SHOT

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rg-youtube-seo-and-live-proof-once.yml"

permissions:
  contents: read

concurrency:
  group: rg-youtube-seo-live-evidence-proof
  cancel-in-progress: false

jobs:
  local-evidence-proof:
    if: >-
      github.repository == 'RushaGoodbye/CHAT_YouTube' &&
      github.event.pull_request.head.repo.full_name == 'RushaGoodbye/CHAT_YouTube' &&
      github.event.pull_request.head.ref == 'audit/youtube-control-0710-comprehensive-qa'
    runs-on: [self-hosted, windows]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare isolated Python runtime
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Python virtual environment unavailable' }
          & ".\.venv\Scripts\python.exe" -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies unavailable' }
      - name: Re-evaluate one real main-channel SRT with revised grounded quotation
        shell: pwsh
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          & ".\.venv\Scripts\python.exe" -u scripts/rg_youtube_real_seo_local_qa.py
          if ($LASTEXITCODE -ne 0) { throw 'Private real-video SEO QA failed to complete' }
      - name: Verify full textual coverage of two sampled LIVE public captions (no Ollama)
        shell: pwsh
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          & ".\.venv\Scripts\python.exe" -u scripts/rg_youtube_live_captions_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'LIVE read-only caption proof failed' }
      - name: Upload numeric-only reports; never transcripts, titles or video IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg-youtube-seo-live-evidence-anonymous
          path: |
            rg_youtube_real_seo_anonymous_qa.json
            rg_youtube_live_captions_anonymous_preflight.json
          if-no-files-found: ignore
          retention-days: 5
