name: RG 915 embedded source and 908 screenshot resolver readonly
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-915-source-selection-excerpts.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - shell: pwsh
        run: |
          $root='F:\RG_AUTO_EDIT\RG Auto Edit App'
          foreach($q in @(@('rg_embedded_audio_source_v1.py',1,250),@('rg_multi_dialogue.py',570,680),@('rg_oss_sync.py',375,440))){
            $p=Join-Path $root $q[0]
            if(!(Test-Path $p)){continue}
            $s=@(Get-Content -LiteralPath $p -Encoding UTF8)
            Write-Output ('RGSEL|FILE|'+$q[0]+'|'+$s.Count)
            for($k=$q[1];$k -le [Math]::Min($q[2],$s.Count);$k++){Write-Output ('RGSEL|CODE|'+$q[0]+'|'+$k+'|'+$s[$k-1])}
          }
