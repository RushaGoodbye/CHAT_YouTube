name: RG 904 Launch Readonly Probe
on:
  push:
    branches:
      - 'auto-edit/892-threezone-shadow-20261010'
    paths:
      - 'rg_remote_control/open_source_v1/probe_904_launch_readonly.py'
      - '.github/workflows/rg-904-launch-readonly-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, windows]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect 904 inputs and Studio launch UI without edits
        shell: powershell
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: |
          $py = 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe'
          if (-not (Test-Path $py)) { throw 'Runtime Python missing' }
          & $py -X utf8 rg_remote_control/open_source_v1/probe_904_launch_readonly.py
          if ($LASTEXITCODE -ne 0) { throw '904 read-only probe failed' }
