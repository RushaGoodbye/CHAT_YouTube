name: RG 885 ten true popup appearance regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-real-popup-regression-ten.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_885_popup_real_positive_metrics_v1.py
          if($LASTEXITCODE -ne 0){throw 'RG_REAL_NOTIFICATION_METRICS_FAILED'}
