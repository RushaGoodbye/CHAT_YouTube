name: RG AlexPC Control

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "rg_remote_control/task.json"
      - ".github/workflows/rg-alexpc-control.yml"

permissions:
  contents: read

concurrency:
  group: rg-alexpc-control
  cancel-in-progress: true

jobs:
  run:
    runs-on: [self-hosted, rg, alexpc, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Validate target
        shell: powershell
        run: |
          $task = Get-Content "rg_remote_control/task.json" -Raw | ConvertFrom-Json
          if ($task.target -ne "alexpc") { throw "Task target must be alexpc" }
          if ($task.action -notin @("health","probe_environment","stage_remote_mcp_to_nas","probe_ssh_config","probe_nas_ssh_auth","probe_nas_mcp_inventory","probe_nas_telegram_mcp_fast","list_nas_project_roots","probe_nas_shares","probe_nas_telegram_locations","probe_telegram_production_layout","probe_nas_identity","probe_nas_home_connection","install_and_probe_nas_ssh_key","probe_nas_command_bus","sync_nas_command_bus_mcp","probe_command_bus_state","sync_nas_scheduler_tick","wait_for_mcp_command_bus","probe_scheduler_history","probe_contour_mounts","probe_nas_cached_identity","request_local_mcp_deploy","probe_local_mcp_deploy","probe_remote_commander_runtime","install_live_mcp_autodeploy_hook")) { throw "Action is not allowed on AlexPC" }
      - name: Run restricted task
        shell: powershell
        run: python rg_remote_control/task_runner.py rg_remote_control/task.json
