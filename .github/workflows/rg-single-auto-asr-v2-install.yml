name: RG ASR single auto pass V2 safe install
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-single-auto-asr-v2-install.yml']
permissions: {contents: read}
concurrency:
  group: rg-asr-v3-maintenance
  cancel-in-progress: false
jobs:
  install:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          $ErrorActionPreference='Stop'
          $py='F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe'
          & $py -X utf8 rg_repair_20261110/rg_fullstream_asr_single_auto_v2.py --install
          if($LASTEXITCODE -ne 0){throw 'ASR_SINGLE_PASS_INSTALL_FAILED'}
          & $py -m py_compile 'F:\RG_AUTO_EDIT\RG Auto Edit App\rg_fullstream_asr_chunked_v58.py' 'F:\RG_AUTO_EDIT\RG Auto Edit App\rg_fullstream_asr_child_v58.py' 'F:\RG_AUTO_EDIT\RG Auto Edit App\rg_fullstream_auto_v2.py' 'F:\RG_AUTO_EDIT\RG Auto Edit App\rg_fullstream_editorial_gate_v82.py' 'F:\RG_AUTO_EDIT\RG Auto Edit App\rg_fullstream_batch_v53.py'
          if($LASTEXITCODE -ne 0){throw 'ASR_SINGLE_PASS_POST_COMPILE_FAILED'}
          Write-Output 'RGASRSINGLE|POST_COMPILE|PASS'
