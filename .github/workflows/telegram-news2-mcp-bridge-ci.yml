name: Telegram News 2 MCP Bridge CI
on:
  push:
    branches:
      - telegram-nas-news2-bridge-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        working-directory: rg_remote_mcp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Verify read-only News 2 smoke contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("rg_remote_mcp/rg_remote_mcp/news2_live_smoke.py").read_text()
          assert 'telegram_news2_status' in text
          assert 'telegram_news2_publish_dry_run' in text
          assert 'telegram_news2_photo_review' not in text
          assert 'publish-once' not in text
          assert 'poll-once' not in text
          PY
      - name: News2 read-only readiness syntax
        run: python -m py_compile rg_remote_control/nas/rg_news2_moderation_readiness_v1.py
      - name: Fresh photo shortlist syntax
        run: python -m py_compile rg_remote_control/nas/rg_news2_fresh_photo_candidates_ro_v1.py
      - name: Check single-card fail-closed preflight
        run: |
          python -m py_compile rg_remote_control/nas/rg_news2_one_card_preflight_v1.py
          python - <<'PY'
          from pathlib import Path
          s=Path("rg_remote_control/nas/rg_news2_one_card_preflight_v1.py").read_text()
          assert '"ready_to_send":False' in s
          assert '"exclusive_owner_verified":False' in s
          assert '"image_verified":False' in s
          assert "sqlite3.connect(uri,uri=True" in s
          PY
      - name: Network preflight syntax and no-send guard
        run: |
          python -m py_compile rg_remote_control/nas/rg_news2_one_card_network_preflight_v1.py
          python - <<'PY'
          from pathlib import Path
          s=Path("rg_remote_control/nas/rg_news2_one_card_network_preflight_v1.py").read_text()
          assert '/getWebhookInfo' in s
          assert '/getUpdates' not in s
          assert '/sendPhoto' not in s
          assert 'mode=ro' in s
          PY
      - name: Poll owner inventory safety
        run: |
          python -m py_compile rg_remote_control/nas/rg_news2_poll_owner_local_audit_v1.py
          python - <<'PY'
          from pathlib import Path
          s=Path("rg_remote_control/nas/rg_news2_poll_owner_local_audit_v1.py").read_text()
          assert '"sole_poll_owner_verified":False' in s
          assert '"poll_calls":0' in s
          assert '"telegram_sends":0' in s
          assert "read_bytes()" in s
          assert '"cmdline":' not in s
          PY
      - name: Static syntax validation
        run: |
          python -m compileall -q rg_remote_mcp/rg_remote_mcp rg_remote_mcp/tests
      - name: Run MCP isolation and bridge tests
        working-directory: rg_remote_mcp
        run: python -m pytest -q
      - name: Check NAS deployment script syntax
        run: sh -n rg_remote_mcp/scripts/telegram_news2_targeted_cutover.sh
      - name: Validate Compose structure
        working-directory: rg_remote_mcp
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("docker-compose.yml").read_text()
          assert sum(line.lstrip().startswith("- /volume1/docker/RG_TELEGRAM_NEWS_2:") for line in text.splitlines()) == 2
          assert "/volume1/docker/RG_TELEGRAM_NEWS_2:/volume1/docker/RG_TELEGRAM_NEWS_2:rw" in text
          assert "/workspace/telegram_news_2:rw" in text
          print("TELEGRAM_NEWS2_COMPOSE_MOUNT_PRESENT")
          PY
