name: SEO idle LM Studio unload on AlexPC
on:
  pull_request:
    paths:
      - ".github/workflows/seo-idle-model-unload.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rg-seo-lmstudio-exclusive-alexpc
  cancel-in-progress: false
jobs:
  safely-unload-idle-models:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'RushaGoodbye' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Check active requests before unloading only idle Qwen Gemma
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base='http://127.0.0.1:1234'
          $targets=@('qwen3-14b','google/gemma-4-12b')
          $smi='C:\Windows\System32\nvidia-smi.exe'
          Write-Output ('CHECK_UTC='+[DateTime]::UtcNow.ToString('o'))
          if(Test-Path -LiteralPath $smi) {
            & $smi --query-gpu=name,memory.used,memory.free,utilization.gpu --format=csv,noheader
          }
          try {
            $inventory=Invoke-RestMethod -Uri ($base+'/api/v1/models') -TimeoutSec 5
          } catch {
            Write-Output 'NO_ACTIVE_LM_STUDIO_SERVER_NO_CHANGE'
            exit 0
          }
          $models=@($inventory.models | Where-Object { $_.key -in $targets -and $_.loaded_instances })
          foreach($model in $models) {
            $instanceIds=@($model.loaded_instances | ForEach-Object { $_.id } | Where-Object { $_ })
            Write-Output ('LOADED_MODEL='+$model.key+' INSTANCES='+$instanceIds.Count)
          }
          if($models.Count -eq 0) {Write-Output 'NO_MANAGED_MODELS_LOADED_NO_CHANGE';exit 0}
          # Wait and sample. Any established client connection to the LM server
          # is treated as active work, even when GPU is otherwise idle.
          $activity=$false
          $processIds=@(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'llama-server.exe' } |
            ForEach-Object { $_.ProcessId })
          $cpuBefore=@{}
          foreach($pidNumber in $processIds) {
            $proc=Get-Process -Id $pidNumber -ErrorAction SilentlyContinue
            if($proc) {$cpuBefore[[string]$pidNumber]=$proc.CPU}
          }
          foreach($sample in 1..3) {
            $connections=@(Get-NetTCPConnection -LocalPort 1234 -State Established -ErrorAction SilentlyContinue)
            $connections+=@(Get-NetTCPConnection -RemotePort 1234 -State Established -ErrorAction SilentlyContinue)
            if($connections.Count -gt 0) {$activity=$true}
            Start-Sleep -Seconds 4
          }
          foreach($pidNumber in $processIds) {
            $proc=Get-Process -Id $pidNumber -ErrorAction SilentlyContinue
            if($proc -and $cpuBefore.ContainsKey([string]$pidNumber)) {
              $delta=$proc.CPU-$cpuBefore[[string]$pidNumber]
              Write-Output ('LLAMA_CPU_DELTA_SECONDS='+[math]::Round($delta,2))
              if($delta -gt 1.5) {$activity=$true}
            }
          }
          if($activity) {
            Write-Output 'SKIP_ACTIVE_LM_STUDIO_REQUEST_OR_INFERENCE'
            exit 0
          }
          # Recheck connections immediately before the single unload request.
          $live=@(Get-NetTCPConnection -LocalPort 1234 -State Established -ErrorAction SilentlyContinue)
          if($live.Count -gt 0) {Write-Output 'SKIP_NEW_LM_STUDIO_CLIENT_ACTIVITY';exit 0}
          $current=Invoke-RestMethod -Uri ($base+'/api/v1/models') -TimeoutSec 5
          $allowed=@($current.models | Where-Object { $_.key -in $targets -and $_.loaded_instances })
          $count=0
          foreach($model in $allowed) {
            foreach($instance in @($model.loaded_instances)) {
              if(-not $instance.id) {continue}
              $payload=@{instance_id=$instance.id} | ConvertTo-Json -Compress
              try {
                $response=Invoke-RestMethod -Uri ($base+'/api/v1/models/unload') -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 45
                Write-Output ('UNLOADED_IDLE_MODEL='+$model.key)
                $count++
              } catch {
                Write-Output ('UNLOAD_FAILED_MODEL='+$model.key+' ERROR='+$_.Exception.GetType().Name)
              }
            }
          }
          Start-Sleep -Seconds 2
          if(Test-Path -LiteralPath $smi) {
            Write-Output 'GPU_AFTER_UNLOAD'
            & $smi --query-gpu=name,memory.used,memory.free,utilization.gpu --format=csv,noheader
          }
          Write-Output ('UNLOADED_COUNT='+$count)
