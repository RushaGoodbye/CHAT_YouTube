name: RG 904 Final QA Readonly Diagnostic
on:
  push:
    branches: ['auto-edit/892-threezone-shadow-20261010']
    paths:
      - 'rg_remote_control/open_source_v1/diag_904_final_qa_readonly.py'
      - '.github/workflows/rg-904-final-qa-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, windows]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect final 904 XML and smoking QA without modification
        shell: powershell
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: |
          $py='F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe'
          if (-not (Test-Path $py)) { throw 'Missing studio runtime' }
          & $py -X utf8 rg_remote_control/open_source_v1/diag_904_final_qa_readonly.py
          if ($LASTEXITCODE -ne 0) { throw '904 final QA diagnostic failed' }
