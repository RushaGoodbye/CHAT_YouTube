name: RG YouTube Real SEO Readonly Ollama QA - ONE SHOT

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rg-youtube-real-seo-local-once.yml"

permissions:
  contents: read

concurrency:
  group: rg-youtube-real-seo-local-once
  cancel-in-progress: false

jobs:
  local-private-qa:
    if: >-
      github.repository == 'RushaGoodbye/CHAT_YouTube' &&
      github.event.pull_request.head.repo.full_name == 'RushaGoodbye/CHAT_YouTube' &&
      github.event.pull_request.head.ref == 'audit/youtube-control-0710-comprehensive-qa'
    runs-on: [self-hosted, windows]
    timeout-minutes: 25
    steps:
      - name: Checkout only authenticated source revision without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify local model and create Python environment
        shell: pwsh
        run: |
          $probe = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -TimeoutSec 6
          if (-not (@($probe.models.name) | Where-Object { $_ -like 'qwen3:8b*' })) {
            throw "Local Ollama model qwen3:8b is unavailable"
          }
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "Python venv failed" }
          & ".\.venv\Scripts\python.exe" -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Python dependency installation failed" }
      - name: Analyze one entire archived SRT locally (read only, NO YouTube API)
        shell: pwsh
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          & ".\.venv\Scripts\python.exe" -u scripts/rg_youtube_real_seo_local_qa.py
          if ($LASTEXITCODE -ne 0) { throw "Local real-video semantic QA crashed" }
      - name: Upload aggregate QA counters ONLY (no video identifiers or content)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg-youtube-real-video-private-seo-metrics
          path: rg_youtube_real_seo_anonymous_qa.json
          if-no-files-found: ignore
          retention-days: 7
