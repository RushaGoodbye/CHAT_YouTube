name: RG NAS Passive Gatus Monitor Offline QA

on:
  pull_request:
    paths:
      - rg_remote_control/nas/monitoring/**
      - tests/test_rg_nas_gatus_observer.py
      - rg_remote_control/nas/monitoring/rg_news2_batch_audit_v1.py
      - .github/workflows/rg-nas-gatus-offline-qa.yml
  push:
    branches: [main, feat/nas-gatus-passive-monitor-20261025]
    paths:
      - rg_remote_control/nas/monitoring/**
      - tests/test_rg_nas_gatus_observer.py
      - rg_remote_control/nas/monitoring/rg_news2_batch_audit_v1.py
      - .github/workflows/rg-nas-gatus-offline-qa.yml

permissions:
  contents: read

jobs:
  monitor-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python offline regression tests (no NAS access)
        run: python3 tests/test_rg_nas_gatus_observer.py
      - name: Check installer shell syntax and ShellCheck
        run: |
          sh -n rg_remote_control/nas/monitoring/rg_nas_gatus_install.sh
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --shell=sh --severity=warning rg_remote_control/nas/monitoring/rg_nas_gatus_install.sh
      - name: NEWS2 live scheduler offline audit selftest (no Bot API or SQLite writes)
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_batch_audit_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_batch_audit_v1.py selftest
      - name: Validate isolated compose config
        env:
          GATUS_MONITOR_TOKEN: test-local-token-only-never-production-000000
        run: docker compose -f rg_remote_control/nas/monitoring/compose.yaml config -q
      - name: Gatus sandbox integration with localhost status delivery
        env:
          GATUS_MONITOR_TOKEN: test-local-token-only-never-production-000000
        run: |
          set -eu
          temp_dir="$(mktemp -d)"
          trap 'docker rm -f rg-gatus-offline-qa >/dev/null 2>&1 || true; rm -rf "$temp_dir"' EXIT
          docker run -d --name rg-gatus-offline-qa \
            --publish 127.0.0.1:18080:8080 \
            --env GATUS_MONITOR_TOKEN \
            --env GATUS_CONFIG_PATH=/config/config.yaml \
            --mount "type=bind,src=$PWD/rg_remote_control/nas/monitoring/config.yaml,dst=/config/config.yaml,readonly" \
            --mount "type=bind,src=$temp_dir,dst=/data" \
            ghcr.io/twin/gatus:v5.37.0
          sleep 5
          docker logs rg-gatus-offline-qa
          test "$(docker inspect -f '{{.State.Running}}' rg-gatus-offline-qa)" = true
          python3 - "$temp_dir" <<'PY'
          import json, os, pathlib, sys
          from datetime import datetime, timezone
          root=pathlib.Path(sys.argv[1])
          state=root/"RG_NAS_STATE"
          state.mkdir()
          current=datetime.now(timezone.utc).isoformat()
          (state/"scheduler_last_check_at").write_text(current)
          (state/"scheduler_last_check_status").write_text("OK")
          (state/"telegram_scheduler_components_checked_at").write_text(current)
          (state/"telegram_scheduler_components_status").write_text("OK")
          (state/"RG_CONTROL_CENTER.json").write_text(json.dumps({"updated_at":current,"status":"ok"}))
          token=root/"token"
          token.write_text(os.environ["GATUS_MONITOR_TOKEN"])
          token.chmod(0o600)
          PY
          python3 rg_remote_control/nas/monitoring/rg_nas_gatus_observer_v1.py \
            --root "$temp_dir" --push --token-file "$temp_dir/token"
          printf 'ERROR\n' > "$temp_dir/RG_NAS_STATE/telegram_scheduler_components_status"
          if python3 rg_remote_control/nas/monitoring/rg_nas_gatus_observer_v1.py \
            --root "$temp_dir" --push --token-file "$temp_dir/token"; then
            echo "FAIL: expected unhealthy status" >&2
            exit 1
          else
            rc=$?
            test "$rc" -eq 2
          fi
