permissions:
  contents: read

jobs:
  nas-old-python-readonly:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Confirm NAS Python <=3.8 compatibility and no unsafe literals
        run: |
          python -c "import sys, ast; assert sys.version_info[:2] == (3,8); assert not hasattr(ast,'unparse')"
          python -m py_compile rg_remote_control/nas/monitoring/rg_news2_gate_source_only_v1.py
          python rg_remote_control/nas/monitoring/rg_news2_gate_source_only_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/rg_news2_private_route_contract_v1.py
          python rg_remote_control/nas/monitoring/rg_news2_private_route_contract_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/rg_news2_private_final_bundle_v1.py
          python rg_remote_control/nas/monitoring/rg_news2_private_final_bundle_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/rg_news2_post_button_live_verify_v1.py
          python rg_remote_control/nas/monitoring/rg_news2_post_button_live_verify_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/rg_news2_delivery_blocker_live_v1.py
          python rg_remote_control/nas/monitoring/rg_news2_delivery_blocker_live_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/rg_news2_stalled_send_reconcile_v1.py
          python rg_remote_control/nas/monitoring/rg_news2_stalled_send_reconcile_v1.py selftest
          python -m py_compile rg_remote_control/nas/monitoring/rg_news2_capacity_resume_v1.py
          python rg_remote_control/nas/monitoring/rg_news2_capacity_resume_v1.py selftest
          python rg_remote_control/nas/monitoring/test_rg_news2_capacity_resume_v1.py
          python rg_remote_control/nas/monitoring/test_rg_news2_private_final_bundle_v1.py
  monitor-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python offline regression tests (no NAS access)
        run: python3 tests/test_rg_nas_gatus_observer.py
      - name: Check installer shell syntax and ShellCheck
        run: |
          sh -n rg_remote_control/nas/monitoring/rg_nas_gatus_install.sh
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --shell=sh --severity=warning rg_remote_control/nas/monitoring/rg_nas_gatus_install.sh
      - name: NEWS2 live scheduler offline audit selftest (no Bot API or SQLite writes)
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_batch_audit_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_batch_audit_v1.py selftest
      - name: Read-only NEWS2 operations smoke and secret-redaction tests
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_operations_audit_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_operations_audit_v1.py selftest
      - name: NEWS2 aggregate funnel and publication-ledger secret-redaction QA
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_workflow_funnel_audit_v2.py
          python3 rg_remote_control/nas/monitoring/rg_news2_workflow_funnel_audit_v2.py selftest
      - name: NEWS2 photo bottleneck selftest and privacy guard
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_bottleneck_audit_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_photo_bottleneck_audit_v1.py selftest
      - name: NEWS2 static photo worker handler contract
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_worker_contract_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_photo_worker_contract_v1.py selftest
      - name: NEWS2 current photo handoff static analyzer
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_handoff_v2.py
          python3 rg_remote_control/nas/monitoring/rg_news2_photo_handoff_v2.py selftest
      - name: NEWS2 guarded photo preflight and SQLite outbox fixture QA
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_repair_preflight_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_photo_repair_preflight_v1.py selftest
      - name: Verify NEWS2 photo private outbox gate without writes
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_final_gate_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_photo_final_gate_v1.py selftest
      - name: Fail-closed NEWS2 photo state, duplicate and outbox safety regression
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_recovery_gate_v2.py
          python3 rg_remote_control/nas/monitoring/rg_news2_photo_recovery_gate_v2.py selftest
      - name: Photo repair dispatch contract and duplicate guard offline regression
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_contract_repair_plan_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_photo_contract_repair_plan_v1.py selftest
      - name: Photo repair snapshot and duplicate-state offline QA
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_repair_bundle_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_photo_repair_bundle_v1.py selftest
          sudo python3 rg_remote_control/nas/monitoring/rg_news2_photo_repair_bundle_v1.py selftest
      - name: Private NEWS2 photo backup launcher shell checks
        run: |
          sh -n rg_remote_control/nas/monitoring/rg_news2_photo_prepare_once_v1.sh
          shellcheck --shell=sh --severity=warning rg_remote_control/nas/monitoring/rg_news2_photo_prepare_once_v1.sh
      - name: NEWS2 photo all-in-one batch and root-only backup QA
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_batch_recovery_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_photo_batch_recovery_v1.py selftest
          sudo python3 rg_remote_control/nas/monitoring/rg_news2_photo_batch_recovery_v1.py selftest
      - name: NEWS2 one-shot full photo source contract and privacy QA
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_batch_contract_export_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_photo_batch_contract_export_v1.py selftest
      - name: NEWS2 archive prior pending photo queue without losing references
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_archive_old_photo_queue_v1.py
          sudo python3 rg_remote_control/nas/monitoring/rg_news2_archive_old_photo_queue_v1.py selftest
      - name: Private photo one-canary tick integration and rollback syntax regression
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_tick_integrator_v1.py
          sudo python3 rg_remote_control/nas/monitoring/rg_news2_photo_tick_integrator_v1.py selftest
      - name: Simulate one private receipt and automatic DSM hook rollback
        run: |
          sudo python3 rg_remote_control/nas/monitoring/test_rg_news2_photo_tick_integrator_v1.py
      - name: NEWS2 adaptive private photo CLI one-canary and rollback integration regression
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_tick_integrator_v2.py
          python3 -m py_compile rg_remote_control/nas/monitoring/test_rg_news2_photo_tick_integrator_v2.py
          sudo python3 rg_remote_control/nas/monitoring/rg_news2_photo_tick_integrator_v2.py selftest
          sudo python3 rg_remote_control/nas/monitoring/test_rg_news2_photo_tick_integrator_v2.py
      - name: NEWS2 final batch end-to-end private canary rollback and safe error detail
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_final_batch_v3.py
          python3 -m py_compile rg_remote_control/nas/monitoring/test_rg_news2_photo_final_batch_v3.py
          sudo python3 rg_remote_control/nas/monitoring/rg_news2_photo_final_batch_v3.py selftest
          sudo python3 rg_remote_control/nas/monitoring/test_rg_news2_photo_final_batch_v3.py
      - name: NEWS2 pinned direct photo run entrypoint and rollback QA
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_final_batch_v4.py
          sudo python3 rg_remote_control/nas/monitoring/rg_news2_photo_final_batch_v4.py selftest
      - name: NEWS2 V5 real status-shortcut private photo receipt no-retry and rollback
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_final_batch_v5.py
          python3 -m py_compile rg_remote_control/nas/monitoring/test_rg_news2_photo_final_batch_v5.py
          sudo python3 rg_remote_control/nas/monitoring/rg_news2_photo_final_batch_v5.py selftest
          sudo python3 rg_remote_control/nas/monitoring/test_rg_news2_photo_final_batch_v5.py
      - name: NEWS2 V6 pinned direct mode with no-return status branch, receipt and rollback
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_photo_final_batch_v6.py
          python3 -m py_compile rg_remote_control/nas/monitoring/test_rg_news2_photo_final_batch_v6.py
          sudo python3 rg_remote_control/nas/monitoring/rg_news2_photo_final_batch_v6.py selftest
          sudo python3 rg_remote_control/nas/monitoring/test_rg_news2_photo_final_batch_v6.py
      - name: NEWS2 source-truth runtime AST, DB and uncertainty read-only bundle QA
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_runtime_evidence_bundle_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_runtime_evidence_bundle_v1.py selftest
          sudo python3 rg_remote_control/nas/monitoring/rg_news2_runtime_evidence_bundle_v1.py selftest
      - name: NEWS2 verified installed mode and private-vs-public call path
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_private_route_contract_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_private_route_contract_v1.py selftest
      - name: NEWS2 guarded capacity recovery, no-public regression, protected marker
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_capacity_resume_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_capacity_resume_v1.py selftest
          python3 rg_remote_control/nas/monitoring/test_rg_news2_capacity_resume_v1.py
      - name: NEWS2 pinned worker uncertain capacity root-cause AST audit
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_stalled_send_reconcile_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_stalled_send_reconcile_v1.py selftest
      - name: NEWS2 blocked regular photo dispatch capacity and rate read-only audit
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_delivery_blocker_live_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_delivery_blocker_live_v1.py selftest
      - name: NEWS2 post-button callback and DSM scheduler read-only verifier QA
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_post_button_live_verify_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_post_button_live_verify_v1.py selftest
      - name: NEWS2 final private-only isolated sender and rollback preflight
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_private_final_bundle_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_private_final_bundle_v1.py selftest
          python3 rg_remote_control/nas/monitoring/test_rg_news2_private_final_bundle_v1.py
      - name: NEWS2 gate inspector PowerShell independent source-only selftest
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/rg_news2_gate_source_only_v1.py
          python3 rg_remote_control/nas/monitoring/rg_news2_gate_source_only_v1.py selftest
      - name: Validate NEWS2 monitor and guarded updater
        env:
          GATUS_MONITOR_TOKEN: test-local-token-only-never-production-000000
        run: |
          python3 rg_remote_control/nas/monitoring/rg_news2_gatus_observer_v2.py selftest
          python3 rg_remote_control/nas/monitoring/rg_news2_batch_audit_v1.py selftest
          sh -n rg_remote_control/nas/monitoring/rg_news2_gatus_batch_upgrade_v2.sh
          shellcheck --shell=sh --severity=warning rg_remote_control/nas/monitoring/rg_news2_gatus_batch_upgrade_v2.sh
          docker compose -f rg_remote_control/nas/monitoring/compose-news2.yaml config -q
      - name: Validate isolated compose config
        env:
          GATUS_MONITOR_TOKEN: test-local-token-only-never-production-000000
        run: docker compose -f rg_remote_control/nas/monitoring/compose.yaml config -q
      - name: Gatus sandbox integration with localhost status delivery
        env:
          GATUS_MONITOR_TOKEN: test-local-token-only-never-production-000000
        run: |
          set -eu
          temp_dir="$(mktemp -d)"
          trap 'docker rm -f rg-gatus-offline-qa >/dev/null 2>&1 || true; rm -rf "$temp_dir"' EXIT
          docker run -d --name rg-gatus-offline-qa \
            --publish 127.0.0.1:18080:8080 \
            --env GATUS_MONITOR_TOKEN \
            --env GATUS_CONFIG_PATH=/config/config.yaml \
            --mount "type=bind,src=$PWD/rg_remote_control/nas/monitoring/config.yaml,dst=/config/config.yaml,readonly" \
            --mount "type=bind,src=$temp_dir,dst=/data" \
            ghcr.io/twin/gatus:v5.37.0
          sleep 5
          docker logs rg-gatus-offline-qa
          test "$(docker inspect -f '{{.State.Running}}' rg-gatus-offline-qa)" = true
          python3 - "$temp_dir" <<'PY'
          import json, os, pathlib, sys
          from datetime import datetime, timezone
          root=pathlib.Path(sys.argv[1])
          state=root/"RG_NAS_STATE"
          state.mkdir()
          current=datetime.now(timezone.utc).isoformat()
          (state/"scheduler_last_check_at").write_text(current)
          (state/"scheduler_last_check_status").write_text("OK")
          (state/"telegram_scheduler_components_checked_at").write_text(current)
          (state/"telegram_scheduler_components_status").write_text("OK")
          (state/"RG_CONTROL_CENTER.json").write_text(json.dumps({"updated_at":current,"status":"ok"}))
          token=root/"token"
          token.write_text(os.environ["GATUS_MONITOR_TOKEN"])
          token.chmod(0o600)
          PY
          python3 rg_remote_control/nas/monitoring/rg_nas_gatus_observer_v1.py \
            --root "$temp_dir" --push --token-file "$temp_dir/token"
          printf 'ERROR\n' > "$temp_dir/RG_NAS_STATE/telegram_scheduler_components_status"
          if python3 rg_remote_control/nas/monitoring/rg_nas_gatus_observer_v1.py \
            --root "$temp_dir" --push --token-file "$temp_dir/token"; then
            echo "FAIL: expected unhealthy status" >&2
            exit 1
          else
            rc=$?
            test "$rc" -eq 2
          fi

      - name: NEWS2 Gatus end-to-end live container push (no NAS, no Telegram)
        env:
          GATUS_MONITOR_TOKEN: test-local-token-only-never-production-000000
        run: |
          set -eu
          temp_dir="$(mktemp -d)"
          trap 'docker rm -f rg-gatus-news2-ci >/dev/null 2>&1 || true; rm -rf "$temp_dir"' EXIT
          docker run -d --name rg-gatus-news2-ci \
            --publish 127.0.0.1:18080:8080 \
            --env GATUS_MONITOR_TOKEN \
            --env GATUS_CONFIG_PATH=/config/config.yaml \
            --mount "type=bind,src=$PWD/rg_remote_control/nas/monitoring/config-news2.yaml,dst=/config/config.yaml,readonly" \
            --mount "type=bind,src=$temp_dir,dst=/data" \
            ghcr.io/twin/gatus:v5.37.0
          sleep 6
          test "$(docker inspect -f '{{.State.Running}}' rg-gatus-news2-ci)" = true
          python3 - "$temp_dir" <<'PY'
          import os,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          d=p/"RG_TELEGRAM_NEWS_2"/"runtime"
          d.mkdir(parents=True)
          (d/"callback_v29_state.json").write_text('{"ok":true}')
          (d/"callback_v29.log").write_text("healthy\n")
          t=p/"token"
          t.write_text(os.environ["GATUS_MONITOR_TOKEN"])
          t.chmod(0o600)
          PY
          python3 rg_remote_control/nas/monitoring/rg_news2_gatus_observer_v2.py \
            --root "$temp_dir" --push --url http://127.0.0.1:18080 \
            --token-file "$temp_dir/token"
          printf '{\n' > "$temp_dir/RG_TELEGRAM_NEWS_2/runtime/callback_v29_state.json"
          if python3 rg_remote_control/nas/monitoring/rg_news2_gatus_observer_v2.py \
            --root "$temp_dir" --push --url http://127.0.0.1:18080 \
            --token-file "$temp_dir/token"; then
            echo "FAIL: expected invalid callback data to report unhealthy" >&2
            exit 1
          else
