name: RG 895 verify installed intro search boundary (READ ONLY)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg895-intro-boundary-v711.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm installed intro detector and test searching through 935s
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $py='F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe'
          & $py scripts\rg_895_intro_verify_limit_v711.py
          if($LASTEXITCODE -ne 0){throw 'RG895_INTRO_BOUNDARY_CHECK_FAILED'}
