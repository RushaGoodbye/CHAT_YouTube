name: RG targeted fullstream censorship and Studio startup source audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-fullstream-profanity-source-audit.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Read only targeted callsites and current running processes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app='F:\RG_AUTO_EDIT\RG Auto Edit App'
          foreach($file in @('rg_studio_main.py','rg_fullstream_auto_v2.py','rg_fullstream_batch_v53.py','rg_fullstream_editorial_gate_v82.py','rg_fullstream_gap_followup_v90.py','rg_fullstream_censor_rescue_v86.py','rg_fullstream_export_v1.py')){
            $p=Join-Path $app $file
            if(!(Test-Path $p)){Write-Output ('RGSELECT|MISSING|'+$file);continue}
            $lines=@(Get-Content -LiteralPath $p -Encoding UTF8)
            Write-Output ('RGSELECT|FILE|'+$file+'|LINES='+$lines.Count+'|SHA='+((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash))
            $hits=@(for($i=0;$i -lt $lines.Count;$i++){
              if($lines[$i] -match '(?i)profan|censor|mute|mat\b|obscen|one.sided|coverage|notification|editorial|full_spoken|__main__|QApplication|main\('){$i}
            })
            Write-Output ('RGSELECT|HITS|'+$file+'|'+$hits.Count)
            foreach($i in ($hits|Select-Object -First 24)){
              $low=[math]::Max(0,$i-1);$high=[math]::Min($lines.Count-1,$i+2)
              for($j=$low;$j -le $high;$j++){
                $line=$lines[$j]
                Write-Output ('RGSELECT|CODE|'+$file+'|'+($j+1)+'|'+$line.Substring(0,[math]::Min(230,$line.Length)))
              }
            }
          }
          $ps=@(Get-CimInstance Win32_Process|Where-Object{$_.CommandLine -match 'rg_studio_main\.py'})
          foreach($p in $ps){Write-Output ('RGSELECT|STUDIO|'+$p.ProcessId+'|PARENT='+$p.ParentProcessId+'|'+$p.Name)}
          Write-Output 'RGSELECT|READ_ONLY|TRUE'
