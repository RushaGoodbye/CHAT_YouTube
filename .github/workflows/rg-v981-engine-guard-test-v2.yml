name: RG V981 strict engine integrity preflight corrected
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-v981-engine-guard-test-v2.yml']
permissions: {contents: read}
jobs:
  acceptance:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_fix_stale_engine_pin_v981_v2.py
          if($LASTEXITCODE -ne 0){throw 'RGV981_V2_PIN_DRYRUN_FAILED'}
