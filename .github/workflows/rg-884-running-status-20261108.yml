name: RG Auto Edit - 884 running status read only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-884-running-status-20261108.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Check 884 process state and stage without touching workers
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Write-Output ('RG884RUN|TIME|'+(Get-Date -Format o))
          $p=@(Get-CimInstance Win32_Process|Where-Object{$_.Name -match '^pythonw?\.exe$' -and $_.CommandLine -match 'rg_studio_main.py|rg_multi_dialogue.py|rg_production_wrapper.py|rg_auto_edit_one_button.py|rg_embedded_audio_source'})
          foreach($x in $p){$cmd=[string]$x.CommandLine;$type=if($cmd -match 'rg_studio_main.py'){'STUDIO'}elseif($cmd -match 'rg_multi_dialogue.py|rg_auto_edit_one_button.py|rg_production_wrapper.py'){'WORKER'}else{'OTHER'};Write-Output ('RG884RUN|PROCESS|'+$type+'|'+$x.ProcessId+'|'+$x.ParentProcessId+'|'+$cmd.Substring(0,[Math]::Min(550,$cmd.Length)))}
          $app='F:\RG_AUTO_EDIT\RG Auto Edit App'
          $data='F:\RG_AUTO_EDIT\RG Auto Edit Data'
          foreach($candidate in @((Join-Path $app 'run_manifests\884'),(Join-Path $data 'run_state\884'),(Join-Path $app '884'))){
            if(Test-Path $candidate){
              Write-Output ('RG884RUN|DIR|'+$candidate)
              Get-ChildItem -LiteralPath $candidate -File -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|Select-Object -First 10|ForEach-Object{Write-Output ('RG884RUN|FILE|'+$_.Name+'|'+$_.LastWriteTime.ToString('o')+'|'+$_.Length)}
            }
          }
          $manifest=Join-Path $app 'RG_EDITED_884_MULTI_DIALOGUE.json'
          if(Test-Path $manifest){
            try{$j=Get-Content $manifest -Raw -Encoding UTF8|ConvertFrom-Json;Write-Output ('RG884RUN|MANIFEST|'+$j.status+'|'+$j.completed_dialogues+'|'+$j.dialogue_count)}catch{Write-Output ('RG884RUN|MANIFEST_ERROR|'+$_)}
          }
          $states=@(Get-ChildItem -Path $data -Filter '*884*' -File -Recurse -ErrorAction SilentlyContinue |Where-Object{$_.Name -match 'run_state|state|progress|log'}|Sort-Object LastWriteTime -Descending|Select-Object -First 6)
          foreach($s in $states){Write-Output ('RG884RUN|STATEFILE|'+$s.FullName+'|'+$s.LastWriteTime.ToString('o'))}
          Write-Output 'RG884RUN|READONLY_DONE'
