name: RG YouTube LIVE Real SEO Semantic QA - ONE SHOT

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rg-youtube-live-semantic-qa-once.yml"

permissions:
  contents: read

concurrency:
  group: rg-youtube-live-semantic-qa
  cancel-in-progress: false

jobs:
  private-live-seo:
    if: >-
      github.repository == 'RushaGoodbye/CHAT_YouTube' &&
      github.event.pull_request.head.repo.full_name == 'RushaGoodbye/CHAT_YouTube' &&
      github.event.pull_request.head.ref == 'audit/youtube-control-0710-comprehensive-qa'
    runs-on: [self-hosted, windows]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up private local Python and existing Ollama
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Local Python environment unavailable' }
          & ".\.venv\Scripts\python.exe" -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Local Python dependencies unavailable' }
      - name: Read public LIVE captions and analyze one moderate-length archive locally
        shell: pwsh
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          & ".\.venv\Scripts\python.exe" -u scripts/rg_youtube_real_live_seo_qa.py
          if ($LASTEXITCODE -ne 0) { throw 'Read-only local semantic QA process failed' }
      - name: Upload anonymous metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg-youtube-live-semantic-qa-anonymous-report
          path: rg_youtube_real_live_seo_anonymous_qa.json
          if-no-files-found: ignore
          retention-days: 5
