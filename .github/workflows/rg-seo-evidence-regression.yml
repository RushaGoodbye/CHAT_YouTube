name: SEO Evidence Regression

on:
  push:
    branches:
      - fix/seo-evidence-no-invented-third-20261012
      - fix/seo-preview-parity-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run evidence regressions
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest -q tests/test_seo_distinct_evidence_0725.py tests/test_shoigu_topic_coverage_0724.py tests/test_seo_preview_parity_0726.py
