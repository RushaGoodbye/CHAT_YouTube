name: RG Smoking Threezone Shadow QA

on:
  push:
    branches:
      - 'auto-edit/892-threezone-shadow-20261010'
    paths:
      - 'rg_remote_control/open_source_v1/smoking_threezone_892_shadow_v1.py'
      - 'rg_remote_control/open_source_v1/tests/test_smoking_threezone_shadow_v1.py'
      - '.github/workflows/rg-smoking-threezone-shadow-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-mask-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated CV test dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'opencv-python-headless==4.11.0.86'
      - name: Validate source syntax
        run: python -m py_compile rg_remote_control/open_source_v1/smoking_threezone_892_shadow_v1.py
      - name: Run isolated embedded smoke test
        run: python rg_remote_control/open_source_v1/smoking_threezone_892_shadow_v1.py --self-test
      - name: Run synthetic regressions
        run: python -m unittest discover -s rg_remote_control/open_source_v1/tests -p 'test_smoking_threezone_shadow_v1.py' -v
