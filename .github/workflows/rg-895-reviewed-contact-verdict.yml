name: RG 895 reviewed contact sheets verdict
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-895-reviewed-contact-verdict.yml']
permissions: {contents: read}
jobs:
  review:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_895_record_reviewed_contact_sheets.py
          if($LASTEXITCODE -ne 0){throw 'RG895_CONTACT_REVIEW_RECORD_FAILED'}
