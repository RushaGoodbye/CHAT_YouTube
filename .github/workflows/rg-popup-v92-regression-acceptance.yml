name: RG popup V92 guard and real-frame positive negative acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-popup-v92-regression-acceptance.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_popup_v92_labeled_regression_patch.py
          if($LASTEXITCODE -ne 0){throw 'POPUP_V92_REGRESSION_FAIL'}
