name: RG 885 rejected host notification review sheet
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-885-host-popup-review-sheet.yml']
permissions: {contents: read}
jobs:
  review:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_885_host_popup_review_sheet.py
          if($LASTEXITCODE -ne 0){throw '885_HOST_POPUP_SHEET_FAILED'}
