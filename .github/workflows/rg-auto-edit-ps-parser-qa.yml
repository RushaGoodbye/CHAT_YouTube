name: RG Auto Edit PowerShell Syntax QA
on:
  push:
    branches: [main]
    paths:
      - 'rg_remote_control/bootstrap_auto_edit_892_cigarette_gold_v1.ps1'
      - 'rg_remote_control/bootstrap_auto_edit_892_cigarette_gold_v2.ps1'
      - 'rg_remote_control/bootstrap_auto_edit_sam2_readiness_readonly_v2.ps1'
      - 'rg_remote_control/bootstrap_auto_edit_sam2_readiness_readonly_safe_v2.ps1'
      - 'rg_remote_control/bootstrap_auto_edit_sam2_native_892_mask_v1.ps1'
      - 'rg_remote_control/bootstrap_auto_edit_sam2_native_892_mask_safe_v1.ps1'
      - 'rg_remote_control/bootstrap_auto_edit_sam2_native_892_mask_safe_v2.ps1'
      - 'rg_remote_control/bootstrap_auto_edit_sam2_native_892_mask_safe_v3.ps1'
      - 'rg_remote_control/bootstrap_auto_edit_sam2_892_hydra_fix_v4.ps1'
      - 'rg_remote_control/bootstrap_auto_edit_sam2_video_track_892_shadow_v1.ps1'
      - 'rg_remote_control/bootstrap_auto_edit_sam2_video_track_892_fullmask_v2.ps1'
      - 'rg_remote_control/bootstrap_auto_edit_sam2_video_track_892_fullmask_safe_v3.ps1'
      - 'rg_remote_control/bootstrap_auto_edit_siglip_sam2_892_13frame_vs_886_shadow_v1.ps1'
      - 'rg_remote_control/bootstrap_auto_edit_yunet_mouth_892_shadow_v1.ps1'
      - 'rg_remote_control/open_source_v1/sam2_native_mask_892_shadow_v1.py'
      - '.github/workflows/rg-auto-edit-ps-parser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-51-full-ast-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 14 Auto Edit PowerShell scripts without running them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'rg_remote_control/bootstrap_auto_edit_892_cigarette_gold_v1.ps1',
            'rg_remote_control/bootstrap_auto_edit_892_cigarette_gold_v2.ps1',
            'rg_remote_control/bootstrap_auto_edit_sam2_readiness_readonly_v2.ps1',
            'rg_remote_control/bootstrap_auto_edit_sam2_readiness_readonly_safe_v2.ps1',
            'rg_remote_control/bootstrap_auto_edit_sam2_native_892_mask_v1.ps1',
            'rg_remote_control/bootstrap_auto_edit_sam2_native_892_mask_safe_v1.ps1',
            'rg_remote_control/bootstrap_auto_edit_sam2_native_892_mask_safe_v2.ps1',
            'rg_remote_control/bootstrap_auto_edit_sam2_native_892_mask_safe_v3.ps1',
            'rg_remote_control/bootstrap_auto_edit_sam2_892_hydra_fix_v4.ps1',
            'rg_remote_control/bootstrap_auto_edit_sam2_video_track_892_shadow_v1.ps1',
            'rg_remote_control/bootstrap_auto_edit_sam2_video_track_892_fullmask_v2.ps1',
            'rg_remote_control/bootstrap_auto_edit_sam2_video_track_892_fullmask_safe_v3.ps1',
            'rg_remote_control/bootstrap_auto_edit_siglip_sam2_892_13frame_vs_886_shadow_v1.ps1',
            'rg_remote_control/bootstrap_auto_edit_yunet_mouth_892_shadow_v1.ps1'
          )
          if (@($paths).Count -ne 14) { throw 'Incomplete PowerShell QA file list' }
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing PowerShell script: $path"
            }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path).Path,
              [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              foreach ($problem in $parseErrors) {
                Write-Host ('ERROR {0} line {1}: {2}' -f $path, $problem.Extent.StartLineNumber, $problem.Message)
              }
              throw "Windows PowerShell 5.1 parser rejected $path"
            }
            Write-Host "WINDOWS_POWERSHELL_51_AST_PARSE_PASS: $path"
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned SAM2 Python isolation check on Windows without -c
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $code = 'rg_remote_control/open_source_v1/sam2_native_mask_892_shadow_v1.py'
          $venv = Join-Path $env:RUNNER_TEMP 'rg_sam2_native_shadow_v1'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Isolated SAM2 test venv creation failed' }
          $py = Join-Path $venv 'Scripts\\python.exe'
          & $py -I -u $code --env-check
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows isolated SAM2 env check failed' }
          & python -I -u $code --env-check
          if ($LASTEXITCODE -eq 0) { throw 'Wrong environment incorrectly accepted' }
          Write-Host 'SAM2_NATIVE_PYTHON_ENV_GUARD_POSITIVE_AND_NEGATIVE_PASS'
      - name: Reject obsolete SAM2 V2 pinned source version against current installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # V2 was pinned to an older Python commit and cannot validate the
          # repaired V3 installer. It must reject rather than yield a false PASS.
          $wrapper = 'rg_remote_control/bootstrap_auto_edit_sam2_native_892_mask_safe_v2.ps1'
          $installer = 'rg_remote_control/bootstrap_auto_edit_sam2_native_892_mask_v1.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $wrapper -ValidateOnly -SourceFile $installer
          if ($LASTEXITCODE -eq 0) {
            throw 'Obsolete V2 unexpectedly approved a mismatched current installer'
          }
          Write-Host 'SAM2_OLD_V2_VERSION_MISMATCH_FAIL_CLOSED: PASS'
      - name: Verify SAM2 V3 fixed Windows -c safety regression offline
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $wrapper = 'rg_remote_control/bootstrap_auto_edit_sam2_native_892_mask_safe_v3.ps1'
          $installer = 'rg_remote_control/bootstrap_auto_edit_sam2_native_892_mask_v1.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $wrapper -ValidateOnly -SourceFile $installer
          if ($LASTEXITCODE -ne 0) {
            throw 'V3 wrapper rejected healthy pinned SAM2 source before installation'
          }
          $content = [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath $installer).Path)
          if ($content -match '(?im)^\s*&\s*\$isoPy\s+-I\s+-c\b') {
            throw 'Actual installer still contains unsafe Python -c execution'
          }
          $bad = $content.Replace('& $isoPy -I -u $code --env-check', '& $isoPy -I -c $probe')
          if ($bad -eq $content) { throw 'Could not create Python -c negative source fixture' }
          $fixture = Join-Path $env:TEMP 'sam2_ps51_inline_python_c_negative.ps1'
          try {
            [System.IO.File]::WriteAllText($fixture,$bad)
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $wrapper -ValidateOnly -SourceFile $fixture
            if ($LASTEXITCODE -eq 0) {
              throw 'Broken Python -c source was accepted by V3 gate'
            }
            Write-Host 'SAM2_V3_REJECTS_PYTHON_INLINE_C_BEFORE_INSTALL_PASS'
          } finally {
            Remove-Item -LiteralPath $fixture -Force -ErrorAction SilentlyContinue
          }
      - name: Regression check fixed 892 V3 Python download path and every guard
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $bootstrap='rg_remote_control/bootstrap_auto_edit_sam2_video_track_892_fullmask_safe_v3.ps1'
          $python='rg_remote_control/open_source_v1/sam2_video_track_892_full_mask_v2.py'
          $script=[System.IO.File]::ReadAllText((Resolve-Path $bootstrap).Path)
          $source=[System.IO.File]::ReadAllText((Resolve-Path $python).Path)
          $expected='rg_remote_control/open_source_v1/sam2_video_track_892_full_mask_v2.py'
          $match=[regex]::Match($script, 'https://raw\.githubusercontent\.com/RushaGoodbye/CHAT_YouTube/\$commit/(?<path>[^"]+)')
          if(-not $match.Success -or $match.Groups['path'].Value -ne $expected){
              throw 'SAM2 V3 wrong downloaded Python path - old V2 regression'
          }
          $guards=@(
            'RG_SAM2_892_REAL_VIDEO_TRACK_SHADOW_V2_FULL_MASK'
            'offload_video_to_cpu=True'
            'offload_state_to_cpu=True'
            'automatic_blur_allowed=False'
            'release_allowed=False'
            'FRAMES=13'
            'START_FRAME=360'
            'EVERY_N_FRAME=5'
            'FULL_MASK_%02d_1920x1080.png'
            'crop_follows_detected_mask_centroid=True'
            'full_resolution_binary_masks_saved=True'
          )
          if (@($guards).Count -ne 11) { throw 'Expected eleven independent invariants' }
          foreach($guard in $guards){
            if(-not $source.Contains($guard)){ throw "Pinned SAM2 V3 source missing: $guard" }
          }
          if(-not $source.Contains('RG_SAM2_892_REAL_MOTION_FULL_MASK_V2.zip')){
            throw 'SAM2 V3 incorrect ZIP output contract'
          }
          $bad=$script.Replace('sam2_video_track_892_full_mask_v2.py','sam2_video_track_892_shadow_v1.py')
          $badMatch=[regex]::Match($bad, 'https://raw\.githubusercontent\.com/RushaGoodbye/CHAT_YouTube/\$commit/(?<path>[^"]+)')
          if(-not $badMatch.Success -or $badMatch.Groups['path'].Value -eq $expected){
            throw 'Negative fixture for broken download path was not constructed correctly'
          }
          Write-Host 'SAM2_892_PINNED_PYTHON_V3_DOWNLOAD_PATH_AND_ALL_11_GUARDS_PASS'
      - name: Verify SigLIP 16-case bootstrap references exact pinned Python
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $bootstrap='rg_remote_control/bootstrap_auto_edit_siglip_sam2_892_13frame_vs_886_shadow_v1.ps1'
          $program='rg_remote_control/open_source_v1/siglip_sam2_892_13frame_vs_886_negative_shadow_v1.py'
          $ps=[System.IO.File]::ReadAllText((Resolve-Path $bootstrap).Path)
          $py=[System.IO.File]::ReadAllText((Resolve-Path $program).Path)
          if(-not $ps.Contains('/rg_remote_control/open_source_v1/siglip_sam2_892_13frame_vs_886_negative_shadow_v1.py')){
              throw 'SigLIP 16-case bootstrap would fetch the wrong script'
          }
          foreach($guard in @(
              'RG_SIGLIP_SAM2_892_THIRTEEN_VS_THREE_REAL_NEGATIVE_SHADOW_V1'
              'local_files_only=True'
              'NEGATIVES=('
              'N=13'
              '886_5 HOLD'
              'cigarette_only_blur_allowed=False'
              'automatic_blur_allowed=False'
          )){
              if(-not $py.Contains($guard)){throw ('SigLIP 16-case Python source missing: '+$guard)}
          }
          if($ps.Contains('-m pip install') -or $ps.Contains('pip install ')){
              throw 'SigLIP bootstrap attempts package installation'
          }
          Write-Host 'SIGLIP_13FRAMES_VS_886_NEGATIVES_PINNED_GUARDS_PASS'
      - name: Verify pinned OpenCV YuNet face model and shadow source boundaries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ps='rg_remote_control/bootstrap_auto_edit_yunet_mouth_892_shadow_v1.ps1'
          $py='rg_remote_control/open_source_v1/yunet_mouth_landmarks_892_shadow_v1.py'
          $bootstrap=[System.IO.File]::ReadAllText((Resolve-Path $ps).Path)
          $program=[System.IO.File]::ReadAllText((Resolve-Path $py).Path)
          foreach ($required in @(
            '8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4',
            '2b00ef5a72302804de256fccd3d773abb0dab9f5',
            'face_detection_yunet_2023mar.onnx',
            'rg_sam2_native_shadow_v1',
            'do_not_publish',
            '886_5_MICROPHONE_FALSE_POSITIVE_QUARANTINE_V1'
          )) {
            if (-not ($bootstrap.Contains($required) -or $program.Contains($required))){
              throw ('YuNet pinned source guard absent: '+$required)
            }
          }
          if ($bootstrap.Contains('pip install') -or $bootstrap.Contains('-m pip')){
            throw 'YuNet bootstrap must never install packages'
          }
          if (-not $program.Contains('mouth_from_yunet') -or
              -not $program.Contains('production_release_allowed')){
            throw 'YuNet Python diagnostic must be a no-release mouth evaluation'
          }
          Write-Host 'RG_YUNET_OFFLINE_MODEL_SHA_PIN_POWERSHELL51_SOURCE_GUARDS_PASS'
      - name: Reject original broken numeric-leading hashtable key
        shell: powershell
        run: |
          $bad = '[ordered]@{ 886_5_quarantine_unchanged=$true }'
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseInput(
            $bad,[ref]$tokens,[ref]$errorsFound
          ) | Out-Null
          if (-not $errorsFound -or $errorsFound.Count -eq 0) {
            throw 'Parser no longer rejects broken hashtable key'
          }
          Write-Host 'NUMERIC_HASH_KEY_NEGATIVE_REGRESSION_PASS'
