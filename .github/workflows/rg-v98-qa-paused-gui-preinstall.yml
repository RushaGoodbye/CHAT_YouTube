name: RG V98 QA paused GUI redirect preinstall acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-v98-qa-paused-gui-preinstall.yml']
permissions: {contents: read}
jobs:
  acceptance:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_v98_gui_qa_pause_route_patch.py
          if($LASTEXITCODE -ne 0){throw 'RGV98_QA_GUI_PREFLIGHT_FAILED'}
