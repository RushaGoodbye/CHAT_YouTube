name: RG UI progress panel inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-ui-progress-panel-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Read progress UI block and update functions
        shell: powershell
        run: |
          $root='F:\RG_AUTO_EDIT\RG Auto Edit App'
          $p=Join-Path $root 'rg_studio_ui.py'
          $lines=@(Get-Content -LiteralPath $p -Encoding UTF8)
          Write-Output ('RGUIP|FILE|'+$p+'|'+$lines.Count)
          for($i=0;$i -lt $lines.Count;$i++){
            if($lines[$i] -match 'process_chips|stage_performance|STREAM TIMELINE|STAGE PERFORMANCE|heartbeat_text|metric_elapsed|stream_timeline|progress_dial|progress_bar|GPU.*CPU|performance_chart|process_tech|progress_ring|progress_gauge'){
              Write-Output ('RGUIP|FIND|'+($i+1)+'|'+$lines[$i])
            }
          }
          $p2=Join-Path $root 'rg_studio_progress_visuals.py'
          if(Test-Path $p2){Write-Output ('RGUIP|VISUALS|'+$p2);$l=@(Get-Content $p2 -Encoding UTF8);for($i=0;$i -lt [Math]::Min(260,$l.Count);$i++){Write-Output ('RGUIP|VIS|'+($i+1)+'|'+$l[$i])}}
          Write-Output 'RGUIP|READONLY_DONE'
