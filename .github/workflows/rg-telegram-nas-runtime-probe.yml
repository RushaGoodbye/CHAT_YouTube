name: RG Telegram NAS Runtime Readonly Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rg-telegram-nas-runtime-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rg-telegram-nas-runtime-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, rg, nas]
    timeout-minutes: 3
    steps:
      - name: Check isolated runner and NAS paths without reading private files
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import platform
          import stat
          expected={
              "telegram_root":pathlib.Path("/volume1/docker/RG_TELEGRAM_NEWS_2"),
              "operator":pathlib.Path("/volume1/docker/RG_TELEGRAM_NEWS_2/operator"),
              "nas_agent":pathlib.Path("/volume1/docker/RG_NAS_MCP/ALEXPC")
          }
          result={"schema":"RG_NAS_RUNTIME_METADATA_ONLY_V1",
                  "uid":os.getuid(),"gid":os.getgid(),
                  "platform":platform.system(),
                  "secret_files_read":False,"telegram_api_calls":0,
                  "publications":0,"bot_state_changes":0,
                  "mounts":{}}
          for key,path in expected.items():
              try:
                  info=path.lstat()
                  result["mounts"][key]={
                      "exists":True,
                      "is_directory":stat.S_ISDIR(info.st_mode),
                      "symlink":stat.S_ISLNK(info.st_mode),
                      "readable":os.access(path,os.R_OK),
                      "searchable":os.access(path,os.X_OK)}
              except OSError:
                  result["mounts"][key]={"exists":False}
          print(json.dumps(result,sort_keys=True))
          assert result["platform"]=="Linux"
          assert result["uid"] != 0,"ROOT_RUNNER_FORBIDDEN"
          assert result["mounts"]["telegram_root"]["exists"],"TELEGRAM_ROOT_MISSING"
          assert result["mounts"]["operator"]["exists"],"OPERATOR_MISSING"
          assert not result["mounts"]["operator"]["symlink"],"OPERATOR_SYMLINK_FORBIDDEN"
          assert result["secret_files_read"] is False
          print("NAS_RUNTIME_READONLY_METADATA_PASS")
          print("NAS_RUNTIME_OPERATOR_ACCESS_VERIFIED="+str(
              result["mounts"]["operator"]["readable"] and
              result["mounts"]["operator"]["searchable"]).lower())
          PY
