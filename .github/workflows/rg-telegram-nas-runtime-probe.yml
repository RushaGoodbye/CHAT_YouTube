name: RG Telegram NAS Runtime Readonly Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rg-telegram-nas-runtime-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, rg, nas]
    timeout-minutes: 3
    steps:
      - name: Check isolated runner and NAS paths without reading private files
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import platform
          import stat
          expected={
              "telegram_root":pathlib.Path("/volume1/docker/RG_TELEGRAM_NEWS_2"),
              "operator":pathlib.Path("/volume1/docker/RG_TELEGRAM_NEWS_2/operator"),
              "nas_agent":pathlib.Path("/volume1/docker/RG_NAS_MCP/ALEXPC")
          }
          result={"schema":"RG_NAS_RUNTIME_METADATA_ONLY_V1",
                  "uid":os.getuid(),"gid":os.getgid(),
                  "platform":platform.system(),
                  "secret_files_read":False,"telegram_api_calls":0,
                  "publications":0,"bot_state_changes":0,
                  "mounts":{}}
          for key,path in expected.items():
              try:
                  info=path.lstat()
                  result["mounts"][key]={
                      "exists":True,
                      "is_directory":stat.S_ISDIR(info.st_mode),
                      "symlink":stat.S_ISLNK(info.st_mode),
                      "readable":os.access(path,os.R_OK),
                      "searchable":os.access(path,os.X_OK)}
              except OSError:
                  result["mounts"][key]={"exists":False}
          print(json.dumps(result,sort_keys=True))
          assert result["platform"]=="Linux"
          assert result["uid"] != 0,"ROOT_RUNNER_FORBIDDEN"
          assert result["mounts"]["telegram_root"]["exists"],"TELEGRAM_ROOT_MISSING"
          assert result["mounts"]["operator"]["exists"],"OPERATOR_MISSING"
          assert not result["mounts"]["operator"]["symlink"],"OPERATOR_SYMLINK_FORBIDDEN"
          assert result["secret_files_read"] is False
          print("NAS_RUNTIME_READONLY_METADATA_PASS")
          print("NAS_RUNTIME_OPERATOR_ACCESS_VERIFIED="+str(
              result["mounts"]["operator"]["readable"] and
              result["mounts"]["operator"]["searchable"]).lower())
          PY

      - name: Validate non-secret health export visibility
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,stat,time
          from pathlib import Path
          p=Path('/volume1/docker/RG_TELEGRAM_NEWS_EXPORT/rg_news_health_public.json')
          if not p.exists():
              print('RG_NEWS_EXPORT_STATUS=NOT_PROVISIONED')
              print('RG_NEWS_EXPORT_FRESH=false')
              raise SystemExit(0)
          flags=os.O_RDONLY|getattr(os,'O_NOFOLLOW',0)|getattr(os,'O_NONBLOCK',0)
          try:
              fd=os.open(str(p),flags)
              with os.fdopen(fd,'rb') as f:
                  st=os.fstat(f.fileno())
                  if not stat.S_ISREG(st.st_mode) or st.st_size>16384:raise ValueError('UNSAFE_FILE')
                  doc=json.loads(f.read(16385))
              assert isinstance(doc,dict)
              expected={'schema','generated_at_unix','contains_secrets','private_messages_read','telegram_api_calls','publications','source','locations'}
              assert set(doc)==expected
              assert doc['schema']=='RG_NEWS_NAS_SANITIZED_EXPORT_V1'
              assert doc['contains_secrets'] is False
              assert doc['private_messages_read']==0 and doc['telegram_api_calls']==0
              assert doc['publications']==0
              assert doc['source']=='LOCAL_NAS_METADATA_ONLY'
              ts=doc['generated_at_unix']
              assert type(ts) is int
              age=int(time.time())-ts
              assert -60<=age<=1200
              print('RG_NEWS_EXPORT_STATUS=FRESH_METADATA_ONLY')
              print('RG_NEWS_EXPORT_FRESH=true')
              print('RG_NEWS_EXPORT_BOT_HEALTH_PROVEN=false')
          except Exception:
              print('RG_NEWS_EXPORT_STATUS=INVALID_OR_STALE_SAFE_STOP')
              print('RG_NEWS_EXPORT_FRESH=false')
              raise SystemExit(2)
          PY
