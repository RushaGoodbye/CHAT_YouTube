name: RG Auto Edit Control

on:
  push:
    branches:
      - main
    paths:
      - "rg_remote_control/auto_edit_task.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rg-auto-edit-control
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Auto Edit contour
        shell: powershell
        run: |
          $task = Get-Content "rg_remote_control/auto_edit_task.json" -Raw | ConvertFrom-Json
          if ($task.target -ne "alexpc") { throw "Task target must be alexpc" }
          if ($task.contour -ne "auto_edit") { throw "Task contour must be auto_edit" }
          if ($task.action -notin @("auto_edit_mcp_call","enable_auto_edit_mcp_bridge","probe_auto_edit_mcp_bridge","stage_mcp_to_docker_root","probe_docker_root_mcp_deploy","wait_docker_root_mcp_deploy","launch_auto_edit_studio","restart_auto_edit_studio_ui","inspect_auto_edit_active_process_tree","inspect_auto_edit_live_code","inspect_auto_edit_pack100_targets","inspect_auto_edit_update_format","inspect_auto_edit_update_worker","build_auto_edit_pack120_update","build_auto_edit_pack130_update","build_auto_edit_pack140_update","build_auto_edit_pack150_update","apply_auto_edit_pack150_ui_hotfix","probe_auto_edit_studio_startup","inspect_auto_edit_ui_class","inspect_auto_edit_visual_targets","inspect_auto_edit_montage_visual_block","inspect_auto_edit_progress_pipeline","inspect_auto_edit_progress_functions","inspect_auto_edit_run_log","build_auto_edit_pack170_update","build_auto_edit_pack200_update","build_auto_edit_pack300_update","build_auto_edit_pack310_update","build_auto_edit_pack311_update","build_auto_edit_pack312_update","build_auto_edit_pack400_update","build_auto_edit_pack500_update","build_auto_edit_pack160_update","apply_auto_edit_pack100","verify_auto_edit_pack100","audit_auto_edit_pack100_features","inspect_auto_edit_pack100_missing_targets","apply_auto_edit_pack100_ui_completion","finalize_auto_edit_pack100","inspect_auto_edit_runtime_state","locate_auto_edit_missing_screens","apply_auto_edit_completeness_hotfix","apply_auto_edit_preview_sort_hotfix","apply_auto_edit_final_compilation_retirement_hotfix","apply_auto_edit_topaz_all_selected_hotfix","apply_auto_edit_clean_guest_portraits_hotfix","rebuild_auto_edit_clean_guest_candidates","apply_auto_edit_strict_guest_face_v2","apply_auto_edit_thumbnail_v6_visibility_hotfix","verify_auto_edit_preview_hotfix_state","inspect_auto_edit_thumbnail_final_render","inspect_auto_edit_final_compilation_code","inspect_auto_edit_topaz_flow","inspect_auto_edit_thumbnail_candidate_writers","inspect_auto_edit_thumbnail_mix_source","inspect_auto_edit_thumbnail_mix_main","inspect_auto_edit_latest_thumbnail_state","inspect_auto_edit_thumbnail_paths","inspect_auto_edit_backend_path_identity","inspect_auto_edit_topaz_automation_and_prep","inspect_auto_edit_chatgpt_collage_flow","inspect_auto_edit_chatgpt_browser_automation","inspect_auto_edit_execution_functions","start_auto_edit_recovery_queue","inspect_auto_edit_recovery_queue","inspect_auto_edit_stream_result","inspect_auto_edit_901_audio_outputs","inspect_auto_edit_audio_generator_code","inspect_auto_edit_premiere_audio_direct_branch","apply_auto_edit_direct_audio_unity_generator_fix","apply_auto_edit_premiere_audio_unity_hotfix","inspect_auto_edit_901_audio_schema_compact","inspect_auto_edit_901_audio_gaps_and_censor","inspect_auto_edit_901_delivery_vs_source","inspect_auto_edit_901_linkage","inspect_auto_edit_multi_resume_span","apply_auto_edit_resume_protection_hotfix","apply_auto_edit_run_state_colors_hotfix","inspect_auto_edit_901_diagnostic","inspect_auto_edit_clock_boundary_code","inspect_auto_edit_one_button_boundary_gate","inspect_auto_edit_identity_refiner","inspect_auto_edit_901_temp_artifacts","search_auto_edit_901_anchor_artifacts","inspect_auto_edit_901_anchor_sequence","apply_auto_edit_monotonic_anchor_hotfix","apply_auto_edit_identity_local_scan_cap_hotfix","install_rg_resilience","probe_rg_resilience","repair_rg_resilience","inspect_rg_resilience_runtime","finalize_rg_resilience","bootstrap_youtube_runtime","finalize_control_settings")) { throw "Action is not allowed in Auto Edit contour" }
          if ($task.action -eq "auto_edit_mcp_call" -and -not ($task.args.tool -like "auto_edit_*")) { throw "Only auto_edit_* RG NAS MCP tools are allowed" }
          Write-Host "AUTO_EDIT_TASK_VALID"
      - name: Run Auto Edit contour task
        shell: powershell
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $task = Get-Content "rg_remote_control/auto_edit_task.json" -Raw | ConvertFrom-Json
          if ($task.action -in @("install_rg_resilience","probe_rg_resilience","repair_rg_resilience","inspect_rg_resilience_runtime","finalize_rg_resilience","bootstrap_youtube_runtime","finalize_control_settings")) {
            python rg_remote_control/resilience_tool.py rg_remote_control/auto_edit_task.json
          } else {
            python rg_remote_control/task_runner.py rg_remote_control/auto_edit_task.json
          }
