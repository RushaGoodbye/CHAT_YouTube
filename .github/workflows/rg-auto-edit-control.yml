name: RG Auto Edit Control

on:
  push:
    branches:
      - main
    paths:
      - "rg_remote_control/auto_edit_task.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rg-auto-edit-control
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Auto Edit contour
        shell: powershell
        run: |
          $task = Get-Content "rg_remote_control/auto_edit_task.json" -Raw | ConvertFrom-Json
          if ($task.target -ne "alexpc") { throw "Task target must be alexpc" }
          if ($task.contour -ne "auto_edit") { throw "Task contour must be auto_edit" }
          if ($task.action -notin @("auto_edit_mcp_call","enable_auto_edit_mcp_bridge","probe_auto_edit_mcp_bridge","stage_mcp_to_docker_root","probe_docker_root_mcp_deploy","wait_docker_root_mcp_deploy","launch_auto_edit_studio","restart_auto_edit_studio_ui","inspect_auto_edit_active_process_tree","inspect_auto_edit_console_and_disk_io","switch_github_runner_hidden_mode","inspect_auto_edit_live_code","inspect_auto_edit_pack100_targets","inspect_auto_edit_update_format","inspect_auto_edit_update_worker","inspect_auto_edit_update_install_state","inspect_auto_edit_updater_state","inspect_auto_edit_ui_freeze_runtime","inspect_auto_edit_startup_hotspots","apply_auto_edit_ui_responsiveness_hotfix","apply_auto_edit_boot_version_sync_hotfix","inspect_auto_edit_powershell_usage","inspect_auto_edit_windows_service_targets","inspect_auto_edit_files_generic","inspect_auto_edit_cigarette_blur_targets","prepare_auto_edit_cigarette_detector_v1","apply_auto_edit_cigarette_blur_v1","locate_auto_edit_901_xmls","build_auto_edit_pack120_update","build_auto_edit_pack130_update","build_auto_edit_pack140_update","build_auto_edit_pack150_update","apply_auto_edit_pack150_ui_hotfix","probe_auto_edit_studio_startup","inspect_auto_edit_ui_class","inspect_auto_edit_visual_targets","inspect_auto_edit_montage_visual_block","inspect_auto_edit_progress_pipeline","inspect_auto_edit_progress_functions","inspect_auto_edit_run_log","build_auto_edit_pack170_update","build_auto_edit_pack200_update","build_auto_edit_pack300_update","build_auto_edit_pack310_update","build_auto_edit_pack311_update","build_auto_edit_pack312_update","build_auto_edit_pack400_update","build_auto_edit_pack500_update","build_auto_edit_pack25_stability_ux_update","build_auto_edit_production40_update","build_auto_edit_master60_update","install_auto_edit_master60_r1_direct","build_auto_edit_pack160_update","apply_auto_edit_pack100","verify_auto_edit_pack100","audit_auto_edit_pack100_features","inspect_auto_edit_pack100_missing_targets","apply_auto_edit_pack100_ui_completion","finalize_auto_edit_pack100","inspect_auto_edit_runtime_state","locate_auto_edit_missing_screens","apply_auto_edit_completeness_hotfix","apply_auto_edit_preview_sort_hotfix","apply_auto_edit_final_compilation_retirement_hotfix","apply_auto_edit_topaz_all_selected_hotfix","apply_auto_edit_clean_guest_portraits_hotfix","rebuild_auto_edit_clean_guest_candidates","apply_auto_edit_strict_guest_face_v2","apply_auto_edit_thumbnail_v6_visibility_hotfix","verify_auto_edit_preview_hotfix_state","inspect_auto_edit_thumbnail_final_render","inspect_auto_edit_final_compilation_code","inspect_auto_edit_topaz_flow","inspect_auto_edit_thumbnail_candidate_writers","inspect_auto_edit_thumbnail_mix_source","inspect_auto_edit_thumbnail_mix_main","inspect_auto_edit_latest_thumbnail_state","inspect_auto_edit_thumbnail_paths","inspect_auto_edit_backend_path_identity","inspect_auto_edit_topaz_automation_and_prep","inspect_auto_edit_chatgpt_collage_flow","inspect_auto_edit_chatgpt_browser_automation","inspect_auto_edit_execution_functions","start_auto_edit_recovery_queue","inspect_auto_edit_recovery_queue","inspect_auto_edit_stream_result","inspect_auto_edit_901_audio_outputs","inspect_auto_edit_audio_generator_code","inspect_auto_edit_premiere_audio_direct_branch","apply_auto_edit_direct_audio_unity_generator_fix","apply_auto_edit_premiere_audio_unity_hotfix","inspect_auto_edit_901_audio_schema_compact","inspect_auto_edit_901_audio_gaps_and_censor","inspect_auto_edit_901_delivery_vs_source","inspect_auto_edit_901_linkage","inspect_auto_edit_901_link_samples","apply_auto_edit_censor_avlink_hotfix","inspect_auto_edit_censor_pipeline_backup_span","inspect_auto_edit_901_muted_xml_sample","apply_auto_edit_visible_censor_fix","inspect_auto_edit_901_censor_group_spans","inspect_auto_edit_keyframe_support","inspect_auto_edit_profanity_module_full","inspect_auto_edit_901_uncensored_bases","apply_auto_edit_keyframe_censor_v2","inspect_auto_edit_901_all_final_qa","inspect_auto_edit_901_2_ripple_links","apply_auto_edit_all_v1_linkage_fix","apply_auto_edit_audio_integrity_guard","apply_auto_edit_validator_avlink_v2","apply_auto_edit_service_process_stream_fix","apply_auto_edit_updater_detach_fix_v2","apply_auto_edit_updater_supervisor_v3","apply_auto_edit_windows_service_layer_v1","freeze_auto_edit_stable_020180","prepare_auto_edit_020201_candidate_snapshot","finalize_auto_edit_020201_stable","sync_auto_edit_020201_stable_metadata","run_auto_edit_updater_smoke_020201","run_auto_edit_preview_886_smoke","run_auto_edit_886_short_smoke","inspect_auto_edit_multi_resume_span","apply_auto_edit_resume_protection_hotfix","apply_auto_edit_run_state_colors_hotfix","inspect_auto_edit_901_diagnostic","inspect_auto_edit_clock_boundary_code","inspect_auto_edit_one_button_boundary_gate","inspect_auto_edit_identity_refiner","inspect_auto_edit_901_temp_artifacts","search_auto_edit_901_anchor_artifacts","inspect_auto_edit_901_anchor_sequence","apply_auto_edit_monotonic_anchor_hotfix","apply_auto_edit_identity_local_scan_cap_hotfix","install_rg_resilience","probe_rg_resilience","repair_rg_resilience","inspect_rg_resilience_runtime","finalize_rg_resilience","bootstrap_youtube_runtime","finalize_control_settings","apply_auto_edit_used_render_v1","inspect_auto_edit_overnight_preflight_v1","qa_partial_manifest_fix_v1","qa_verify_903_v1","inspect_auto_edit_foss_compat_v1","inspect_auto_edit_face_rescue_903_v1","inspect_auto_edit_identity_cache_903_v1","inspect_auto_edit_partial_ui_status_v1","apply_auto_edit_partial_review_ui_v1","reconcile_auto_edit_903_queue_review_v1","apply_auto_edit_batch_891_892_qa_fix_v1","reconcile_auto_edit_boundary_review_901_905_v1","inspect_auto_edit_batch_boundary_shadow_v1","inspect_auto_edit_guest_handoff_shadow_v1","apply_auto_edit_selective_retry_guard_v1","inspect_auto_edit_903_guest_reference_v1","retry_auto_edit_903_2_proven_guest_v1","inspect_auto_edit_operational_acceptance_v1","apply_auto_edit_903_queue_5of6_v1","inspect_auto_edit_907_visual_proof_v1","inspect_auto_edit_907_guest_clock_wide_v1","inspect_auto_edit_live_studio_gui_v1","inspect_auto_edit_907_precise_anchor_v1")) { throw "Action is not allowed in Auto Edit contour" }
          if ($task.action -eq "auto_edit_mcp_call" -and -not ($task.args.tool -like "auto_edit_*")) { throw "Only auto_edit_* RG NAS MCP tools are allowed" }
          Write-Host "AUTO_EDIT_TASK_VALID"
      - name: Run Auto Edit contour task
        shell: powershell
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $task = Get-Content "rg_remote_control/auto_edit_task.json" -Raw | ConvertFrom-Json
          if ($task.action -eq "inspect_auto_edit_907_precise_anchor_v1") {
            & "F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe" -u rg_remote_control/auto_edit_features/precise_guest_anchor_907_v1.py
            if ($LASTEXITCODE -ne 0) { throw "907 guest + exact frame double-modal check failed" }
          } elseif ($task.action -eq "inspect_auto_edit_live_studio_gui_v1") {
            & "F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe" -u rg_remote_control/auto_edit_features/studio_live_gui_smoke_v1.py
            if ($LASTEXITCODE -ne 0) { throw "Studio GUI visibility/responsiveness inspection failed" }
          } elseif ($task.action -eq "inspect_auto_edit_907_guest_clock_wide_v1") {
            & "F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe" -u rg_remote_control/auto_edit_features/guest_clock_wide_907_v1.py
            if ($LASTEXITCODE -ne 0) { throw "907 two-window guest identity proof incomplete; original 907 files preserved" }
          } elseif ($task.action -eq "inspect_auto_edit_907_visual_proof_v1") {
            & "F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe" -u rg_remote_control/auto_edit_features/visual_proof_907_v1.py
            if ($LASTEXITCODE -ne 0) { throw "907 visual proof failed safely; no media written" }
          } elseif ($task.action -eq "apply_auto_edit_903_queue_5of6_v1") {
            if ($task.args.apply -eq $true) {
              python rg_remote_control/auto_edit_features/reconcile_903_5of6_queue_v1.py --apply
            } else {
              python rg_remote_control/auto_edit_features/reconcile_903_5of6_queue_v1.py
            }
            if ($LASTEXITCODE -ne 0) { throw "903 5/6 UI queue reconciliation denied" }
          } elseif ($task.action -eq "inspect_auto_edit_operational_acceptance_v1") {
            & "F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe" -u rg_remote_control/auto_edit_features/studio_operational_acceptance_v1.py
            if ($LASTEXITCODE -ne 0) { throw "Live Studio source and XML structural acceptance failed" }
          } elseif ($task.action -eq "retry_auto_edit_903_2_proven_guest_v1") {
            if ($task.args.stream -ne "903" -or $task.args.dialogue -ne 2 -or $task.args.preserve_others -ne $true) {
              throw "Unexpected targeted replay arguments"
            }
            & "F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe" -u rg_remote_control/auto_edit_features/replay_9032_proven_guest_v1.py
            if ($LASTEXITCODE -ne 0) { throw "903-2 single-dialogue replay failed; original manifest rollback requested" }
          } elseif ($task.action -eq "inspect_auto_edit_903_guest_reference_v1") {
            & "F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe" -u rg_remote_control/auto_edit_features/guest_reference_903_evidence_v1.py
            if ($LASTEXITCODE -ne 0) { throw "903 source guest reference evidence probe failed" }
          } elseif ($task.action -eq "apply_auto_edit_selective_retry_guard_v1") {
            if ($task.args.apply -eq $true) {
              python rg_remote_control/auto_edit_features/selective_retry_preserve_manifest_v1.py --apply
            } else {
              python rg_remote_control/auto_edit_features/selective_retry_preserve_manifest_v1.py
            }
            if ($LASTEXITCODE -ne 0) { throw "Selective retry source patch refused" }
          } elseif ($task.action -eq "inspect_auto_edit_guest_handoff_shadow_v1") {
            & "F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe" -u rg_remote_control/auto_edit_features/guest_handoff_shadow_batch_v1.py
            if ($LASTEXITCODE -ne 0) { throw "Guest handoff SFace+VAD shadow failed" }
          } elseif ($task.action -eq "inspect_auto_edit_batch_boundary_shadow_v1") {
            python rg_remote_control/auto_edit_features/batch_boundary_shadow_901_903_905_v1.py
            if ($LASTEXITCODE -ne 0) { throw "Batch boundary shadow inspection failed" }
          } elseif ($task.action -eq "reconcile_auto_edit_boundary_review_901_905_v1") {
            if ($task.args.apply -eq $true) {
              python rg_remote_control/auto_edit_features/reconcile_boundary_review_901_905_v1.py --apply
            } else {
              python rg_remote_control/auto_edit_features/reconcile_boundary_review_901_905_v1.py
            }
            if ($LASTEXITCODE -ne 0) { throw "901/905 boundary review queue reconciliation failed" }
          } elseif ($task.action -eq "apply_auto_edit_batch_891_892_qa_fix_v1") {
            if ($task.args.apply -eq $true) {
              python rg_remote_control/auto_edit_features/batch_891_892_qa_fix_v1.py --apply
            } else {
              python rg_remote_control/auto_edit_features/batch_891_892_qa_fix_v1.py
            }
            if ($LASTEXITCODE -ne 0) { throw "Batch 891/892 manifest QA fix failed" }
          } elseif ($task.action -eq "reconcile_auto_edit_903_queue_review_v1") {
            if ($task.args.apply -eq $true) {
              python rg_remote_control/auto_edit_features/reconcile_903_queue_review_v1.py --apply
            } else {
              python rg_remote_control/auto_edit_features/reconcile_903_queue_review_v1.py
            }
            if ($LASTEXITCODE -ne 0) { throw "903 UI review reconciliation failed" }
          } elseif ($task.action -eq "apply_auto_edit_partial_review_ui_v1") {
            if ($task.args.apply -eq $true) {
              python rg_remote_control/auto_edit_features/partial_review_ui_fix_v1.py --apply
            } else {
              python rg_remote_control/auto_edit_features/partial_review_ui_fix_v1.py
            }
            if ($LASTEXITCODE -ne 0) { throw "Partial Review UI hotfix validation failed" }
          } elseif ($task.action -eq "inspect_auto_edit_partial_ui_status_v1") {
            python rg_remote_control/auto_edit_features/partial_ui_status_audit_v1.py
            if ($LASTEXITCODE -ne 0) { throw "Read-only UI status source inspection failed" }
          } elseif ($task.action -eq "inspect_auto_edit_identity_cache_903_v1") {
            & "F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe" -u rg_remote_control/auto_edit_features/identity_cache_shadow_903_v1.py
            if ($LASTEXITCODE -ne 0) { throw "Identity cache read-only evidence failed" }
          } elseif ($task.action -eq "inspect_auto_edit_face_rescue_903_v1") {
            & "F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe" -u rg_remote_control/auto_edit_features/face_rescue_shadow_903_v1.py
            if ($LASTEXITCODE -ne 0) { throw "Shadow face rescue diagnostic failed" }
          } elseif ($task.action -eq "inspect_auto_edit_foss_compat_v1") {
            python rg_remote_control/auto_edit_features/foss_compat_audit_v1.py
            if ($LASTEXITCODE -ne 0) { throw "Auto Edit FOSS audit failed" }
          } elseif ($task.action -eq "qa_verify_903_v1") {
            if ($task.args.apply -eq $true) {
              python rg_remote_control/auto_edit_features/qa_verify_903_v1.py --apply
            } else {
              python rg_remote_control/auto_edit_features/qa_verify_903_v1.py
            }
            if ($LASTEXITCODE -ne 0) { throw "QA 903-only verification failed" }
          } elseif ($task.action -eq "qa_partial_manifest_fix_v1") {
            if ($task.args.apply -eq $true) {
              python rg_remote_control/auto_edit_features/qa_partial_manifest_fix_v1.py --apply
            } else {
              python rg_remote_control/auto_edit_features/qa_partial_manifest_fix_v1.py
            }
            if ($LASTEXITCODE -ne 0) { throw "QA partial manifest fix rejected" }
          } elseif ($task.action -eq "inspect_auto_edit_overnight_preflight_v1") {
            python rg_remote_control/auto_edit_features/overnight_preflight_v1.py rg_remote_control/auto_edit_task.json
            if ($LASTEXITCODE -ne 0) { throw "Overnight preflight execution failed" }
          } elseif ($task.action -eq "apply_auto_edit_used_render_v1" -and $task.args.backfill -eq $true) {
            if ($task.args.apply -eq $true) {
              python rg_remote_control/auto_edit_features/backfill_known_final_v1.py --apply
            } else {
              python rg_remote_control/auto_edit_features/backfill_known_final_v1.py
            }
            if ($LASTEXITCODE -ne 0) { throw "Backfill rejected by media safety checks" }
          } elseif ($task.action -eq "apply_auto_edit_used_render_v1") {
            python rg_remote_control/auto_edit_features/test_used_render_v1.py
            if ($LASTEXITCODE -ne 0) { throw "Usage registry regression tests failed" }
            if ($task.args.apply -eq $true) {
              python rg_remote_control/auto_edit_features/install_used_render_v1.py --apply
            } else {
              python rg_remote_control/auto_edit_features/install_used_render_v1.py
            }
            if ($LASTEXITCODE -ne 0) { throw "Auto Edit usage/progress patch failed" }
          } elseif ($task.action -in @("install_rg_resilience","probe_rg_resilience","repair_rg_resilience","inspect_rg_resilience_runtime","finalize_rg_resilience","bootstrap_youtube_runtime","finalize_control_settings")) {
            python rg_remote_control/resilience_tool.py rg_remote_control/auto_edit_task.json
          } else {
            python rg_remote_control/task_runner.py rg_remote_control/auto_edit_task.json
          }
