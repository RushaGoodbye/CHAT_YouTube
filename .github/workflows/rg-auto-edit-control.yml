name: RG Auto Edit Control

on:
  push:
    branches:
      - main
    paths:
      - "rg_remote_control/auto_edit_task.json"
      - ".github/workflows/rg-auto-edit-control.yml"
      - "rg_remote_control/nas/RG_NAS_MCP_AUTO_EDIT_CALL.py"
      - "rg_remote_control/task_runner.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rg-auto-edit-control
  cancel-in-progress: true

jobs:
  run:
    runs-on: [self-hosted, rg, alexpc, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Auto Edit contour
        shell: powershell
        run: |
          $task = Get-Content "rg_remote_control/auto_edit_task.json" -Raw | ConvertFrom-Json
          if ($task.target -ne "alexpc") { throw "Task target must be alexpc" }
          if ($task.contour -ne "auto_edit") { throw "Task contour must be auto_edit" }
          if ($task.action -notin @("auto_edit_mcp_call","enable_auto_edit_mcp_bridge","probe_auto_edit_mcp_bridge","stage_mcp_to_docker_root","probe_docker_root_mcp_deploy","wait_docker_root_mcp_deploy","launch_auto_edit_studio")) { throw "Action is not allowed in Auto Edit contour" }
          if ($task.action -eq "auto_edit_mcp_call" -and -not ($task.args.tool -like "auto_edit_*")) { throw "Only auto_edit_* RG NAS MCP tools are allowed" }
          Write-Host "AUTO_EDIT_TASK_VALID"
      - name: Run Auto Edit contour task
        shell: powershell
        run: python rg_remote_control/task_runner.py rg_remote_control/auto_edit_task.json
