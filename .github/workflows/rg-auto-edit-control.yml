name: RG Auto Edit Control

on:
  push:
    branches:
      - main
    paths:
      - "rg_remote_control/auto_edit_task.json"
      - ".github/workflows/rg-auto-edit-control.yml"
      - "rg_remote_control/nas/RG_NAS_MCP_AUTO_EDIT_CALL.py"
      - "rg_remote_control/task_runner.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rg-auto-edit-control
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, rg, alexpc, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Auto Edit contour
        shell: powershell
        run: |
          python - <<'PY'
          import json
          task=json.load(open("rg_remote_control/auto_edit_task.json",encoding="utf-8"))
          if task.get("target") != "alexpc":
              raise SystemExit("Task target must be alexpc")
          if task.get("contour") != "auto_edit":
              raise SystemExit("Task contour must be auto_edit")
          if task.get("action") not in {"auto_edit_mcp_call"}:
              raise SystemExit("Action is not allowed in Auto Edit contour")
          args=task.get("args") or {}
          tool=str(args.get("tool") or "")
          if not tool.startswith("auto_edit_"):
              raise SystemExit("Only auto_edit_* RG NAS MCP tools are allowed")
          if not isinstance(args.get("tool_args") or {}, dict):
              raise SystemExit("tool_args must be an object")
          print("AUTO_EDIT_TASK_VALID")
          PY
      - name: Run Auto Edit contour task
        shell: bash
        run: python rg_remote_control/task_runner.py rg_remote_control/auto_edit_task.json
