name: RG popup blur lossless A/B benchmark
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-popup-lossless-ab-test.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_fast_popup_gblur_benchmark_v1.py
          if($LASTEXITCODE -ne 0){throw 'FRAME_EXACT_AB_BENCHMARK_FAILED'}
