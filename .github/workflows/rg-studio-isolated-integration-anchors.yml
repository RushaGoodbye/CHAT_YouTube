name: RG Studio isolated integration anchors 20261108
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-studio-isolated-integration-anchors.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Read UI constructor and periodic status hooks only
        shell: powershell
        run: |
          $p='F:\RG_AUTO_EDIT\RG Auto Edit App\rg_studio_ui.py'
          $lines=@(Get-Content -LiteralPath $p -Encoding UTF8)
          foreach($r in @(@(1,160),@(215,355),@(395,485),@(2890,2965))){
            Write-Output ('RGANCHOR|RANGE|'+$r[0]+'|'+$r[1])
            for($i=$r[0]-1;$i -lt [Math]::Min($lines.Length,$r[1]);$i++){Write-Output ('RGANCHOR|'+($i+1)+'|'+$lines[$i])}
          }
