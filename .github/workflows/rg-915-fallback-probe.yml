name: RG 915 safe embedded fallback probe only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-915-fallback-probe.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    steps:
      - shell: pwsh
        run: |
          $base='\\AlexLosServer\Work\WORK\RUSHA GOODBYE\Раша GOODBYE\ГОТОВО\ЗАПИСИ СТРИМОВ\RushaGoodbye - Live'
          $exe='F:\RG_AUTO_EDIT\RG Auto Edit Runtime\ffmpeg\bin\ffprobe.exe'
          if(!(Test-Path $exe)){throw 'MISSING_FFPROBE'}
          foreach($p in @("$base\RushaGoodbye - Live\915.mp4","$base\sound\915-1.mp3","$base\sound\915-2.mp3")){
            Write-Output ('RG915PROBE|PATH|'+$p+'|EXISTS='+(Test-Path $p))
            if(Test-Path $p){$x=& $exe -v error -show_entries format=duration:stream=codec_type,duration,start_time -of json $p;$o=$x|ConvertFrom-Json;Write-Output ('RG915PROBE|DURATION|'+[IO.Path]::GetFileName($p)+'|'+$o.format.duration);foreach($s in @($o.streams)){Write-Output ('RG915PROBE|STREAM|'+[IO.Path]::GetFileName($p)+'|'+$s.codec_type+'|'+$s.start_time+'|'+$s.duration)}}
          }
