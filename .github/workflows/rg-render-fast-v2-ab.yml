name: RG render fast V2 full-frame bitexact A/B
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-render-fast-v2-ab.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_render_fast_v2_pixel_test.py
          if($LASTEXITCODE -ne 0){throw 'RENDER_FAST_V2_PIXEL_NOT_IDENTICAL'}
