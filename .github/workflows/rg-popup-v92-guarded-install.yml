name: RG Popup V92 install conservative real-frame update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-popup-v92-guarded-install.yml']
permissions: {contents: read}
jobs:
  install:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          $ErrorActionPreference='Stop'
          $py='F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe'
          & $py -X utf8 rg_repair_20261110/rg_popup_v92_labeled_regression_patch_v2.py --install
          if($LASTEXITCODE -ne 0){throw 'RG_POPUP_V92_INSTALL_SAFE_STOP'}
          & $py -m py_compile 'F:\RG_AUTO_EDIT\RG Auto Edit App\rg_fullstream_detectors_v2.py' 'F:\RG_AUTO_EDIT\RG Auto Edit App\rg_fullstream_batch_v53.py'
          if($LASTEXITCODE -ne 0){throw 'RG_POPUP_V92_COMPILE_FAILED'}
          Write-Output 'RGPOPV92|POST_INSTALL_COMPILE|PASS'
