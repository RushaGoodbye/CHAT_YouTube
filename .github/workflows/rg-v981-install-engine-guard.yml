name: RG V981 install strict engine integrity pin repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-v981-install-engine-guard.yml']
permissions: {contents: read}
jobs:
  install:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_fix_stale_engine_pin_v981_v2.py --install
          if($LASTEXITCODE -ne 0){throw 'RGV981_ENGINE_PIN_INSTALL_FAILED'}
