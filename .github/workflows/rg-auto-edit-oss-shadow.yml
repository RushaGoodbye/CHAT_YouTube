name: RG Auto Edit OSS Shadow QA

on:
  push:
    branches: [main]
    paths:
      - 'rg_remote_control/open_source_v1/**'
      - 'rg_remote_control/quarantine_8865_mic_false_blur_v1.py'
      - 'rg_remote_control/bootstrap_auto_edit_quarantine_8865_mic_v1.ps1'
      - '.github/workflows/rg-auto-edit-oss-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile staged adapters
        run: |
          python -m py_compile rg_remote_control/open_source_v1/oss_audit.py
          python -m py_compile rg_remote_control/open_source_v1/scene_suggest.py
          python -m py_compile rg_remote_control/open_source_v1/health_shadow.py
      - name: Unit regression checks
        run: |
          python -m unittest discover -s rg_remote_control/open_source_v1/tests -v
      - name: Norfair 2.3 isolated synthetic safety test
        run: |
          python -m pip install --disable-pip-version-check 'norfair==2.3.0' 'opencv-python-headless==4.11.0.86'
          python -m py_compile rg_remote_control/open_source_v1/norfair_saved_hits_8865.py
          python -m py_compile rg_remote_control/open_source_v1/norfair_synthetic_smoke.py
          python -m py_compile rg_remote_control/open_source_v1/norfair_real_motion_8865_v1.py
          python -m py_compile rg_remote_control/open_source_v1/norfair_real_motion_synthetic.py
          python rg_remote_control/open_source_v1/norfair_synthetic_smoke.py
          python rg_remote_control/open_source_v1/norfair_real_motion_synthetic.py
          python -m py_compile rg_remote_control/open_source_v1/norfair_motion_challenge_v1.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'rg_remote_control/open_source_v1')
          from norfair_motion_challenge_v1 import analyze
          names = ('slow_motion','fast_motion','intermittent_occlusion','lookalike_distractor')
          rows = [analyze(name) for name in names]
          assert [r['case'] for r in rows] == list(names)
          assert all(r['frames']==24 for r in rows)
          assert all(r['correct_position_frames']+r['missed_visible_frames']+r['incorrect_visible_matches']==r['truth_visible_frames'] for r in rows)
          assert all(r['false_matches_when_absent']>=0 for r in rows)
          print('RG_NORFAIR_GROUND_TRUTH_CHALLENGE_CONTRACT=PASS')
          PY
      - name: Norfair fail-closed safety gate V2
        run: |
          python -m py_compile rg_remote_control/open_source_v1/norfair_motion_safety_gate_v2.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'rg_remote_control/open_source_v1')
          from norfair_motion_safety_gate_v2 import run_report,self_check
          report=run_report()
          assert self_check(report)
          assert report["zero_known_false_positives"]
          assert not report["all_cases_automatic_release"]
          assert not report["production_approved"]
          print("RG_NORFAIR_MOTION_FAIL_CLOSED_V2=PASS")
          PY
      - name: Real stream review sheet source-immutability regression
        run: |
          python -m py_compile rg_remote_control/open_source_v1/real_cigarette_review_8865_v1.py
          python -m py_compile rg_remote_control/open_source_v1/real_cigarette_review_synthetic.py
          python rg_remote_control/open_source_v1/real_cigarette_review_synthetic.py
      - name: Mic false-blur quarantine V3 strict Premiere XML regression
        run: |
          python -m py_compile rg_remote_control/quarantine_8865_mic_false_blur_v1.py
          python rg_remote_control/quarantine_8865_mic_false_blur_v1.py --self-test
      - name: Clean 886_5 XML source timeline mapping regression
        run: |
          python -m py_compile rg_remote_control/open_source_v1/audit_886_5_dialogue_preflight_v1.py
          python rg_remote_control/open_source_v1/audit_886_5_dialogue_preflight_v1.py --self-test
      - name: Quarantined 886_5 unique-source triage and reference resolution regression
        run: |
          python -m py_compile rg_remote_control/open_source_v1/triage_886_5_real_frames_v1.py
          python rg_remote_control/open_source_v1/triage_886_5_real_frames_v1.py --self-test
      - name: Stream 892 authentic cigarette reference extraction contract
        run: |
          python -m py_compile rg_remote_control/open_source_v1/extract_cigarette_gold_892_v1.py
          python rg_remote_control/open_source_v1/extract_cigarette_gold_892_v1.py --self-test
      - name: Real 892 positive and 886 microphone baseline contract
        run: |
          python -m py_compile rg_remote_control/open_source_v1/benchmark_cigarette_892_vs_886_v1.py
          python rg_remote_control/open_source_v1/benchmark_cigarette_892_vs_886_v1.py --self-test
      - name: SAM2 one-frame real 892 mask strict negative geometry tests
        run: |
          python -m py_compile rg_remote_control/open_source_v1/sam2_native_mask_892_shadow_v1.py
          python rg_remote_control/open_source_v1/sam2_native_mask_892_shadow_v1.py --self-test
      - name: SAM2 real 892 bounded video propagation mask QA offline synthetic selftest
        run: |
          python -m py_compile rg_remote_control/open_source_v1/sam2_video_track_892_shadow_v1.py
          python rg_remote_control/open_source_v1/sam2_video_track_892_shadow_v1.py --self-test
          python -m py_compile rg_remote_control/open_source_v1/sam2_video_track_892_full_mask_v2.py
          python rg_remote_control/open_source_v1/sam2_video_track_892_full_mask_v2.py --self-test
      - name: Real SAM2 892 full-mask ZIP strict area volatility safety regression
        run: |
          python -m py_compile rg_remote_control/open_source_v1/sam2_892_fullmask_archive_safety_v1.py
          python rg_remote_control/open_source_v1/sam2_892_fullmask_archive_safety_v1.py --self-test
      - name: Conservative SAM2 892 cigar core geometry - mic hard negative selftest
        run: |
          python -m py_compile rg_remote_control/open_source_v1/sam2_892_cigarette_core_shadow_v1.py
          python rg_remote_control/open_source_v1/sam2_892_cigarette_core_shadow_v1.py --self-test
      - name: SigLIP 892/886 real-reference semantic fail-closed audit
        run: |
          python -m py_compile rg_remote_control/open_source_v1/cigarette_siglip_five_case_fail_closed_v1.py
          python rg_remote_control/open_source_v1/cigarette_siglip_five_case_fail_closed_v1.py --self-test
      - name: SigLIP 13 genuine 892 masks plus three 886/892 negative controls safety
        run: |
          python -m py_compile rg_remote_control/open_source_v1/siglip_sam2_892_13frame_vs_886_negative_shadow_v1.py
          python rg_remote_control/open_source_v1/siglip_sam2_892_13frame_vs_886_negative_shadow_v1.py --self-test
      - name: Smoking compliance blur four-zone policy and 886 hard-negative contract
        run: |
          python -m py_compile rg_remote_control/open_source_v1/smoking_compliance_blur_v1_contract_selftest.py
          python rg_remote_control/open_source_v1/smoking_compliance_blur_v1_contract_selftest.py
      - name: Catalog scope and licensing invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path("rg_remote_control/open_source_v1/catalog.json").read_text())
          assert d["contour"]=="auto_edit"
          assert d["policy"]["live_changes"]=="DISALLOWED_UNTIL_GOLDEN_SMOKE_PASS"
          assert d["policy"]["blur_fail_closed"]
          assert d["policy"]["blur_mandatory"]
          assert d["policy"]["blur_whole_frame_forbidden"]
          l={c["id"]:c for c in d["components"]}
          assert "AGPL" in l["ultralytics"]["license"]
          assert l["cotracker"]["status"].startswith("DO_NOT_INTEGRATE")
          assert l["opentimelineio-fcp"]["status"]=="READ_ONLY_PARSER_CANDIDATE"
          print("RG_OSS_LICENSE_SCOPE_AND_FAIL_CLOSED_GATES=PASS")
          PY
