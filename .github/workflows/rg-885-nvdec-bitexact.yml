name: RG 885 NVDEC bitexact source validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-885-nvdec-bitexact.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_885_nvdec_bitexact_probe.py
          if($LASTEXITCODE -ne 0){throw 'NVDEC_SOURCE_BITEXACT_TEST_FAILED'}
