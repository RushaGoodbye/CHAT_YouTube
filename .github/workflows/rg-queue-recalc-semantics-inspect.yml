name: RG queue full recalc UI semantics inspection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-queue-recalc-semantics-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Read batch add and full recalc code without modifying queue
        shell: powershell
        run: |
          $p='F:\RG_AUTO_EDIT\RG Auto Edit App\rg_studio_ui.py'
          $lines=@(Get-Content -LiteralPath $p -Encoding UTF8)
          $terms=@('def batch_add','def batch_full_recalculate','def batch_start','def _batch_start','def _batch_next','def batch_clear_history','def batch_reprocess')
          for($i=0;$i -lt $lines.Count;$i++){
            $hit=$false
            foreach($term in $terms){if($lines[$i].Contains($term)){$hit=$true;break}}
            if($hit){
              Write-Output ('QUEUE|FUNC|'+($i+1)+'|'+$lines[$i])
              for($j=$i+1;$j -lt [Math]::Min($lines.Count,$i+62);$j++){
                if($lines[$j] -match '^    def '){break}
                Write-Output ('QUEUE|'+($j+1)+'|'+$lines[$j])
              }
            }
          }
          Write-Output 'QUEUE|DONE'
