name: RG full recalc button handler inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-full-recalc-button-handler-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Inspect full recalc handler and archive guarantees
        shell: powershell
        run: |
          $p='F:\RG_AUTO_EDIT\RG Auto Edit App\rg_studio_ui.py'
          $l=@(Get-Content $p -Encoding UTF8)
          for($i=0;$i -lt $l.Count;$i++){
            if($l[$i] -match 'batch_full_recalc|full_recalc|FULL_RECALC|ПЕРЕРАХУВАТИ ПОВН|def batch_recalculate|recalculate'){
              Write-Output ('RECALC|MATCH|'+($i+1)+'|'+$l[$i])
              for($j=$i+1;$j -lt [Math]::Min($l.Count,$i+35);$j++){if($l[$j] -match '^    def '){break};Write-Output ('RECALC|'+($j+1)+'|'+$l[$j])}
            }
          }
          Write-Output 'RECALC|DONE'
