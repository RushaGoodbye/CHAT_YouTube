name: RG fullstream ASR chunk language analysis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-asr-lang-chunks-source-audit.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - shell: pwsh
        run: |
          $root='F:\RG_AUTO_EDIT\RG Auto Edit App'
          foreach($name in @('rg_fullstream_asr_chunked_v58.py','rg_fullstream_auto_v2.py','rg_fullstream_gap_followup_v90.py')){
            $f=Join-Path $root $name
            if(!(Test-Path $f)){continue}
            $a=@(Get-Content $f -Encoding UTF8)
            Write-Output ('RGASR|FILE|'+$name+'|LINES='+$a.Count)
            if($name -eq 'rg_fullstream_asr_chunked_v58.py'){
              for($i=1;$i -le [Math]::Min(320,$a.Count);$i++){Write-Output ('RGASR|CODE|'+$name+'|'+$i+'|'+$a[$i-1])}
            }elseif($name -eq 'rg_fullstream_auto_v2.py'){
              for($i=380;$i -le [Math]::Min(433,$a.Count);$i++){Write-Output ('RGASR|CODE|'+$name+'|'+$i+'|'+$a[$i-1])}
              for($i=620;$i -le [Math]::Min(710,$a.Count);$i++){Write-Output ('RGASR|CODE|'+$name+'|'+$i+'|'+$a[$i-1])}
            }else{
              for($i=1;$i -le [Math]::Min(180,$a.Count);$i++){Write-Output ('RGASR|CODE|'+$name+'|'+$i+'|'+$a[$i-1])}
            }
          }
          Write-Output 'RGASR|READONLY|PASS'
