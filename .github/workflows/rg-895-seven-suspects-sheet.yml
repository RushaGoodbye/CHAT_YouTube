name: RG 895 seven unknown-layout suspects contact sheet
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-895-seven-suspects-sheet.yml']
permissions: {contents: read}
jobs:
  qa:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_895_seven_unknown_suspects.py
          if($LASTEXITCODE -ne 0){throw 'RG895_SUSPECT_QA_FAIL'}
