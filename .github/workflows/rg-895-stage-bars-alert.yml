name: RG 895 stage verified BARS alert manual mask
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-895-stage-bars-alert.yml']
permissions: {contents: read}
jobs:
  stage:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_895_stage_bars_alert_mask.py
          if($LASTEXITCODE -ne 0){throw 'RG895_BARS_ALERT_MASK_STAGE_FAILED'}
