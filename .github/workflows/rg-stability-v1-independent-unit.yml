name: RG stability V1 independent Linux unit tests
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-stability-v1-independent-unit.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify ETA UI fallback and Stability guard suite
        run: |
          python -m unittest discover -s rg_stability_v1 -p "test_*.py" -v
