name: RG Remote MCP CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rg_remote_mcp/**"
      - ".github/workflows/rg-remote-mcp-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "rg_remote_mcp/**"
      - ".github/workflows/rg-remote-mcp-ci.yml"

concurrency:
  group: rg-remote-mcp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rg_remote_mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rg_remote_mcp/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Tests
        run: pytest -q
      - name: Import smoke
        run: python -c "from rg_remote_mcp.server import mcp; print('MCP_IMPORT_OK')"
      - name: Docker build
        run: docker build -t rg-remote-mcp:test .
