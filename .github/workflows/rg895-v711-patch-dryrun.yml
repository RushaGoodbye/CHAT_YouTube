name: RG V711 intro patch package preflight (NO INSTALL)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg895-v711-patch-dryrun.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: SHA guarded offline dry run of both Studio policy copies
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $py='F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe'
          & $py -X utf8 scripts\rg_v711_intro_candidate_readonly.py
          if($LASTEXITCODE -ne 0){throw 'V711_PREFLIGHT_FAILED'}
