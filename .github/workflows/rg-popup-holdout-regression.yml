name: RG real popup positives and holdout negatives
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-popup-holdout-regression.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_popup_holdout_10pos_15neg.py
          if($LASTEXITCODE -ne 0){throw 'RG_POPUP_HOLDOUT_FAILED'}
