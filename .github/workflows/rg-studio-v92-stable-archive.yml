name: RG Studio V92 stable core archive verify
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-studio-v92-stable-archive.yml']
permissions: {contents: read}
jobs:
  archive:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_snapshot_stable_v92_core.py
          if($LASTEXITCODE -ne 0){throw 'RG_V92_STABLE_CORE_ARCHIVE_FAILED'}
