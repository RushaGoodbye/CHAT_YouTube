name: RG FULLSTREAM 885-899 full fresh start reset
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-fullstream-fresh-885-899-apply.yml']
permissions: {contents: read}
concurrency:
  group: rg-fullstream-fresh-885-899
  cancel-in-progress: false
jobs:
  reset:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Quarantine only old Full Stream derivatives in 885-899 and verify empty fresh workspace
        shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          $ErrorActionPreference='Stop'
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261109/rg_fullstream_fresh_reset_885_899.py
          if($LASTEXITCODE -ne 0){throw 'FULLSTREAM_FRESH_RESET_FAILED'}
