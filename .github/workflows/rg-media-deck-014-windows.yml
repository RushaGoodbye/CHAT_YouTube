name: RG Media Deck 0.1.4 Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [rg-media-deck-0-1-4]
    paths:
      - 'rg_media_deck/**'
      - '.github/workflows/rg-media-deck-014-windows.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rg_media_deck
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app sources
        shell: pwsh
        run: |
          $encoded=(Get-Content source_payload.b64 -Raw).Trim()
          [System.IO.File]::WriteAllBytes('rg_source.zip',[Convert]::FromBase64String($encoded))
          Expand-Archive rg_source.zip -DestinationPath . -Force
          if (!(Test-Path app.py)) { throw 'Missing application source' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name RG_Media_Deck --collect-all PySide6.QtMultimedia --collect-all PySide6.QtMultimediaWidgets app.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if (!(Test-Path dist/RG_Media_Deck/RG_Media_Deck.exe)) { throw 'Missing EXE' }
      - name: GUI smoke test
        shell: pwsh
        run: |
          $process=Start-Process -FilePath 'dist/RG_Media_Deck/RG_Media_Deck.exe' -ArgumentList '--selftest' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "GUI selftest failed: $($process.ExitCode)" }
      - name: Compile Setup
        shell: pwsh
        run: |
          $iscc=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            $iscc=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 unavailable' }
          & $iscc installer/RG_Media_Deck.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno installer failed' }
          if (!(Test-Path dist_installer/RG_Media_Deck_Setup.exe)) { throw 'Setup EXE missing' }
          (Get-FileHash dist_installer/RG_Media_Deck_Setup.exe -Algorithm SHA256).Hash.ToLower() + '  RG_Media_Deck_Setup.exe' | Set-Content dist_installer/RG_Media_Deck_Setup.exe.sha256 -Encoding Ascii
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RG_Media_Deck_0.1.4_Setup
          path: |
            rg_media_deck/dist_installer/RG_Media_Deck_Setup.exe
            rg_media_deck/dist_installer/RG_Media_Deck_Setup.exe.sha256
          if-no-files-found: error
      - name: Publish application release
        if: github.ref == 'refs/heads/rg-media-deck-0-1-4'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag='rg-media-deck-v0.1.4'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists, refusing overwrite" }
          gh release create $tag dist_installer/RG_Media_Deck_Setup.exe dist_installer/RG_Media_Deck_Setup.exe.sha256 --target $env:GITHUB_SHA --title 'RG Media Deck 0.1.4' --notes 'Windows Setup installer, main-window OBS capture, single audio player, two-column library, and installer-based updates.'
