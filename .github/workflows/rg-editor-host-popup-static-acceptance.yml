name: RG editor verified host popups acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-editor-host-popup-static-acceptance.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_editor_framed_host_popup_v1.py
          if($LASTEXITCODE -ne 0){throw 'FRAMED_HOST_MASKS_VALIDATION_FAILED'}
