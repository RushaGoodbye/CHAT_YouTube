name: SEO Intelligence Offline QA
on:
  push:
    branches:
      - feat/seo-intelligence-offline-batch-20261013
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test offline evidence gate without downloading AI models
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest -q tests/test_seo_intelligence_offline.py tests/test_seo_transcribe_local.py tests/test_seo_real_draft_audit.py
          python -m compileall -q src/rg_youtube_control/seo_intelligence.py
