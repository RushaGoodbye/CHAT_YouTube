name: RG QA pause isolation V1 preinstall acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-qa-pause-v1-test.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe'
          & $p -X utf8 rg_repair_20261110/rg_qa_pause_isolation_v1.py
          if($LASTEXITCODE -ne 0){throw 'QA_PAUSE_STATIC_TEST_FAILED'}
