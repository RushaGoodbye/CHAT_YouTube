name: RG 895 QA gate source diagnosis focused
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-895-qa-gate-source-diagnosis.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          $py=@'
          from pathlib import Path
          import ast,inspect,sys,json
          app=Path(r"F:\RG_AUTO_EDIT\RG Auto Edit App")
          root=Path(r"F:\RG_AUTO_EDIT\RG Auto Edit Data\fullstream_v2\895")
          sys.path.insert(0,str(app))
          for n in ("rg_fullstream_auto_v2.py","rg_fullstream_editorial_gate_v82.py","rg_fullstream_detectors_v2.py","rg_fullstream_popup_checkpoint_v89.py","rg_fullstream_batch_v53.py"):
              p=app/n
              lines=p.read_text(encoding="utf-8-sig").splitlines()
              indexes=[i for i,v in enumerate(lines) if any(s in v for s in ("popup_coverage_verified","NOTIFICATION_COVERAGE_UNVERIFIED","POPUP_LAYOUT_VALID_SAMPLES","layout_valid_samples","source_wide","full_notification_coverage","def verify_popup_cards_v41","def scan_popups","def verified_host","def verified_single_host","def verified_framed_host_v86","def validate("))]
              print("RGGATE|FILE|"+n+"|LINES|"+str(len(lines))+"|ANCHORS|"+str([i+1 for i in indexes]),flush=True)
              seen=set()
              for i in indexes:
                  for j in range(max(0,i-7),min(len(lines),i+12)):
                      if j not in seen:
                          seen.add(j)
                          print("RGGATE|CODE|"+n+"|"+str(j+1)+"|"+lines[j],flush=True)
          for n in ("processing_plan.json","editorial_preflight_v82.json","editorial_evidence_v84.json","completed_popups_v76.json"):
              obj=json.loads((root/n).read_text(encoding="utf-8-sig"))
              print("RGGATE|DATA_KEYS|"+n+"|"+str(list(obj.keys())),flush=True)
              if n=="processing_plan.json":
                  print("RGGATE|PLAN|review_flags|"+str(obj.get("extra_review_flags"))[:5000],flush=True)
                  print("RGGATE|PLAN|masks|"+str(len(obj.get("popup_masks",[]))),flush=True)
              if n=="editorial_evidence_v84.json":
                  print("RGGATE|EVIDENCE|"+json.dumps(obj,ensure_ascii=False)[:8500],flush=True)
          print("RGGATE|READONLY|PASS",flush=True)
          '@
          $py|& 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 -
          if($LASTEXITCODE -ne 0){throw 'RG895_QA_DIAG_FAILED'}
