name: RG SEO Candidate Regression (No SRT)
on:
  push:
    branches:
      - fix/seo-ukrainian-title-preservation-20261030
    paths:
      - 'src/rg_youtube_control/free_tools.py'
      - 'src/rg_youtube_control/dialogue_seo.py'
      - 'tests/test_seo_tag_local_grounding_20261109.py'
      - 'tests/test_seo_short_quote_ab_20261109.py'
      - '.github/workflows/rg-seo-regression-20261109.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check pytest rapidfuzz
      - name: Verify updated Python sources compile
        run: python -m compileall -q src/rg_youtube_control/free_tools.py src/rg_youtube_control/dialogue_seo.py
      - name: Run source grounding and short quote regression tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_seo_tag_local_grounding_20261109.py tests/test_seo_short_quote_ab_20261109.py
