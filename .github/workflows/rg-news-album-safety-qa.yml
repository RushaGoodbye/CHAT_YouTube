name: RG News Telegram Album Safety QA

on:
  push:
    branches: [main]
    paths:
      - "rg_remote_control/nas/monitoring/news_rg_album_intake_guard_v1.py"
      - "rg_remote_control/nas/monitoring/news_rg_album_delivery_gate_v1.py"
      - "rg_remote_control/nas/monitoring/news_rg_release_readiness_v1.py"
      - "rg_remote_control/nas/monitoring/news_rg_bot_album_projection_v1.py"
      - "rg_remote_control/nas/monitoring/news_rg_ingress_media_gate_v1.py"
      - "rg_remote_control/nas/monitoring/news_rg_sanitized_export_v1.py"
      - "rg_remote_control/nas/monitoring/news_rg_sanitized_consumer_v1.py"
      - ".github/workflows/rg-news-album-safety-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  album-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only live album compatibility check
        run: |
          python3 - <<'PY'
          import importlib.util
          import urllib.request
          from pathlib import Path
          path = Path("rg_remote_control/nas/monitoring/news_rg_album_intake_guard_v1.py")
          spec = importlib.util.spec_from_file_location("album_guard", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          source = "https://t.me/supernova_plus/62837"
          url = source + "?embed=1&mode=tme"
          request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(request, timeout=20) as response:
              assert response.status == 200
              data = response.read(500001)
          assert len(data) <= 500000
          result = module.inspect(source, data.decode("utf-8", "replace"))
          assert result["media_kind"] == "video_album", result
          assert result["video_count"] == 3, result
          assert result["publication_allowed"] is False
          assert result["original_files_verified"] is False
          print("REAL_POST_62837_THREE_VIDEO_METADATA_PASS")
          print("MEDIA_FILES_DOWNLOADED=0")
          PY
      - name: Self-hosted NAS runner security inventory
        run: |
          python3 - <<'PY'
          import pathlib,re
          files=sorted(pathlib.Path(".github/workflows").glob("*.yml"))
          risks=[]
          matches=[]
          for path in files:
              text=path.read_text(encoding="utf-8",errors="replace")
              if "self-hosted" not in text: continue
              matches.append(str(path))
              if re.search(r"(?m)^\s*pull_request(?:_target)?:", text):
                  risks.append((str(path), "PR_EVENT_WITH_SELF_HOSTED"))
              if re.search(r"(?m)^\s*workflow_run:",text):
                  risks.append((str(path), "WORKFLOW_RUN_WITH_SELF_HOSTED"))
          print("SELF_HOSTED_WORKFLOW_COUNT",len(matches))
          print("SELF_HOSTED_WORKFLOWS",*matches,sep="\n")
          print("POTENTIAL_TRIGGER_RISKS",len(risks))
          for path,kind in risks: print("REVIEW_REQUIRED",kind,path)
          print("INVENTORY_ONLY_NO_CHANGES=1")
          PY
      - name: Identify workflows eligible for NAS runner labels
        run: |
          python3 - <<'PY'
          import pathlib,re
          patterns=[]
          for path in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              src=path.read_text(encoding='utf-8',errors='replace')
              # Simple conservative scan of runs-on lines and immediate multiline array.
              for m in re.finditer(r'(?m)^\s*runs-on:\s*(\[[^\]]*\]|[^\n]*)',src):
                  labels=m.group(1).strip()
                  if 'self-hosted' not in labels: continue
                  relevant = ('nas' in labels.lower() or 'linux' in labels.lower() or labels=='self-hosted' or labels=='[self-hosted]')
                  if relevant: patterns.append((str(path),labels))
          print('NAS_POTENTIALLY_ELIGIBLE_WORKFLOWS',len(patterns))
          for path,labels in patterns[:90]: print('NAS_MATCH_CANDIDATE',path,'LABELS',labels[:130])
          print('SECURITY_SCAN_IS_CONSERVATIVE_NOT_ENFORCEMENT=1')
          PY
      - name: Enforce Windows-only runner routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              'rg-youtube-control.yml',
              'rg-seo-0716-batch-qa.yml',
              'rg-seo-0717-real-video-gate.yml',
              'rg-seo-shoigu-real-dryrun.yml',
          ]
          for name in files:
              doc=(Path('.github/workflows')/name).read_text(encoding='utf-8')
              assert 'runs-on: [self-hosted, Windows, X64]' in doc, name
              print('WINDOWS_ROUTING_PASS', name)
          print('NAS_MISROUTING_PROTECTION_PASS')
          PY
      - name: Prove actual release cannot pass with metadata-only videos
        run: |
          python3 - <<'PY'
          import importlib.util
          path="rg_remote_control/nas/monitoring/news_rg_release_readiness_v1.py"
          spec=importlib.util.spec_from_file_location("release_readiness",path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          evidence={
              "source_url":"https://t.me/supernova_plus/62837",
              "source_video_count":3,
              "original_video_count":0,
              "nas_runner_private_isolated":False,
              "source_album_membership_verified":False,
              "original_three_videos_sha256_verified":False,
              "telegram_media_provenance_verified":False,
              "moderation_card_confirmed":False,
              "human_approval_confirmed":False,
              "watermark_file_and_position_verified":False,
              "required_footer_verified":False,
              "duplicate_publication_guard_verified":False,
              "nas_backup_and_restore_drill_passed":False,
              "bot_owner_single_polling_verified":False,
              "live_telegram_health_fresh":False,
              "public_publication":"OFF",
              "secrets_in_artifacts":False,
          }
          result=module.assess(evidence)
          assert result["status"]=="BLOCKED"
          assert result["publication_authorized"] is False
          assert "ORIGINAL_VIDEO_COUNT_UNVERIFIED" in result["blockers"]
          assert "RUNNER_PUBLIC_REPOSITORY_EXPOSURE" in result["blockers"]
          print("REAL_EVIDENCE_RELEASE_BLOCKED_PASS")
          print("UNRESOLVED_RELEASE_BLOCKERS_COUNT",len(result["blockers"]))
          print("NO_PRODUCTION_EVIDENCE_ASSUMED_PASS")
          PY
      - name: Compile and offline tests
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/news_rg_album_intake_guard_v1.py
          python3 -m py_compile rg_remote_control/nas/monitoring/news_rg_album_delivery_gate_v1.py
          python3 -m py_compile rg_remote_control/nas/monitoring/news_rg_release_readiness_v1.py
          python3 rg_remote_control/nas/monitoring/news_rg_release_readiness_v1.py selftest
          python3 -m py_compile rg_remote_control/nas/monitoring/news_rg_bot_album_projection_v1.py
          python3 rg_remote_control/nas/monitoring/news_rg_bot_album_projection_v1.py selftest
          python3 -m py_compile rg_remote_control/nas/monitoring/news_rg_ingress_media_gate_v1.py
          python3 rg_remote_control/nas/monitoring/news_rg_ingress_media_gate_v1.py selftest
          python3 -m py_compile rg_remote_control/nas/monitoring/news_rg_sanitized_export_v1.py
          python3 rg_remote_control/nas/monitoring/news_rg_sanitized_export_v1.py selftest
          python3 -m py_compile rg_remote_control/nas/monitoring/news_rg_sanitized_consumer_v1.py
          python3 rg_remote_control/nas/monitoring/news_rg_sanitized_consumer_v1.py selftest
          python3 rg_remote_control/nas/monitoring/news_rg_album_delivery_gate_v1.py selftest
          python3 rg_remote_control/nas/monitoring/news_rg_album_intake_guard_v1.py selftest
          echo "NO_NAS_ACCESS=1"
          echo "NO_TELEGRAM_BOT_CALLS=1"
          echo "NO_PUBLICATIONS=1"
