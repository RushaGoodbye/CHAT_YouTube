name: RG News Telegram Album Safety QA

on:
  push:
    branches: [main]
    paths:
      - "rg_remote_control/nas/monitoring/news_rg_album_intake_guard_v1.py"
      - ".github/workflows/rg-news-album-safety-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  album-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and offline tests
        run: |
          python3 -m py_compile rg_remote_control/nas/monitoring/news_rg_album_intake_guard_v1.py
          python3 rg_remote_control/nas/monitoring/news_rg_album_intake_guard_v1.py selftest
          echo "NO_NAS_ACCESS=1"
          echo "NO_TELEGRAM_BOT_CALLS=1"
          echo "NO_PUBLICATIONS=1"
