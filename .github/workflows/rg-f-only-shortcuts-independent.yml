name: RG direct F Studio shortcuts apply only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-f-only-shortcuts-independent.yml']
permissions: {contents: read}
jobs:
  update:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target='F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\pythonw.exe'
          $app='F:\RG_AUTO_EDIT\RG Auto Edit App'
          $main=Join-Path $app 'rg_studio_main.py'
          $backup='F:\RG_AUTO_EDIT\RG Auto Edit Data\RG_REPAIR_BACKUPS\RG_F_ONLY_SHORTCUTS_20261110'
          if(!(Test-Path $target) -or !(Test-Path $main)){throw 'F_DIRECT_STUDIO_MISSING'}
          $running=@(Get-CimInstance Win32_Process|Where-Object{$_.CommandLine -match 'rg_studio_main.py|rg_fullstream_worker_v3' -and $_.Name -match 'python|pythonw'})
          if($running.Count){throw 'STUDIO_STILL_RUNNING_SKIP'}
          $shortcuts=@('C:\Users\fauto\Desktop\RG Auto Edit Studio.lnk',
             'C:\Users\fauto\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\RG Auto Edit Studio.lnk',
             'C:\Users\fauto\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\РАША ГУДБАЙ МОНТАЖКА.lnk')
          New-Item -ItemType Directory -Path $backup -Force|Out-Null
          $shell=New-Object -ComObject WScript.Shell
          $changed=@()
          try{
            for($i=0;$i -lt $shortcuts.Count;$i++){
              $p=$shortcuts[$i]
              if(!(Test-Path $p)){throw ('SHORTCUT_MISSING_'+$i)}
              Copy-Item -LiteralPath $p -Destination (Join-Path $backup ("before_"+$i+".lnk")) -Force
              $l=$shell.CreateShortcut($p)
              $l.TargetPath=$target
              $l.Arguments='-X utf8 "'+$main+'"'
              $l.WorkingDirectory=$app
              $l.Description='RG Auto Edit Studio (F:)'
              $l.IconLocation=$target+',0'
              $l.Save()
              $changed+=,$i
              $check=$shell.CreateShortcut($p)
              if($check.TargetPath -ne $target -or $check.WorkingDirectory -ne $app -or $check.Arguments -notlike '*F:\RG_AUTO_EDIT*'){
                throw ('SHORTCUT_POSTCHECK_FAIL_'+$i)
              }
              Write-Output ('RGFDIRECT|SHORTCUT|'+$p+'|'+$check.TargetPath+'|'+$check.Arguments)
            }
          }catch{
            foreach($i in $changed){Copy-Item -LiteralPath (Join-Path $backup ("before_"+$i+".lnk")) -Destination $shortcuts[$i] -Force}
            throw
          }
          Write-Output ('RGFDIRECT|BACKUP|'+$backup)
          Write-Output 'RGFDIRECT|THREE_SHORTCUTS_F_ONLY|PASS'
          Write-Output ('RGFDIRECT|LEGACY_C_EXE_REMAINS_PROTECTED|'+(Test-Path 'C:\Program Files\RG Auto Edit Studio\RG Auto Edit Studio.exe'))
          Write-Output 'RGFDIRECT|NO_STUDIO_LAUNCHED|PASS'
