name: Windows Build

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "rg_remote_mcp/**"
      - "rg_remote_control/**"
      - ".github/workflows/rg-*.yml"
      - ".github/workflows/rg-alexpc-control.yml"
      - ".github/workflows/rg-auto-edit-control.yml"
      - ".github/workflows/rg-remote-control.yml"
      - ".github/workflows/rg-remote-mcp-ci.yml"
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths-ignore:
      - "rg_remote_mcp/**"
      - "rg_remote_control/**"
      - ".github/workflows/rg-*.yml"
      - ".github/workflows/rg-alexpc-control.yml"
      - ".github/workflows/rg-auto-edit-control.yml"
      - ".github/workflows/rg-remote-control.yml"
      - ".github/workflows/rg-remote-mcp-ci.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH="src"
          python -m pytest -q tests

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "RG YouTube Control" `
            --paths src run_app.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\installer.iss

      - name: Create SHA-256
        shell: pwsh
        run: |
          $file = Get-ChildItem installer\*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii "$($file.FullName).sha256"

      - name: Create update manifest
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          $file = Get-ChildItem installer\*.exe | Select-Object -First 1
          $base = "https://rushagoodbye.github.io/CHAT_YouTube/updates"
          $manifest = [ordered]@{
            version = $version
            installer_name = $file.Name
            installer_url = "$base/$($file.Name)"
            checksum_url = "$base/$($file.Name).sha256"
            notes = "Windows update $version"
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 installer\latest.json

      - name: Create ZIP update package
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          $file = Get-ChildItem installer\*.exe | Select-Object -First 1
          $checksum = "$($file.FullName).sha256"
          $zip = "installer\RG_YouTube_Control_Update_$version.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $file.FullName,$checksum,"installer\latest.json" -DestinationPath $zip -CompressionLevel Optimal

      - name: Verify ZIP installer and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $line = Select-String -Path pyproject.toml -Pattern "version = "
          $version = ($line.Line -split '"')[1]
          $zipPath = "installer/RG_YouTube_Control_Update_$version.zip"
          if (-not (Test-Path $zipPath)) { throw "ZIP missing" }
          $manifest = Get-Content installer/latest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw "Version mismatch" }
          $installer = Join-Path installer $manifest.installer_name
          if (-not (Test-Path $installer)) { throw "Installer missing" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content "$installer.sha256" -Raw).Substring(0,64).ToLowerInvariant()
          if ($hash -ne $expected) { throw "SHA256 mismatch" }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.Name })
            foreach ($name in @($manifest.installer_name, "$($manifest.installer_name).sha256", "latest.json")) {
              if ($names -notcontains $name) { throw "Missing ZIP entry: $name" }
            }
          } finally { $zip.Dispose() }
          Write-Host "Verified update package $version"
      - name: Smoke test silent installation on isolated Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem installer/RG_YouTube_Control_Setup_*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer is missing" }
          $target = Join-Path $env:RUNNER_TEMP "RGYouTubeControl_QA"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $args = @("/VERYSILENT", "/SP-", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target")
          $process = Start-Process -FilePath $installer.FullName -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup exited with $($process.ExitCode)" }
          $app = Join-Path $target "RG YouTube Control.exe"
          if (-not (Test-Path $app)) { throw "Installed application EXE missing: $app" }
          $internal = Join-Path $target "_internal"
          if (-not (Test-Path $internal)) { throw "Installed PyInstaller runtime missing" }
          Write-Host "QA installation successful: $app"

      - name: Smoke test installed GUI startup in disposable profile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = Join-Path $env:RUNNER_TEMP "RGYouTubeControl_QA"
          $app = Join-Path $target "RG YouTube Control.exe"
          if (-not (Test-Path -LiteralPath $app)) { throw "Installed GUI missing" }
          # Offscreen + disposable APPDATA: never touch an operator's profile.
          $profile = Join-Path $env:RUNNER_TEMP "RGYouTube_ColdStart_Profile"
          $env:LOCALAPPDATA = Join-Path $profile "Local"
          $env:APPDATA = Join-Path $profile "Roaming"
          $env:QT_QPA_PLATFORM = "offscreen"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA,$env:APPDATA | Out-Null
          $gui = Start-Process -FilePath $app -WorkingDirectory $target -PassThru
          try {
            Start-Sleep -Seconds 8
            $gui.Refresh()
            if ($gui.HasExited) {
              throw "Installed GUI exited during isolated startup; exit=$($gui.ExitCode)"
            }
            Write-Host "Installed GUI cold-start stayed alive for 8 seconds"
          } finally {
            if (-not $gui.HasExited) {
              Stop-Process -Id $gui.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Publish GitHub release (optional)
        continue-on-error: true
        if: >-
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' &&
           startsWith(github.event.head_commit.message, 'Release '))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          $tag = "v$version"

          function Invoke-ReleasePublish {
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag installer\*.exe installer\*.sha256 installer\latest.json installer\*.zip --clobber --repo $env:GITHUB_REPOSITORY
            } else {
              gh release create $tag installer\*.exe installer\*.sha256 installer\latest.json installer\*.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "RG YouTube Control $version" --notes "Windows update $version"
            }
            return $LASTEXITCODE
          }

          $ok = $false
          foreach ($attempt in 1..2) {
            Write-Host "Release publish attempt $attempt/2"
            $code = Invoke-ReleasePublish
            if ($code -eq 0) {
              $ok = $true
              break
            }
            if ($attempt -lt 2) {
              Start-Sleep -Seconds 10
            }
          }
          if (-not $ok) {
            Write-Warning "GitHub Release $tag was not published. Build artifacts and GitHub Pages update feed remain authoritative."
          }

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RG-YouTube-Control-Windows
          path: |
            installer\*.exe
            installer\*.sha256
            installer\latest.json
            installer\*.zip