name: Windows Build

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH="src"
          python -m pytest -q tests

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "RG YouTube Control" `
            --paths src run_app.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Create SHA-256
        shell: pwsh
        run: |
          $file = Get-ChildItem installer\*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii "$($file.FullName).sha256"

      - name: Create update manifest
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          $file = Get-ChildItem installer\*.exe | Select-Object -First 1
          $tag = "v$version"
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $manifest = [ordered]@{
            version = $version
            installer_name = $file.Name
            installer_url = "$base/$($file.Name)"
            checksum_url = "$base/$($file.Name).sha256"
            notes = "Windows update $version"
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 installer\latest.json

      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag installer\*.exe installer\*.sha256 installer\latest.json --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag installer\*.exe installer\*.sha256 installer\latest.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "RG YouTube Control $version" --notes "Windows update $version"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: RG-YouTube-Control-Windows
          path: |
            installer\*.exe
            installer\*.sha256
            installer\latest.json