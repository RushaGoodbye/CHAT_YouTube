name: Windows Build

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "rg_remote_mcp/**"
      - "rg_remote_control/**"
      - ".github/workflows/rg-*.yml"
      - ".github/workflows/rg-alexpc-control.yml"
      - ".github/workflows/rg-auto-edit-control.yml"
      - ".github/workflows/rg-remote-control.yml"
      - ".github/workflows/rg-remote-mcp-ci.yml"
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths-ignore:
      - "rg_remote_mcp/**"
      - "rg_remote_control/**"
      - ".github/workflows/rg-*.yml"
      - ".github/workflows/rg-alexpc-control.yml"
      - ".github/workflows/rg-auto-edit-control.yml"
      - ".github/workflows/rg-remote-control.yml"
      - ".github/workflows/rg-remote-mcp-ci.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH="src"
          python -m pytest -q tests

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "RG YouTube Control" `
            --paths src run_app.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\installer.iss

      - name: Create SHA-256
        shell: pwsh
        run: |
          $file = Get-ChildItem installer\*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii "$($file.FullName).sha256"

      - name: Create update manifest
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          $file = Get-ChildItem installer\*.exe | Select-Object -First 1
          $base = "https://rushagoodbye.github.io/CHAT_YouTube/updates"
          $manifest = [ordered]@{
            version = $version
            installer_name = $file.Name
            installer_url = "$base/$($file.Name)"
            checksum_url = "$base/$($file.Name).sha256"
            notes = "Windows update $version"
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 installer\latest.json

      - name: Create ZIP update package
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          $file = Get-ChildItem installer\*.exe | Select-Object -First 1
          $checksum = "$($file.FullName).sha256"
          $zip = "installer\RG_YouTube_Control_Update_$version.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $file.FullName,$checksum,"installer\latest.json" -DestinationPath $zip -CompressionLevel Optimal

      - name: Smoke test ZIP updater in isolated Windows temp storage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = "src"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "RG_YouTube_ZIP_Smoke_Data"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $env:RG_EXPECTED_TEST_VERSION = $line.Matches[0].Groups[1].Value
          @'
          import os
          from pathlib import Path
          import rg_youtube_control.updater as updater

          updater.__version__ = "0.7.10"
          files = list(Path("installer").glob("RG_YouTube_Control_Update_*.zip"))
          assert len(files) == 1, files
          info, installer = updater.prepare_update_from_zip(files[0])
          assert info.version == os.environ["RG_EXPECTED_TEST_VERSION"]
          assert Path(installer).is_file()
          print("ZIP_UPDATER_SMOKE_PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "ZIP updater smoke failed" }

      - name: Smoke test installer and uninstaller in isolated Windows temp directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem installer\RG_YouTube_Control_Setup_*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer artifact missing" }
          $staged = Join-Path $env:RUNNER_TEMP "RG_YouTube_Installer_Smoke"
          $args = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", ('/DIR="' + $staged + '"'))
          $install = Start-Process -FilePath $installer.FullName -ArgumentList $args -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Smoke install failed with exit $($install.ExitCode)" }
          $binary = Join-Path $staged "RG YouTube Control.exe"
          if (-not (Test-Path $binary)) { throw "Installed executable not found" }
          Write-Host "WINDOWS_INSTALLER_INSTALL_SMOKE_PASS"
          $uninstallFile = Join-Path $staged "unins000.exe"
          if (-not (Test-Path $uninstallFile)) { throw "Uninstaller missing" }
          $uninstall = Start-Process -FilePath $uninstallFile -ArgumentList @("/VERYSILENT", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Smoke uninstall failed with exit $($uninstall.ExitCode)" }
          if (Test-Path $binary) { throw "Uninstalled executable still exists" }
          Write-Host "WINDOWS_INSTALLER_UNINSTALL_SMOKE_PASS"

      - name: Publish GitHub release (optional)
        continue-on-error: true
        if: >-
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' &&
           startsWith(github.event.head_commit.message, 'Release '))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          $tag = "v$version"

          function Invoke-ReleasePublish {
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag installer\*.exe installer\*.sha256 installer\latest.json installer\*.zip --clobber --repo $env:GITHUB_REPOSITORY
            } else {
              gh release create $tag installer\*.exe installer\*.sha256 installer\latest.json installer\*.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "RG YouTube Control $version" --notes "Windows update $version"
            }
            return $LASTEXITCODE
          }

          $ok = $false
          foreach ($attempt in 1..2) {
            Write-Host "Release publish attempt $attempt/2"
            $code = Invoke-ReleasePublish
            if ($code -eq 0) {
              $ok = $true
              break
            }
            if ($attempt -lt 2) {
              Start-Sleep -Seconds 10
            }
          }
          if (-not $ok) {
            Write-Warning "GitHub Release $tag was not published. Build artifacts and GitHub Pages update feed remain authoritative."
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RG-YouTube-Control-Windows
          path: |
            installer\*.exe
            installer\*.sha256
            installer\latest.json
            installer\*.zip