name: Windows Build

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "rg_remote_mcp/**"
      - "rg_remote_control/**"
      - ".github/workflows/rg-*.yml"
      - ".github/workflows/rg-alexpc-control.yml"
      - ".github/workflows/rg-auto-edit-control.yml"
      - ".github/workflows/rg-remote-control.yml"
      - ".github/workflows/rg-remote-mcp-ci.yml"
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths-ignore:
      - "rg_remote_mcp/**"
      - "rg_remote_control/**"
      - ".github/workflows/rg-*.yml"
      - ".github/workflows/rg-alexpc-control.yml"
      - ".github/workflows/rg-auto-edit-control.yml"
      - ".github/workflows/rg-remote-control.yml"
      - ".github/workflows/rg-remote-mcp-ci.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH="src"
          python -m pytest -q tests

      - name: Stamp exact build number and commit into Windows EXE
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 8)
          $number = $env:GITHUB_RUN_NUMBER
          @(
            '"""Build provenance, generated for the Windows executable."""'
            "BUILD_SHA = '$short'"
            "BUILD_NUMBER = '$number'"
          ) | Set-Content -LiteralPath 'src/rg_youtube_control/build_info.py' -Encoding utf8

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "RG YouTube Control" `
            --paths src run_app.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\installer.iss

      - name: Create SHA-256
        shell: pwsh
        run: |
          $file = Get-ChildItem installer\*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii "$($file.FullName).sha256"

      - name: Create update manifest
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          $file = Get-ChildItem installer\*.exe | Select-Object -First 1
          $base = "https://rushagoodbye.github.io/CHAT_YouTube/updates"
          $manifest = [ordered]@{
            version = $version
            installer_name = $file.Name
            installer_url = "$base/$($file.Name)"
            checksum_url = "$base/$($file.Name).sha256"
            notes = "Windows update $version"
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 installer\latest.json

      - name: Create ZIP update package
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          $file = Get-ChildItem installer\*.exe | Select-Object -First 1
          $checksum = "$($file.FullName).sha256"
          $zip = "installer\RG_YouTube_Control_Update_$version.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $file.FullName,$checksum,"installer\latest.json" -DestinationPath $zip -CompressionLevel Optimal

      - name: Verify ZIP installer and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $line = Select-String -Path pyproject.toml -Pattern "version = "
          $version = ($line.Line -split '"')[1]
          $zipPath = "installer/RG_YouTube_Control_Update_$version.zip"
          if (-not (Test-Path $zipPath)) { throw "ZIP missing" }
          $manifest = Get-Content installer/latest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw "Version mismatch" }
          $installer = Join-Path installer $manifest.installer_name
          if (-not (Test-Path $installer)) { throw "Installer missing" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content "$installer.sha256" -Raw).Substring(0,64).ToLowerInvariant()
          if ($hash -ne $expected) { throw "SHA256 mismatch" }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.Name })
            foreach ($name in @($manifest.installer_name, "$($manifest.installer_name).sha256", "latest.json")) {
              if ($names -notcontains $name) { throw "Missing ZIP entry: $name" }
            }
          } finally { $zip.Dispose() }
          Write-Host "Verified update package $version"
      - name: Smoke test silent installation on isolated Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem installer/RG_YouTube_Control_Setup_*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer is missing" }
          $target = Join-Path $env:RUNNER_TEMP "RGYouTubeControl_QA"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $args = @("/VERYSILENT", "/SP-", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target")
          $process = Start-Process -FilePath $installer.FullName -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup exited with $($process.ExitCode)" }
          $app = Join-Path $target "RG YouTube Control.exe"
          if (-not (Test-Path $app)) { throw "Installed application EXE missing: $app" }
          $internal = Join-Path $target "_internal"
          if (-not (Test-Path $internal)) { throw "Installed PyInstaller runtime missing" }
          Write-Host "QA installation successful: $app"

      - name: Smoke test frozen GUI first paint and event loop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = Join-Path $env:RUNNER_TEMP "RGYouTubeControl_QA"
          $exe = Join-Path $target "RG YouTube Control.exe"
          $isolated = Join-Path $env:RUNNER_TEMP "RGQtIsolated"
          New-Item -ItemType Directory -Force $isolated | Out-Null
          $env:APPDATA = Join-Path $isolated "Roaming"
          $env:LOCALAPPDATA = Join-Path $isolated "Local"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:RG_YT_QA_SMOKE_FILE = Join-Path $isolated "qt_ready.json"
          New-Item -ItemType Directory -Force $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            while (!(Test-Path $env:RG_YT_QA_SMOKE_FILE) -and (Get-Date) -lt $deadline) {
              $process.Refresh()
              if ($process.HasExited) { throw "Frozen GUI exited early with $($process.ExitCode)" }
              Start-Sleep -Milliseconds 500
            }
            if (!(Test-Path $env:RG_YT_QA_SMOKE_FILE)) { throw "Frozen GUI did not reach Qt event-loop probe" }
            $probe = Get-Content $env:RG_YT_QA_SMOKE_FILE -Raw | ConvertFrom-Json
            if (!$probe.visible -or $probe.tab_count -lt 7) { throw "Frozen GUI did not open its tabs" }
            if ($probe.build_label -notlike "*збірка #$($env:GITHUB_RUN_NUMBER)*") {
              throw "Frozen GUI does not display the exact CI build number"
            }
            $expectedSha = $env:GITHUB_SHA.Substring(0, 8)
            if ($probe.build_label -notlike "*$expectedSha*") {
              throw "Frozen GUI does not embed expected Git commit"
            }
            Write-Host "FROZEN_GUI_FIRST_PAINT_PASS tabs=$($probe.tab_count) build=$($probe.build_label)"
          } finally {
            $process.Refresh()
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item Env:RG_YT_QA_SMOKE_FILE -ErrorAction SilentlyContinue
          }

      - name: Cold-start frozen GUI against large synthetic SQLite database
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:RUNNER_TEMP "RGYouTubeControl_QA/RG YouTube Control.exe"
          $isolated = Join-Path $env:RUNNER_TEMP "RGQtLargeData"
          $env:APPDATA = Join-Path $isolated "Roaming"
          $env:LOCALAPPDATA = Join-Path $isolated "Local"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:RG_YT_QA_SMOKE_FILE = Join-Path $isolated "qt_ready.json"
          New-Item -ItemType Directory -Force $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          $db = Join-Path $env:LOCALAPPDATA "RGYouTubeControl/rg_youtube_control.db"
          python scripts/qa_seed_startup_db.py $db
          $started = Get-Date
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = $started.AddSeconds(45)
            while (!(Test-Path $env:RG_YT_QA_SMOKE_FILE) -and (Get-Date) -lt $deadline) {
              $process.Refresh()
              if ($process.HasExited) { throw "Large-data GUI exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 500
            }
            if (!(Test-Path $env:RG_YT_QA_SMOKE_FILE)) { throw "Large-data GUI hung at startup" }
            $probe = Get-Content $env:RG_YT_QA_SMOKE_FILE -Raw | ConvertFrom-Json
            if (!$probe.visible -or $probe.tab_count -lt 7) { throw "Large-data GUI failed first paint" }
            $seconds = ((Get-Date) - $started).TotalSeconds
            if ($seconds -gt 20) { throw "Large-data first paint took $seconds seconds" }
            Write-Host "LARGE_SQLITE_GUI_STARTUP_PASS duration=$seconds tabs=$($probe.tab_count)"
          } finally {
            $process.Refresh()
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item Env:RG_YT_QA_SMOKE_FILE -ErrorAction SilentlyContinue
          }

      - name: Check GUI after delayed archive recovery starts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:RUNNER_TEMP "RGYouTubeControl_QA/RG YouTube Control.exe"
          $isolated = Join-Path $env:RUNNER_TEMP "RGLateStartQA"
          $env:APPDATA = Join-Path $isolated "Roaming"
          $env:LOCALAPPDATA = Join-Path $isolated "Local"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:RG_YT_QA_STABILITY_FILE = Join-Path $isolated "after_20s.json"
          Remove-Item Env:RG_YT_QA_SMOKE_FILE -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(50)
            while (!(Test-Path $env:RG_YT_QA_STABILITY_FILE) -and (Get-Date) -lt $deadline) {
              $proc.Refresh()
              if ($proc.HasExited) { throw "Frozen GUI exited before delayed tasks" }
              Start-Sleep -Milliseconds 500
            }
            if (!(Test-Path $env:RG_YT_QA_STABILITY_FILE)) {
              throw "GUI frozen after delayed archive recovery timer"
            }
            $probe = Get-Content $env:RG_YT_QA_STABILITY_FILE -Raw | ConvertFrom-Json
            if (!$probe.visible -or $probe.tab_count -lt 7) {
              throw "GUI became unavailable after delayed startup tasks"
            }
            Write-Host "LATE_START_QT_RESPONSIVE_PASS"
          } finally {
            $proc.Refresh()
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item Env:RG_YT_QA_STABILITY_FILE -ErrorAction SilentlyContinue
          }

      - name: Publish GitHub release (optional)
        continue-on-error: true
        if: >-
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' &&
           startsWith(github.event.head_commit.message, 'Release '))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          $tag = "v$version"

          function Invoke-ReleasePublish {
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag installer\*.exe installer\*.sha256 installer\latest.json installer\*.zip --clobber --repo $env:GITHUB_REPOSITORY
            } else {
              gh release create $tag installer\*.exe installer\*.sha256 installer\latest.json installer\*.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "RG YouTube Control $version" --notes "Windows update $version"
            }
            return $LASTEXITCODE
          }

          $ok = $false
          foreach ($attempt in 1..2) {
            Write-Host "Release publish attempt $attempt/2"
            $code = Invoke-ReleasePublish
            if ($code -eq 0) {
              $ok = $true
              break
            }
            if ($attempt -lt 2) {
              Start-Sleep -Seconds 10
            }
          }
          if (-not $ok) {
            Write-Warning "GitHub Release $tag was not published. Build artifacts and GitHub Pages update feed remain authoritative."
          }

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RG-YouTube-Control-Windows
          path: |
            installer\*.exe
            installer\*.sha256
            installer\latest.json
            installer\*.zip