name: RG Smoking Full Source Evidence
on:
  push:
    branches: [release/smoking-compliance-20261009]
    paths:
      - rg_remote_control/smoking_release/run_smoke_probe.py
      - rg_remote_control/smoking_release/run_dense_source_qa.py
      - rg_remote_control/smoking_release/checkpoint_evidence.py
      - .github/workflows/rg-smoking-release-evidence.yml
permissions:
  contents: read
concurrency:
  group: rg-smoking-full-source-evidence
  cancel-in-progress: false
jobs:
  alexpc-evidence:
    runs-on: [self-hosted, windows]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Smoke segmentation experiments in existing isolated environment
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $active=Get-CimInstance Win32_Process | Where-Object {
            $_.Name -match '^pythonw?\.exe$' -and
            ($_.CommandLine -like '*rg_production_wrapper.py*' -or
             $_.CommandLine -like '*rg_multi_dialogue.py*' -or
             $_.CommandLine -like '*rg_auto_edit_one_button.py*')
          }
          if ($active) { throw 'Production processing active; GPU evidence deferred' }
          $py='F:\RG_AUTO_EDIT\RG Auto Edit Data\oss_envs\rg_sam2_native_shadow_v1\Scripts\python.exe'
          $out=Join-Path 'F:\RG_AUTO_EDIT\RG Auto Edit Data\oss_shadow\smoking_full_evidence_v1' $env:GITHUB_SHA
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          "RG_EVIDENCE_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PYTHONNOUSERSITE='1'
          $env:PYTHONPATH=$null
          & $py -X utf8 -u rg_remote_control/smoking_release/run_smoke_probe.py --output (Join-Path $out 'smoke-probe')
          if ($LASTEXITCODE -ne 0) { throw 'Smoke probe failed; diagnostics retained' }
      - name: Every source frame including microphone negatives
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $py='F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe'
          $manifest=Get-Content -LiteralPath 'F:\RG_AUTO_EDIT\RG Auto Edit Data\cigarette_detector_v1.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $env:PYTHONNOUSERSITE='1'
          $env:PYTHONPATH=$manifest.worker_site
          $env:YOLO_CONFIG_DIR=Join-Path $env:RG_EVIDENCE_OUT 'yolo_config'
          & $py -X utf8 -u rg_remote_control/smoking_release/run_dense_source_qa.py --output (Join-Path $env:RG_EVIDENCE_OUT 'dense-source')
          if ($LASTEXITCODE -ne 0) { throw 'Full source evidence failed; diagnostics retained' }
      - name: Save immutable evidence checkpoint to NAS
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RG_EVIDENCE_OUT) {
            $py='F:\RG_AUTO_EDIT\RG Auto Edit Data\oss_envs\rg_sam2_native_shadow_v1\Scripts\python.exe'
            & $py -X utf8 -u rg_remote_control/smoking_release/checkpoint_evidence.py --output $env:RG_EVIDENCE_OUT --artifact smoking-evidence-artifact
            if ($LASTEXITCODE -ne 0) { throw 'Evidence checkpoint failed' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoking-full-evidence-${{ github.run_id }}
          path: smoking-evidence-artifact/
          retention-days: 14
          if-no-files-found: warn
