name: SEO v2 desktop UI smoke (no publishing)

on:
  push:
    branches:
      - fix/seo-ukrainian-title-preservation-20261030
    paths:
      - 'src/rg_youtube_control/main.py'
      - 'src/rg_youtube_control/seo_v2_*.py'
      - 'src/rg_youtube_control/seo_v3_*.py'
      - 'tests/test_seo_v2_ui.py'
      - '.github/workflows/seo-v2-desktop-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt headless runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install standalone desktop smoke requirements
        run: python -m pip install pytest 'PySide6>=6.7'
      - name: Compile SEO v2 app integration
        run: python -m compileall -q src/rg_youtube_control/main.py src/rg_youtube_control/seo_v2_ui.py
      - name: Confirm explicit-click mode and unchanged SRT
        run: python -m pytest -q tests/test_seo_v2_ui.py
