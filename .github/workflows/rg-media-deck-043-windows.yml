name: RG Media Deck 0.4.3 Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [rg-media-deck-0-4-3]
    paths:
      - 'rg_media_deck/**'
      - '.github/workflows/rg-media-deck-043-windows.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: rg_media_deck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rg_media_deck/requirements.txt
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.16.0 Pillow==11.3.0
      - name: Generate multi-resolution Windows app icon
        shell: pwsh
        run: |
          python build_icon.py
          if (!(Test-Path assets/RG_Media_Deck.ico)) { throw 'App icon missing' }
      - name: Validate Windows rollback supervisor PowerShell syntax
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from update_rollback import WATCHDOG_SCRIPT; Path('rollback_syntax.ps1').write_text(WATCHDOG_SCRIPT, encoding='utf-8')"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'rollback_syntax.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "Rollback PowerShell syntax invalid: $errors" }
      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Build frozen Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name RG_Media_Deck --icon assets/RG_Media_Deck.ico --add-data 'assets/RG_Media_Deck.ico;assets' --collect-all PySide6.QtMultimedia --collect-all PySide6.QtMultimediaWidgets --collect-all imageio_ffmpeg --collect-all watchdog app.py
          if (!(Test-Path dist/RG_Media_Deck/RG_Media_Deck.exe)) { throw 'Missing EXE' }
      - name: GUI smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/RG_Media_Deck/RG_Media_Deck.exe' -ArgumentList '--selftest' -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Selftest failed: $($process.ExitCode)" }
      - name: Validate ZIP updater PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path 'zip_update/Apply_RG_Media_Deck_Update.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "Invalid ZIP updater PowerShell syntax: $errors" }
      - name: Package complete ZIP update (NO installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_zip,dist_release | Out-Null
          Copy-Item -Path dist/RG_Media_Deck -Destination dist_zip/RG_Media_Deck -Recurse -Force
          Copy-Item zip_update/Apply_RG_Media_Deck_Update.ps1 -Destination dist_zip/
          Copy-Item zip_update/*.cmd -Destination dist_zip/
          Set-Content -Path dist_zip/version.txt -Value '0.4.3' -NoNewline -Encoding utf8
          Compress-Archive -Path dist_zip/* -DestinationPath dist_release/RG_Media_Deck_Update.zip -CompressionLevel Optimal
          $zip = 'dist_release/RG_Media_Deck_Update.zip'
          if (!(Test-Path $zip)) { throw 'ZIP update missing' }
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + '  RG_Media_Deck_Update.zip' |
            Set-Content 'dist_release/RG_Media_Deck_Update.zip.sha256' -Encoding Ascii
          Expand-Archive $zip -DestinationPath 'dist_zip_verify' -Force
          if (!(Test-Path 'dist_zip_verify/RG_Media_Deck/RG_Media_Deck.exe')) { throw 'EXE not packaged' }
          $check = Start-Process -FilePath 'dist_zip_verify/RG_Media_Deck/RG_Media_Deck.exe' -ArgumentList '--selftest' -PassThru -Wait -NoNewWindow
          if ($check.ExitCode -ne 0) { throw "Packed EXE failed GUI selftest: $($check.ExitCode)" }
      - name: Test ZIP patch application and previous version backup
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'RGMediaDeck_PatchTest'
          Copy-Item 'dist/RG_Media_Deck' -Destination $target -Recurse
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'dist_zip_verify/Apply_RG_Media_Deck_Update.ps1' -InstallDir $target -NonInteractive -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw 'ZIP patch apply test failed' }
          if (!(Test-Path (Join-Path $target 'RG_Media_Deck.exe'))) { throw 'Patched EXE missing' }
          $backups = @(Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'RG Media Deck.backup.*')
          if ($backups.Count -lt 1) { throw 'Previous version backup missing' }
      - name: Upload ZIP update artifact
        uses: actions/upload-artifact@v4
        with:
          name: RG_Media_Deck_0.4.3_ZIP_Update
          path: |
            rg_media_deck/dist_release/RG_Media_Deck_Update.zip
            rg_media_deck/dist_release/RG_Media_Deck_Update.zip.sha256
          if-no-files-found: error
      - name: Publish ZIP-only update release
        if: github.ref == 'refs/heads/rg-media-deck-0-4-3'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'rg-media-deck-v0.4.3'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag exists; refusing overwrite" }
          gh release create $tag dist_release/RG_Media_Deck_Update.zip dist_release/RG_Media_Deck_Update.zip.sha256 --target $env:GITHUB_SHA --title 'RG Media Deck 0.4.3 ZIP Update' --notes 'ZIP only, no installer. Adds editable START, PAUSE, SPEED+/SPEED-, VOLUME+/VOLUME-, MUTE global hotkeys and GUI hotkey editor. Extract ZIP and run ОНОВИТИ_RG_Media_Deck.cmd once to update from 0.4.2. In-app ZIP updater enabled for future versions.'
