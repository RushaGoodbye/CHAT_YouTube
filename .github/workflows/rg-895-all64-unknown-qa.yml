name: RG 895 full 64 unknown layout visual QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rg-895-all64-unknown-qa.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - shell: pwsh
        env: {PYTHONIOENCODING: utf-8}
        run: |
          & 'F:\RG_AUTO_EDIT\RG Auto Edit Runtime\venv\Scripts\python.exe' -X utf8 rg_repair_20261110/rg_895_all_unknown_64_qa.py
          if($LASTEXITCODE -ne 0){throw 'RG895_ALL_UNKNOWN_SAMPLE_AUDIT_FAILED'}
