[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rg-youtube-control"
version = "0.3.10"
description = "Windows desktop control center for RASHA GOODBYE YouTube channels"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "google-api-python-client>=2.150",
  "google-auth>=2.35",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "keyring>=25.4",
]

[project.scripts]
rg-youtube-control = "rg_youtube_control.main:main"

[tool.setuptools.packages.find]
where = ["src"]

