[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rg-youtube-control"
version = "0.7.41"
description = "Windows desktop control center for RASHA GOODBYE YouTube channels"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "google-api-python-client>=2.150",
  "google-auth>=2.35",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "keyring>=25.4",
  "yt-dlp>=2026.8.19",
  "youtube-transcript-api>=1.2.4",
  "rapidfuzz>=3.12,<4",
  "youtube-comment-downloader==0.1.83",
]

[project.optional-dependencies]
# Lingua 2.x requires Python >=3.12; the production build currently uses
# 3.11, so this is a tested opt-in local QA capability, not an installer bloat.
seo-language = [
  "lingua-language-detector>=2.0,<3; python_version >= '3.12'",
]

[project.scripts]
rg-youtube-control = "rg_youtube_control.main:main"

[tool.setuptools.packages.find]
where = ["src"]