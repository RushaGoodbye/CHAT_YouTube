# Isolated passive dashboard. No connection to Telegram or production Docker stack.
# Start only AFTER local owner-of-publications and NAS access checks.
services:
  gatus:
    image: ghcr.io/twin/gatus:v5.37.0
    container_name: rg-nas-gatus
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
      GATUS_MONITOR_TOKEN: ${GATUS_MONITOR_TOKEN:?Set a private local token}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
    security_opt:
      - no-new-privileges:true
