# External endpoints receive only local status, never Telegram messages.
# The 20m heartbeat detects a stopped 5m NAS observer task.
storage:
  type: sqlite
  path: /data/gatus.sqlite
external-endpoints:
  - name: scheduler
    group: rg-nas
    token: "${GATUS_MONITOR_TOKEN}"
    heartbeat:
      interval: 20m
  - name: control-center
    group: rg-nas
    token: "${GATUS_MONITOR_TOKEN}"
    heartbeat:
      interval: 20m
  - name: telegram-components
    group: rg-nas
    token: "${GATUS_MONITOR_TOKEN}"
    heartbeat:
      interval: 20m
