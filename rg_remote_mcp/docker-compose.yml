services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rg-nas-mcp-hub
    restart: unless-stopped
    environment:
      RG_REMOTE_HOST: 0.0.0.0
      RG_REMOTE_PORT: 8765
      RG_WORKER_YOUTUBE_URL: http://youtube-worker:8780
      RG_WORKER_TELEGRAM_URL: http://telegram-worker:8780
      RG_WORKER_AUTO_EDIT_URL: http://auto-edit-worker:8780
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - /volume1/docker/RG_NAS_MCP/ALEXPC:/alexpc:rw
    depends_on:
      youtube-worker:
        condition: service_healthy
      telegram-worker:
        condition: service_healthy
      auto-edit-worker:
        condition: service_healthy
    networks:
      - youtube_net
      - telegram_net
      - auto_edit_net

  youtube-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: rg-mcp-youtube
    restart: unless-stopped
    read_only: true
    environment:
      RG_WORKER_CONTOUR: youtube
      RG_WORKER_ROOT: /workspace
      RG_WORKER_COMMANDS: python3,git,node,npm,npx,ls,find,grep,du,df
    volumes:
      - ${RG_AUTO_EDIT_HOST_ROOT:-/volume1/RG_AUTO_EDIT}/YOUTUBE_CONTROL:/workspace:rw
    tmpfs:
      - /tmp
    expose:
      - "8780"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8780/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - youtube_net

  telegram-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: rg-mcp-telegram
    restart: unless-stopped
    read_only: true
    environment:
      RG_WORKER_CONTOUR: telegram
      RG_WORKER_ROOT: /workspace
      RG_WORKER_COMMANDS: python3,git,node,npm,npx,ls,find,grep,du,df
    volumes:
      - /volume1/docker/RG_DEPLOY/cloudflare-video-moderation:/workspace/deploy/cloudflare-video-moderation:rw
      - /volume1/docker/RG_ALERTS_DEPLOY/cloudflare-alerts:/workspace/deploy/cloudflare-alerts:rw
      - /volume1/docker/RG_CONTENT_DEPLOY/cloudflare-content-hub:/workspace/deploy/cloudflare-content-hub:rw
      - /volume1/docker/RG_ADMIN_CONTROL_DEPLOY/cloudflare-admin-control:/workspace/deploy/cloudflare-admin-control:rw
      - /volume1/docker/RG_MONITOR/app:/workspace/monitor/app:rw
      - /volume1/docker/RG_MONITOR/public_monitor:/workspace/monitor/public_monitor:rw
      - /volume1/docker/RG_MONITOR/data:/workspace/monitor/data:rw
      - /volume1/docker/RG_MONITOR/logs:/workspace/monitor/logs:rw
      - /volume1/docker/RG_NAS_WORK:/workspace/nas_work:rw
      - /volume1/docker/RG_NAS_STATE:/workspace/nas_state:rw
      - /volume1/docker/RG_NAS_CONTROL:/workspace/nas_control:rw
      - /volume1/docker/RG_TELEGRAM:/workspace/rg_telegram:rw
    tmpfs:
      - /tmp
    expose:
      - "8780"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8780/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - telegram_net

  auto-edit-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: rg-mcp-auto-edit
    restart: unless-stopped
    read_only: true
    environment:
      RG_WORKER_CONTOUR: auto_edit
      RG_WORKER_ROOT: /workspace
      RG_WORKER_COMMANDS: python3,git,node,npm,npx,ls,find,grep,du,df
    volumes:
      - ${RG_AUTO_EDIT_HOST_ROOT:-/volume1/RG_AUTO_EDIT}/BACKUPS:/workspace/BACKUPS:rw
      - ${RG_AUTO_EDIT_HOST_ROOT:-/volume1/RG_AUTO_EDIT}/CACHE:/workspace/CACHE:rw
      - ${RG_AUTO_EDIT_HOST_ROOT:-/volume1/RG_AUTO_EDIT}/CONTROL:/workspace/CONTROL:rw
      - ${RG_AUTO_EDIT_HOST_ROOT:-/volume1/RG_AUTO_EDIT}/DASHBOARD:/workspace/DASHBOARD:rw
      - ${RG_AUTO_EDIT_HOST_ROOT:-/volume1/RG_AUTO_EDIT}/DATABASE:/workspace/DATABASE:rw
      - ${RG_AUTO_EDIT_HOST_ROOT:-/volume1/RG_AUTO_EDIT}/DIAGNOSTICS:/workspace/DIAGNOSTICS:rw
      - ${RG_AUTO_EDIT_HOST_ROOT:-/volume1/RG_AUTO_EDIT}/DISASTER_RECOVERY:/workspace/DISASTER_RECOVERY:rw
      - ${RG_AUTO_EDIT_HOST_ROOT:-/volume1/RG_AUTO_EDIT}/LEARNING:/workspace/LEARNING:rw
      - ${RG_AUTO_EDIT_HOST_ROOT:-/volume1/RG_AUTO_EDIT}/LOGS:/workspace/LOGS:rw
      - ${RG_AUTO_EDIT_HOST_ROOT:-/volume1/RG_AUTO_EDIT}/PROJECTS:/workspace/PROJECTS:rw
      - ${RG_AUTO_EDIT_HOST_ROOT:-/volume1/RG_AUTO_EDIT}/RUNS:/workspace/RUNS:rw
      - ${RG_AUTO_EDIT_HOST_ROOT:-/volume1/RG_AUTO_EDIT}/THUMBNAIL_ASSETS:/workspace/THUMBNAIL_ASSETS:rw
      - ${RG_AUTO_EDIT_HOST_ROOT:-/volume1/RG_AUTO_EDIT}/UPDATES:/workspace/UPDATES:rw
    tmpfs:
      - /tmp
    expose:
      - "8780"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8780/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - auto_edit_net

networks:
  youtube_net:
  telegram_net:
  auto_edit_net:
